  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M16.5 16.5L21 21"/></symbol>

  <symbol id="i-eye-off" viewBox="0 0 24 24"><path d="M3 3l18 18"/><path d="M10.6 6.1A9.7 9.7 0 0 1 12 5.5c6.4 0 10 6.5 10 6.5a18 18 0 0 1-3.2 4"/><path d="M6.3 8.2A17.4 17.4 0 0 0 2 12s3.6 6.5 10 6.5a9.6 9.6 0 0 0 3.9-.8"/><path d="M9.9 10a2.6 2.6 0 0 0 3.6 3.6"/></symbol>

<div class="app">

  <div class="layout">

    <!-- ============ 左侧：功能控制面板 ============ -->
    <aside class="panel left">
      <div class="brand">
        <div class="mark"><svg aria-hidden="true" class="ic lg"><use href="#i-logo"/></svg></div>
        <div>
          <div class="nm">Ashen图纸库</div>
          <div class="sub">ASHEN PATTERN LIBRARY</div>
        </div>
      </div>
      <div class="panel-body">

        <div class="sec">
          <div class="sec-t">底图设置</div>
          <div class="card">
            <div class="grp">
              <div id="refEmpty">
                <button class="dropzone" id="btnPickImg">
                  <svg aria-hidden="true" class="ic lg"><use href="#i-upload"/></svg>
                  <span>上传底图</span>
                </button>
              </div>
              <input accept="image/*,.json,.bead,.bead.json,application/json" hidden id="fileImg" type="file">
              <!-- 单一预览框：二选一，只显示用户当前选用的图（底图或重绘稿） -->
              <div class="ref-view" hidden id="refView">
                <div class="ref-thumb">
                  <img alt="参考图预览" id="refThumbImg">
                </div>
                <button class="btn sm act block" id="btnReupload"><svg aria-hidden="true" class="ic sm"><use href="#i-upload"/></svg>重新上传</button>
              </div>
            </div>
            <div class="grp">
              <div class="fld">
                <label class="f">画布尺寸 <span class="adv"><b id="sizeTag">—</b><button class="rec-apply" id="btnApplyAdvice" hidden title="应用推荐尺寸"><svg aria-hidden="true" class="ic sm"><use href="#i-check"/></svg></button></span></label>
                <div class="dim-row" style="margin-bottom:var(--s3)">
                  <div class="dim-field"><span>宽</span><input id="inCols" max="200" min="4" type="number" value="52"></div>
                  <button class="lock-btn" id="btnLockRatio"><svg aria-hidden="true" class="ic sm"><use href="#i-unlock"/></svg></button>
                  <div class="dim-field"><span>高</span><input id="inRows" max="200" min="4" type="number" value="52"></div>
                </div>
                <div class="presets" id="presets"></div>
              </div>
            </div>
            <div class="grp" id="refMoveFld" hidden>
              <div class="fld">
                <label class="f">底图位置</label>
                <div class="segbar" id="fitRow" style="margin-bottom:var(--s3)">
                  <button data-fit="cover">填充裁剪</button>
                  <button data-fit="contain">完整留白</button>
                </div>
                <div class="ref-move" id="refMove">
                  <button type="button" data-mv="up">↑</button>
                  <button type="button" data-mv="left">←</button>
                  <button type="button" data-mv="center">居中</button>
                  <button type="button" data-mv="right">→</button>
                  <button type="button" data-mv="down">↓</button>
                </div>
              </div>
            </div>
            <div class="grp">
              <button class="btn grad block" id="btnImg2Pat"><svg aria-hidden="true" class="ic sm"><use href="#i-sparkle"/></svg>一键转图纸</button>
            </div>
          </div>
        </div>

        <div class="sec">
          <div class="sec-t">图纸优化</div>
          <div class="card">
            <div class="grp">
              <div class="fld">
                <label class="f">亮度 <b id="lbBright">0</b></label>
                <input id="rngBright" min="-100" max="100" step="5" type="range" value="0">
              </div>
            </div>
            <div class="grp">
              <div class="fld">
                <label class="f">对比度 <b id="lbContrast">0</b></label>
                <input id="rngContrast" min="-100" max="100" step="5" type="range" value="0">
              </div>
            </div>
            <div class="grp">
              <div class="fld">
                <label class="f" title="拉高 = 脸部渐变细阶更多、更真实；拉到 0 = 回到干净平涂">脸部层次 <b id="lbDither">70</b></label>
                <input id="rngDither" min="0" max="100" step="5" type="range" value="70">
              </div>
            </div>
            <div class="grp">
              <div class="fld">
                <label class="f">细节调整</label>
                <div class="segbar" id="warmRow" style="margin-bottom:var(--s3)">
                  <button class="active" data-warm="0">原图</button>
                  <button data-warm="1">暖肤</button>
                </div>
                <div class="btn-row">
                  <button class="btn sm act" id="btnLocalRedo"><svg aria-hidden="true" class="ic sm"><use href="#i-sparkle"/></svg>局部细化</button>
                  <button class="btn sm act" id="btnSimplify"><svg aria-hidden="true" class="ic sm"><use href="#i-layers"/></svg>精简用色</button>
                </div>
              </div>
            </div>
            <div class="grp">
              <div class="fld">
                <label class="f">图纸缩放 <b id="lbRS">52 × 52</b></label>
                <div class="scale-row" id="scaleRow">
                  <button data-k="2">2×</button>
                  <button data-k="1.5">1.5×</button>
                  <button data-k="0.75">0.75×</button>
                  <button data-k="0.5">0.5×</button>
                </div>
              </div>
            </div>
            <div class="grp">
              <label class="sw"><span>显示网格</span><input checked id="chkGrid" type="checkbox"><span class="track"></span></label>
              <label class="sw"><span>格内色号</span><input id="chkCodes" type="checkbox" checked><span class="track"></span></label>
            </div>
          </div>
        </div>

        

        

      </div>
    </aside>

    <!-- ============ 中间：预览区 ============ -->
    <section class="stage-area">
      <div class="stage-toolbar">
        <button class="btn sm act drawer-btn" id="btnDrawerL"><svg aria-hidden="true" class="ic sm"><use href="#i-sliders"/></svg>设置</button>
        <span class="tb-label">缩放</span>
        <div class="zoom-box">
          <button id="btnZoomOut"><svg aria-hidden="true" class="ic sm"><use href="#i-minus"/></svg></button>
          <span class="val" id="zoomVal">100%</span>
          <button id="btnZoomIn"><svg aria-hidden="true" class="ic sm"><use href="#i-plus"/></svg></button>
        </div>
        <div class="tb-sep"></div>
        <button class="btn sm quiet" id="btnFit"><svg aria-hidden="true" class="ic sm"><use href="#i-fit"/></svg>适应屏幕</button>
        <button class="btn sm quiet" id="btnZoom100">1:1</button>
        <div class="tb-sep"></div>
        <span class="tb-label">格数</span>
        <span class="tb-label" id="infoSize">52 × 52</span>
        <div class="tb-right">
          <button class="btn sm act drawer-btn" id="btnDrawerR"><svg aria-hidden="true" class="ic sm"><use href="#i-palette"/></svg>色板</button>
          <span class="tb-label" id="infoPos">—</span>
          <span class="tb-label" id="infoZoom2">实物 13.5 × 13.5 cm</span>
          <button class="btn grad sm" id="btnExportPNG"><svg aria-hidden="true" class="ic sm"><use href="#i-download"/></svg>导出图纸</button>
          <button class="btn sm act" id="btnExportCover"><svg aria-hidden="true" class="ic sm"><use href="#i-cover"/></svg>生成封面</button>
        </div>
      </div>

      <div class="canvas-wrap" id="canvasWrap">
        <aside class="layer-panel" id="layerPanel">
          <div class="lp-head">
            <span class="lp-title">图层</span>
            <span class="lp-count" id="lpCount">1 / 10</span>
            <button class="lp-add" id="lpAdd" title="新建图层（⌘/Ctrl+Shift+N）"><svg aria-hidden="true" class="ic sm"><use href="#i-plus"/></svg><span class="lp-add-t">新建图层</span></button>
          </div>
          <div class="lp-list" id="lpList"></div>
          <button class="lp-merge-sel" hidden id="lpMergeSel">合并勾选的 <b id="lpSelN">0</b> 层</button>
        </aside>
        <div class="canvas-scroll ax-center ay-center" id="canvasScroll">
          <div class="canvas-frame" id="canvasFrame">
            <div class="canvas-stack" id="canvasStack">
              <canvas id="refCanvas"></canvas>
              <canvas id="gridCanvas"></canvas>
            </div>
          </div>
        </div>
      </div>

      <div class="dock" id="dock">
        <div class="dock-tools" id="tools">
          <div class="cur-tag" id="curTag">
            <span class="cur-mini" id="curMini"></span>
            <span class="cur-txt" id="curMiniText">H7 纯黑</span>
          </div>
          <span class="dock-div" id="dockDiv1"></span>
          <button class="tool" data-tool="hand" title="抓手（H）"><svg aria-hidden="true" class="ic "><use href="#i-hand"/></svg>抓手</button>

function dbOpen(){

if (db){ res(db); return; }
if (dbBroken || !window.indexedDB){ rej(new Error("no-idb")); return; }
var rq, done = false;
try{ rq = indexedDB.open(DB_NAME, 1); }catch(e){ dbBroken = true; rej(e); return; }

if (done) return; done = true; dbBroken = true; rej(new Error("idb-timeout"));
}, 4000);
function fail(err){ if (done) return; done = true; clearTimeout(timer); dbBroken = true; rej(err || new Error("idb")); }

var d = rq.result;
if (!d.objectStoreNames.contains(DB_STORE)) d.createObjectStore(DB_STORE, { keyPath: "id", autoIncrement: true });
};
rq.onsuccess = function(){
if (done) return; done = true; clearTimeout(timer); db = rq.result; res(db);
};
rq.onerror = function(){ fail(rq.error); };
rq.onblocked = function(){ fail(new Error("idb-blocked")); };
});
}
function dbTx(mode, fn){

tx.oncomplete = function(){ res(out && out.result !== undefined ? out.result : out); };
tx.onerror = function(){ rej(tx.error); };
});
});
}

}

var CRC32_T = (function(){
var t = new Uint32Array(256), n, k, c;
for (n = 0; n < 256; n++){

})();

function pngEmbedText(blob, keyword, text){
return readArrayBuffer(blob).then(function(ab){
var u = new Uint8Array(ab), p = 8, iend = -1, len, type;
if (u.length < 8 || u[0] !== 0x89 || u[1] !== 0x50) throw new Error("not png");
while (p + 8 <= u.length){
len = (u[p] << 24 | u[p+1] << 16 | u[p+2] << 8 | u[p+3]) >>> 0;
if (len > u.length) break;
type = String.fromCharCode(u[p+4], u[p+5], u[p+6], u[p+7]);
if (type === "IEND"){ iend = p; break; }
p += 12 + len;
}
if (iend < 0) throw new Error("no iend");

data.set(kw, 0); data.set(tx, kw.length);

out.set(u.subarray(0, iend), 0);
out[q] = (data.length >>> 24) & 255; out[q+1] = (data.length >>> 16) & 255;
out[q+2] = (data.length >>> 8) & 255; out[q+3] = data.length & 255;
out[q+4] = 116; out[q+5] = 69; out[q+6] = 88; out[q+7] = 116;     
out.set(data, q + 8);
cr = crc32(out.subarray(q + 4, q + 8 + data.length));
var cq = q + 8 + data.length;
out[cq] = (cr >>> 24) & 255; out[cq+1] = (cr >>> 16) & 255;
out[cq+2] = (cr >>> 8) & 255; out[cq+3] = cr & 255;
out.set(u.subarray(iend), cq + 4);

function pngReadText(ab, keyword){
var u = new Uint8Array(ab), p = 8, len, type, i, s, z;
if (u.length < 8 || u[0] !== 0x89 || u[1] !== 0x50) return null;
while (p + 8 <= u.length){
len = (u[p] << 24 | u[p+1] << 16 | u[p+2] << 8 | u[p+3]) >>> 0;
if (len > u.length) break;
type = String.fromCharCode(u[p+4], u[p+5], u[p+6], u[p+7]);
if (type === "tEXt"){
var start = p + 8, end = Math.min(start + len, u.length);
s = "";
for (i = start; i < end; i++) s += String.fromCharCode(u[i]);
z = s.indexOf("\0");
if (z >= 0 && s.slice(0, z) === keyword) return s.slice(z + 1);
}
if (type === "IEND") break;
p += 12 + len;
}
return null;
}

var el = e.target.closest ? e.target.closest("[data-name]") : null;
if (!el) return;
var i = +el.getAttribute("data-name");
el.contentEditable = "true"; el.focus();
var rg = document.createRange(); rg.selectNodeContents(el);
var sel = window.getSelection(); sel.removeAllRanges(); sel.addRange(rg);
function commit(){
el.contentEditable = "false";
var v = (el.textContent || "").trim().slice(0, 16);
state.layers[i].name = v || state.layers[i].name;
renderLayerPanel(); saveDraft();
}
el.addEventListener("blur", commit, { once: true });
el.addEventListener("keydown", function(ev){
if (ev.key === "Enter"){ ev.preventDefault(); el.blur(); }
if (ev.key === "Escape"){ el.textContent = state.layers[i].name; el.blur(); }
});
});

navigator.clipboard.writeText(txt).then(function(){ toast("已复制到剪贴板"); }, function(){ toast("复制失败"); });
} else toast("当前环境不支持复制");
});
document.addEventListener("keydown", function(e){
if (/input|select|textarea/i.test(e.target.tagName)) return;
if (e.target.isContentEditable) return;   
var k = e.key.toLowerCase();
if (k === "escape" && (openDrawer || document.querySelector(".layer-panel.open"))){
closeAllOverlays(); return;
}
if (k === "escape"){
var lpp = document.querySelector(".layer-panel");
if (lpp && lpp.classList.contains("open")){
lpp.classList.remove("open");
$("btnLayerPad").classList.remove("active");
return;
}
}
if ((e.ctrlKey || e.metaKey) && k === "z"){ e.preventDefault(); if (e.shiftKey) redo(); else undo(); return; }
if ((e.ctrlKey || e.metaKey) && k === "y"){ e.preventDefault(); redo(); return; }
if ((e.ctrlKey || e.metaKey) && k === "s"){ e.preventDefault(); saveProject(); return; }
if (k === " "){ spaceDown = true; gridCanvas.style.cursor = "grab"; e.preventDefault(); return; }
if ((e.ctrlKey || e.metaKey) && e.shiftKey && k === "n"){ e.preventDefault(); addLayer(); return; }
if (k === "]"){ e.preventDefault(); setActiveLayer(state.active + 1, false); return; }
if (k === "["){ e.preventDefault(); setActiveLayer(state.active - 1, false); return; }
if (k === "h"){ e.preventDefault(); setTool("hand"); return; }
if (k === "b") setTool("pencil");
else if (k === "e"){
if (state.tool !== "eraser") setTool("eraser");
else {
var EM = ["cell", "rect", "region"], EMN = {cell:"单格", rect:"框选", region:"同色连片"};
state.eraseMode = EM[(EM.indexOf(state.eraseMode) + 1) % EM.length];
syncEraseMode();
toast("擦除方式：" + EMN[state.eraseMode]);
}
}
else if (k === "g") setTool("fill");
else if (k === "i") setTool("picker");
else if (k === "r") setTool("rect");
else if (k === "l") setTool("line");
else if (k === "t") setTool("replace");
else if (k === "x") clearActiveLayer();
else if (k === "c") setTool("ellipse");
else if (k === "o") setTool("outline");
else if (k === "v") setTool("move");
});
document.addEventListener("keyup", function(e){
if (e.key === " "){ spaceDown = false; gridCanvas.style.cursor = "crosshair"; }
});
var bootAt = Date.now();
var formFlipT = null;
function formKey(){
return (document.documentElement.classList.contains("tablet") ? "T" : "") +
(document.documentElement.classList.contains("tland") ? "L" : "") + "D";
}
window.addEventListener("resize", function(){
var before = formKey();
updateDeviceClass();
if (formKey() !== before){
clearTimeout(formFlipT);
formFlipT = setTimeout(function(){
updateDeviceClass();
if (formKey() !== before){
try{ if (typeof saveDraftNow === "function") saveDraftNow(); }catch(e){}
location.reload();               
return;
}
fitZoom(); updateLayout(); fitPadDock(); placeEraseMenu();
}, 260);
return;
}
if (Date.now() - bootAt < 2000) fitZoom();   
updateLayout();
fitPadDock();   
placeEraseMenu();   
});
window.addEventListener("orientationchange", function(){
setTimeout(function(){
updateDeviceClass();
updateLayout(); fitPadDock(); fitZoom();
}, 280);
});
}
function placeEraseMenu(){
var wrap = $("segWrap");
if (!wrap) return;
var eb = document.querySelector('[data-tool="eraser"]');
if (!eb) return;
var host = wrap.offsetParent, hostW = host ? host.clientWidth : 0;
var lf = eb.offsetLeft, wW = wrap.offsetWidth || 0;
if (hostW > 0 && wW > 0 && lf + wW > hostW - 2) lf = Math.max(0, hostW - wW - 2);
wrap.style.left = lf + "px";
}
function setTool(t){
state.tool = t;
var tools = $("tools").querySelectorAll(".tool");
for (var i = 0; i < tools.length; i++){
tools[i].classList.toggle("active", tools[i].getAttribute("data-tool") === t);
}
if (localRedo && t !== "rect") localRedo = false;
resetCanvasCursor();
var wrap = $("segWrap");
if (wrap){
placeEraseMenu();
wrap.classList.toggle("open", t === "eraser");
}
if ($("segWrapPad")) $("segWrapPad").classList.toggle("open", t === "eraser");
var ptl = document.querySelectorAll("#padDockR [data-ptool]");
for (var pj = 0; pj < ptl.length; pj++){
ptl[pj].classList.toggle("active", ptl[pj].getAttribute("data-ptool") === t);
}
}
function ensureNumSteppers(){
var list;
try{ list=document.querySelectorAll('input[type=number]'); }catch(e){ return; }
for (var i=0;i<list.length;i++){
var inp=list[i];
if (inp._numStep) continue;
if (inp.closest && inp.closest('.dim-field')) continue;
var host=inp.parentNode;
if (!host) continue;
if (getComputedStyle(host).position === 'static') host.style.position='relative';
var box=document.createElement('div');
box.className='num-step';
var up=document.createElement('button'); up.type='button'; up.setAttribute('aria-label','增加');
up.innerHTML='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 15l7-7 7 7" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>';
var dn=document.createElement('button'); dn.type='button'; dn.setAttribute('aria-label','减少');
dn.innerHTML='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 9l7 7 7-7" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>';
(function(inp2){
up.addEventListener('click', function(e){ e.preventDefault(); e.stopPropagation();
try{ inp2.stepUp(); }catch(err){}
inp2.dispatchEvent(new Event('input',{bubbles:true}));
inp2.dispatchEvent(new Event('change',{bubbles:true}));
});
dn.addEventListener('click', function(e){ e.preventDefault(); e.stopPropagation();
try{ inp2.stepDown(); }catch(err){}
inp2.dispatchEvent(new Event('input',{bubbles:true}));
inp2.dispatchEvent(new Event('change',{bubbles:true}));
});
})(inp);
box.appendChild(up); box.appendChild(dn);
host.appendChild(box);
inp._numStep=1;
inp.style.paddingRight='22px';
}
}
function lockPageZoom(){
["gesturestart","gesturechange","gestureend"].forEach(function(t){
document.addEventListener(t, function(e){ e.preventDefault(); }, {passive:false});
});
}

sessionRecover();

function offerSessionRestore(){
if (typeof hasContent !== "function") return;
setTimeout(function(){
if (hasContent()) return;
draftAll().then(function(list){
list = list || [];
var best = null, i;
for (i = 0; i < list.length; i++){
if (!list[i].auto) continue;
if (!best || (list[i].updatedAt || 0) > (best.updatedAt || 0)) best = list[i];
}
if (!best) return;
var when = "";
try{ when = draftRelTime(best.updatedAt); }catch(e){}
toast("上次没画完的「" + (best.name || "未命名图纸") + "」已存草稿箱" +
(when ? "（" + when + "）" : "") + "，点「草稿箱」找回");
}).catch(function(){});
}, 1200);
}
(function(){
var sa = false;
try{ sa = !!(window.matchMedia && matchMedia("(display-mode: standalone)").matches); }catch(e){}
if (!sa){ try{ sa = window.navigator.standalone === true; }catch(e){} }
if (!sa) return;
var ua = "";
try{ ua = navigator.userAgent || ""; }catch(e){}
var ios = /iPad|iPhone|iPod/.test(ua);
if (!ios){
try{ ios = (navigator.platform === "MacIntel") && navigator.maxTouchPoints > 1; }catch(e){}
}
if (!ios) document.documentElement.classList.add("standalone");
})();
init();
})();</script>
