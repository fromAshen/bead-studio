}

/* 小红书封面：3:4 竖版；背景 = 图纸高斯模糊；中间放无网格/无色号的缩小图纸；底部 @作者 */
function exportCover(author, done){
  var st = computeStats();
  if (!st.list.length){ toast("画布还是空的哦"); if (done) done(); return; }
  var CW = 1080, CH = 1440;                     /* 3:4 竖版 */
  var EX = 24;

  /* 1. 先裁到实际内容范围：周围的透明格子不参与封面，图纸不会被空白撑大 */
  var bx0 = state.cols, by0 = state.rows, bx1 = -1, by1 = -1, yy2, xx2;
  for (yy2 = 0; yy2 < state.rows; yy2++){
    for (xx2 = 0; xx2 < state.cols; xx2++){
      if (!state.grid[yy2 * state.cols + xx2]) continue;
      if (xx2 < bx0) bx0 = xx2;
      if (xx2 > bx1) bx1 = xx2;
      if (yy2 < by0) by0 = yy2;
      if (yy2 > by1) by1 = yy2;
    }
  }
  if (bx1 < 0){ toast("画布还是空的哦"); return; }
  var gw = (bx1 - bx0 + 1) * EX, gh = (by1 - by0 + 1) * EX;

  /* 2. 干净图纸：不画网格线、不画格内色号 */
  var sc = state.showCodes;
  state.showCodes = false;
  var g = document.createElement("canvas");
  g.width = gw; g.height = gh;
  var gc = g.getContext("2d");
  for (var y = by0; y <= by1; y++){
    for (var x = bx0; x <= bx1; x++){
      var v = state.grid[y * state.cols + x];
      if (!v) continue;
      drawCell(gc, (x - bx0) * EX, (y - by0) * EX, EX, v - 1, false, true);
    }
  }
  state.showCodes = sc;

  /* 3. 毛玻璃背景：主色打底 + 多级下采样模糊。
     不用 ctx.filter —— Safari/手机 WebView 的 canvas filter 赋值能过
     但渲染不生效（背景变锐利格子）；drawImage 缩放在全平台行为一致 */
  var cv = document.createElement("canvas");
  cv.width = CW; cv.height = CH;
  var c = cv.getContext("2d");
  c.fillStyle = PALETTE[st.list[0].idx].h; c.fillRect(0, 0, CW, CH);
  var bs = Math.max(CW / gw, CH / gh) * 1.8;
  var bw = gw * bs, bh = gh * bs;
  var bx = (CW - bw) / 2, by = (CH - bh) / 2;
  /* 三级金字塔：图纸 → 1/6 → 1/24 → 12px，逐级把格子融成柔和色块 */
  var prev = g, tws = [Math.max(24, Math.round(bw / 6)), Math.max(12, Math.round(bw / 24)), 12];
  for (var ti = 0; ti < tws.length; ti++){
    var tb = document.createElement("canvas");
    tb.width = tws[ti];
    tb.height = Math.max(2, Math.round(tws[ti] * bh / bw));
    var tbc = tb.getContext("2d");
    tbc.imageSmoothingEnabled = true; tbc.imageSmoothingQuality = "high";
    tbc.drawImage(prev, 0, 0, tb.width, tb.height);
    prev = tb;
  }
  /* 小图上做像素级提饱和（等价原 saturate(1.45)，几十个像素零开销） */
  (function(){
    var pctx = prev.getContext("2d");
    var dd = pctx.getImageData(0, 0, prev.width, prev.height);
    var a = dd.data, p;
    for (p = 0; p < a.length; p += 4){
      var r = a[p], g2 = a[p + 1], b2 = a[p + 2], L = 0.299 * r + 0.587 * g2 + 0.114 * b2;
      a[p] = L + (r - L) * 1.45; a[p + 1] = L + (g2 - L) * 1.45; a[p + 2] = L + (b2 - L) * 1.45;
    }
    pctx.putImageData(dd, 0, 0);
  })();
  c.imageSmoothingEnabled = true; c.imageSmoothingQuality = "high";
  c.drawImage(prev, bx, by, bw, bh);
  c.fillStyle = "rgba(255,255,255,.32)"; c.fillRect(0, 0, CW, CH);   /* 磨砂白雾 */

  /* 4. 中间图纸：宽 = 封面宽的一半，圆角裁切，无描边无阴影 */
  var s = Math.min(CW * 0.5 / gw, CH * 0.62 / gh);
  var dw = Math.round(gw * s), dh = Math.round(gh * s);
  var dx = Math.round((CW - dw) / 2), dy = Math.round((CH - dh) / 2) - 60;
  c.save();
  roundRectPath(c, dx, dy, dw, dh, Math.round(Math.min(dw, dh) * 0.035) + 6);
  c.clip();
  c.drawImage(g, dx, dy, dw, dh);
  c.restore();

  /* 5. 作者名 @xxx：按背景亮度自动配字色 */
  var au = (author || "").trim() || DEF_AUTHOR;
  var txt = "@" + au;
  var fs = Math.round(CW * 0.042);
  c.font = "500 " + fs + "px -apple-system,'PingFang SC',sans-serif";
  c.textAlign = "center"; c.textBaseline = "alphabetic";
  var ty = dy + dh + Math.round(fs * 1.35);
  var lum = 0.5;
  try {
    var sw = Math.min(CW - 40, Math.round(c.measureText(txt).width) + 100);
    var sh = Math.round(fs * 1.1);
    var sx = Math.max(0, Math.round((CW - sw) / 2));
    var sy = Math.max(0, Math.round(ty - fs * 0.95));
    var dd = c.getImageData(sx, sy, sw, sh).data;
    var sum = 0, cn = 0;
    for (var i = 0; i < dd.length; i += 16){
      sum += (dd[i] * 0.299 + dd[i + 1] * 0.587 + dd[i + 2] * 0.114) / 255; cn++;
    }
    if (cn) lum = sum / cn;
  } catch(err){}
  if (lum >= 0.55){
    c.fillStyle = "rgba(29,29,31,.9)";
  } else {
    c.fillStyle = "rgba(255,255,255,.97)";
    c.shadowColor = "rgba(0,0,0,.4)"; c.shadowBlur = 20;
  }
  c.fillText(txt, CW / 2, ty);
  c.shadowBlur = 0; c.shadowColor = "transparent";

  cv.toBlob(function(blob){
    if (!blob){ toast("导出失败：封面生成失败，再试一次"); if (done) done(); return; }
    /* v99：封面跟着图纸名走 —— 0924-01-cover.png */
    deliverBlob(blob, (projName ? safeFileName(projName) : "bead-cover-" + state.cols + "x" + state.rows) + "-cover.png", "小红书封面", done);
  }, "image/png");
}

/* =========================================================
   v137：电脑端导出 = 封面 + 图纸 + 镜像图纸 + 工程文件，打成一个 zip
   逐个下载要点四次「保存」，下载文件夹里还容易和上一张混。
   PNG / JSON 本身已经是压缩格式，zip 里再 deflate 一遍几乎不省体积，
   所以这里用 store（只打包、不压缩）模式，自己写几十行就够了，不引第三方库。
   ========================================================= */
var ZCRC_TAB = null;
function zipCRC(u8){
  if (!ZCRC_TAB){
    ZCRC_TAB = new Int32Array(256);
    for (var n = 0; n < 256; n++){
      var c = n;
      for (var k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
      ZCRC_TAB[n] = c;
    }
  }
  var r = -1;
  for (var i = 0; i < u8.length; i++) r = (r >>> 8) ^ ZCRC_TAB[(r ^ u8[i]) & 0xFF];
  return (r ^ -1) >>> 0;
}
function zipU16(v){ return [v & 255, (v >> 8) & 255]; }
function zipU32(v){ return [v & 255, (v >> 8) & 255, (v >> 16) & 255, (v >>> 24) & 255]; }
/* entries: [{name, blob}] → Promise<Blob>。0x0800 = 文件名按 UTF-8 解，中文名不乱码 */
function zipBuild(entries){
  return Promise.all(entries.map(function(e){
    return readArrayBuffer(e.blob).then(function(ab){ return new Uint8Array(ab); });
  })).then(function(datas){
    var d = new Date(), i;
    var tm = ((d.getHours() << 11) | (d.getMinutes() << 5) | (d.getSeconds() >> 1)) & 0xFFFF;
    var dt = (((d.getFullYear() - 1980) << 9) | ((d.getMonth() + 1) << 5) | d.getDate()) & 0xFFFF;
    var chunks = [], total = 0, central = [], cdSize = 0, off = 0;
    function w(a){
      var u = (a instanceof Uint8Array) ? a : new Uint8Array(a);
      chunks.push(u); total += u.length;
    }
    for (i = 0; i < entries.length; i++){
      var nm = new TextEncoder().encode(entries[i].name);
      var u8 = datas[i], cr = zipCRC(u8), at = off;
      w([].concat([0x50,0x4b,0x03,0x04], zipU16(20), zipU16(0x0800), zipU16(0),
                  zipU16(tm), zipU16(dt), zipU32(cr), zipU32(u8.length), zipU32(u8.length),
                  zipU16(nm.length), zipU16(0)));
      w(nm); w(u8);
      off = total;
      var cde = [].concat([0x50,0x4b,0x01,0x02], zipU16(20), zipU16(20), zipU16(0x0800), zipU16(0),
                          zipU16(tm), zipU16(dt), zipU32(cr), zipU32(u8.length), zipU32(u8.length),
                          zipU16(nm.length), zipU16(0), zipU16(0), zipU16(0), zipU16(0),
                          zipU32(0), zipU32(at));
      central.push([cde, nm]); cdSize += cde.length + nm.length;
    }
    for (i = 0; i < central.length; i++){ w(central[i][0]); w(central[i][1]); }
    w([].concat([0x50,0x4b,0x05,0x06], zipU16(0), zipU16(0),
                zipU16(entries.length), zipU16(entries.length),
                zipU32(cdSize), zipU32(off), zipU16(0)));
    var out = new Uint8Array(total), p = 0;
    for (i = 0; i < chunks.length; i++){ out.set(chunks[i], p); p += chunks[i].length; }
    return new Blob([out], { type: "application/zip" });
  });
}

/* 镜像图纸：和工具栏「镜像」完全同一个语义 —— 只把当前图层的格子左右翻，
   信息带 / 标尺 / 图例一律不翻（翻了就没法照着数格子了）。
   这里不真的执行 mirrorGrid（那会动你的画布、还进撤销栈），
   只在渲染时临时换一份翻好的格子，画完**同步**立刻换回去，再去慢慢编码 PNG。
   所以你原来的图纸从头到尾没被动过，中途点画布也不会写进临时数组。 */
function mirroredGridArray(){
  var g = state.grid, cols = state.cols, rows = state.rows, ng = new Array(g.length), x, y;
  for (y = 0; y < rows; y++)
    for (x = 0; x < cols; x++) ng[y * cols + x] = g[y * cols + (cols - 1 - x)];
  return ng;
}
function exportMirrorPNG(au, cb){
  var st = computeStats();
  if (!st.list.length){ if (cb) cb(); return; }
  var L = sheetLayout(st);
  /* 分辨率算法与 exportPNG 的桌面分支保持一致（v126 起的格子区域判定） */
  var gw = state.cols * L.EX, gh = state.rows * L.EX;
  /* v377：与 exportPNG 桌面分支一致（sheetStep 整数倍 1x/2x）——旧判定阈值不同，
     某些尺寸下正常图 1x、镜像图 2x，导致镜像比正常大一倍 */
  var d = sheetStep(L);
  var pxW = L.W * d, pxH = L.H * d;
  var saved = state.grid;
  state.grid = mirroredGridArray();
  var cv = document.createElement("canvas");
  cv.width = pxW; cv.height = pxH;
  var c = cv.getContext("2d");
  c.setTransform(pxW / L.W, 0, 0, pxH / L.H, 0, 0);
  drawSheet(c, L, au, null);
  state.grid = saved;                    /* 同步换回，你的图纸没动过 */
  cv.toBlob(function(blob){
    if (!blob){
      toast("镜像图纸没生成（图太大），压缩包里是另外三份");
      if (cb) cb(); return;
    }
    /* 镜像图只用来照着拼，不内嵌图纸数据 —— 免得导回来又跟图对不上 */
    var nm = safeFileName(projName) || ("拼豆图纸-" + state.cols + "x" + state.rows);
    zipSinkPut(nm + "-镜像.png", blob);
    if (cb) cb();
  }, "image/png");
}

/* 四件收齐 → 一个 zip。任何一份生成失败都不拖累其余的，缺哪份就少哪份 */
function exportZipBundle(au){
  var nm = safeFileName(projName) || ("拼豆图纸-" + state.cols + "x" + state.rows);
  zipSink = { list: [], tag: "" };
  function finish(){
    var items = zipSink ? zipSink.list : [];
    zipSink = null;                       /* 关掉收集器，下面那次 deliver 才会真的下载 */
    exportQuiet = false;
    if (!items.length){ toast("导出失败：四个文件都没生成，再试一次"); return; }
    zipBuild(items).then(function(zb){
      deliverBlob(zb, nm + ".zip", "压缩包（" + items.length + " 个文件）");
    }).catch(function(){
      toast("打包失败，已改成单独下载");
      exportPNG(au); exportCover(au); exportProject();
    });
  }
  exportPNG(au, 0, function(){            /* 1 图纸（带图纸数据，导回来认得出） */
    exportMirrorPNG(au, function(){       /* 2 镜像图纸 */
      exportCover(au, function(){         /* 3 封面 */
        exportProject(finish);            /* 4 工程文件 图纸名.json（v150） */
      });
    });
  });
}

function exportBoth(){
  var au = readAuthor();
  /* 多层内容时只有当前图层会导出 —— 沿用弹窗时代的提醒，不阻塞下载 */
  var L = activeLayer(), others = 0, i, j;
  for (i = 0; i < state.layers.length; i++){
    if (state.layers[i] === L || !state.layers[i] || !state.layers[i].visible) continue;
    for (j = 0; j < state.layers[i].grid.length; j++)
      if (state.layers[i].grid[j]){ others++; break; }
  }
  exportQuiet = true;       /* v108：三份连发，成功 toast 全部静默（失败仍会提示） */
  /* v119：移动端（含发布页的 iframe 壳）改成一份一份来。
     三份同时发起会互相抢系统面板、抢保存浮层 —— 工程文件的分享面板先弹，
     图纸和封面的浮层再依次盖上去并撤掉上一张的 blob URL，
     iPad 上就表现为「面板一闪而过，封面没保存上」；
     同时编码两张大图还容易触发 toBlob 内存不足而降级。
     现在：图纸 →（保存或关闭后）封面 → 工程文件。 */
  if (isMobileDevice() || inIframe()){
    exportPNG(au, 0, function(){
      exportCover(au, function(){
        exportProject(function(){ exportQuiet = false; });
      });
    });
  } else {
    /* v137：桌面改成打包成一个 zip —— 封面 / 图纸 / 镜像图纸 / 工程文件，
       只弹一次保存。手机 / iPad 保持一份一份分享（iOS 上解压不方便）。 */
    exportZipBundle(au);
  }
  /* 提醒放到最后说：下载提示在前，这条后发才不会被盖掉（也不在刚点按钮时就冒出来） */
  if (others) setTimeout(function(){
    toast("注意：另有 " + others + " 个图层有内容没导出，要一起导请先合并图层");
  }, 700);
}

function loadProject(file){
  /* v279：改走 applyDraftData —— 工程文件（exportProject/projectJSON）是「图层 + RLE」完整格式，
     旧实现只认 cells 简化格式，读完整工程会得到空画板还提示「已读取」（用户实测踩坑）。
     applyDraftData 同时兼容 layers/RLE 新格式与旧 cells/grid 格式。 */
  var reader = new FileReader();
  reader.onload = function(ev){
    try{
      var d = JSON.parse(ev.target.result);
      if (!d || !(d.cols | 0) || !(d.rows | 0)) throw new Error("bad size");
      beginChange();
      applyDraftData(d);
      if (d.name){ projName = d.name; }
      endChange();
      $("inCols").value = state.cols; $("inRows").value = state.rows;
      renderAll(); renderLayerPanel(); fitZoom(); saveDraft();
      toast("工程已读取");
    } catch(err){
      toast("文件解析失败");
    }
  };
  reader.readAsText(file);
}

/* =========================================================
   变换
   ========================================================= */
/* =========================================================
   图纸优化：缩放 / 局部细化 / 精简用色
   ========================================================= */
/* 图纸缩放：按新尺寸重排现有图案。
   取值用「目标格覆盖源区域内的众数」—— 放大时覆盖 1 格等价最近邻（保持硬边），
   缩小时取最多的色号避免细节丢失。绝不插值混色，否则会生成色板里没有的颜色。 */
function resampleGrid(nc, nr, srcGrid){
  var g = srcGrid || state.grid, oc = state.cols, or_ = state.rows;
  var ng = new Array(nc * nr);
  for (var i = 0; i < ng.length; i++) ng[i] = 0;
  for (var y = 0; y < nr; y++){
    var sy0 = Math.floor(y * or_ / nr);
    var sy1 = Math.max(sy0 + 1, Math.floor((y + 1) * or_ / nr));
    for (var x = 0; x < nc; x++){
      var sx0 = Math.floor(x * oc / nc);
      var sx1 = Math.max(sx0 + 1, Math.floor((x + 1) * oc / nc));
      var best = 0, bestV = 0, counts = [];
      for (var yy = sy0; yy < sy1 && yy < or_; yy++){
        for (var xx = sx0; xx < sx1 && xx < oc; xx++){
          var v = g[yy * oc + xx];
          if (!v) continue;
          counts[v] = (counts[v] || 0) + 1;
          if (counts[v] > best){ best = counts[v]; bestV = v; }
        }
      }
      ng[y * nc + x] = bestV;
    }
  }
  return ng;
}
function applyResample(){
  var nc = clamp(parseInt($("inRW").value, 10) || state.cols, 4, MAX_SIDE);
  var nr = clamp(parseInt($("inRH").value, 10) || state.rows, 4, MAX_SIDE);
  $("inRW").value = nc; $("inRH").value = nr;
  if (nc === state.cols && nr === state.rows){ toast("尺寸没有变化"); return; }
  var oc = state.cols, or_ = state.rows;
  beginChange();
  /* 所有图层一起按比例重采样 —— 手绘内容跟着缩放，不丢 */
  for (var li = 0; li < state.layers.length; li++)
    state.layers[li].grid = resampleGrid(nc, nr, state.layers[li].grid);
  state.cols = nc; state.rows = nr;
  syncActiveGrid();
  markAllLayersDirty();
  state.refOff.x = state.refOff.x * nc / oc;      /* 参考图位置按比例跟随 */
  state.refOff.y = state.refOff.y * nr / or_;
  $("inCols").value = nc; $("inRows").value = nr;
  if (state.lockRatio) state.lockVal = clamp(nr / nc, 0.04, 25);
  endChange();
  renderAll(); renderLayerPanel(); fitZoom(); saveDraft();
  toast("图纸已缩放为 " + nc + " × " + nr + "（所有图层一起缩放）");
  warnRefMismatch();
}
/* 画布尺寸改了 → 底图会按新尺寸重新适配，而图纸还是旧尺寸下的结果，
   照着底图画就会落到隔壁格。这里提示重转（不自动转，免得冲掉手绘内容） */
function warnRefMismatch(){
  if (!state.refImage) return;
  toast("尺寸变了：底图已按新尺寸重新适配，与当前图纸可能错位，照着画前请点「一键转图纸」");
}
/* 通用确认弹窗 */
function askConfirm(title, body, okText, onOk){
  var m = $("confirmModal");
  $("cfTitle").textContent = title;
  $("cfBody").textContent = body;
  $("cfOk").textContent = okText || "确定";
  m.hidden = false;
  function close(){ m.hidden = true; $("cfOk").onclick = null; $("cfCancel").onclick = null; }
  $("cfOk").onclick = function(){ close(); onOk(); };
  $("cfCancel").onclick = close;
}
/* 一键转图纸的入口：判断要不要先提醒会丢进度 */
function requestConvert(){
  if (!state.refImage){ toast("请先上传图片"); return; }
  var userLayers = 0, drawn = 0, i, j;
  for (i = 0; i < state.layers.length; i++){
    var L = state.layers[i];
    if (L.kind === "pattern") continue;
    userLayers++;
    for (j = 0; j < L.grid.length; j++) if (L.grid[j]){ drawn++; break; }
  }
  var sizeChanged = (state.layers[0] && state.layers[0].grid.length !== state.cols * state.rows);
  if (sizeChanged && userLayers > 0){
    askConfirm("重新生成会丢失进度",
      "画布尺寸已经变了，之前画的 " + userLayers + " 个图层没法对齐新尺寸。\n" +
      "继续的话，这些手绘图层会被清空，只保留重新生成的图纸层。",
      "继续并清空", function(){
        initLayers(makeGrid(state.cols, state.rows, false));
        imageToPattern();
        fitZoom();      /* v324：转图纸后停在「适应屏幕」，便于拖底图调位置 */
      });
    return;
  }
  imageToPattern();
  fitZoom();          /* v324：同上 */
}
/* 缩放输入框跟随比例锁 */
function syncResample(who){
  if (!state.lockRatio) return;
  var c = parseInt($("inRW").value, 10), r = parseInt($("inRH").value, 10);
  if (!c || !r) return;
  if (who === "cols") $("inRH").value = clamp(Math.round(c * state.lockVal), 4, MAX_SIDE);
  else               $("inRW").value = clamp(Math.round(r / state.lockVal), 4, MAX_SIDE);
}

/* 局部细化：对选区「单独重新配色 + 更强锐化」—— 选区不再跟全图抢 40 色的
   预算，而是按自己的面积另配一套色板，细节和层次明显多于周围。
   选区外的格子（含手工修改）完全不动 */
function redoRegion(x0, y0, x1, y1){
  if (!state.refImage){ toast("请先上传图片"); return; }
  var cols = state.cols, rows = state.rows;
  x0 = clamp(x0, 0, cols - 1); x1 = clamp(x1, 0, cols - 1);
  y0 = clamp(y0, 0, rows - 1); y1 = clamp(y1, 0, rows - 1);
  var w = x1 - x0 + 1, h = y1 - y0 + 1;
  if (w < 2 || h < 2){ toast("选区太小，至少框 2×2 格"); return; }
  if (state.sourceMode !== "photo"){ toast("像素画已是逐格直映，无需细化"); return; }
  var cc = computeCells(cols, rows);
  if (!cc) return;
  var n = cc.n, r = cc.rect, cw = cc.cw, chh = cc.chh;
  /* 选区锐化 1.0（全局 0.3~0.7）：比全局强但不过冲，细节主要靠下面放开的色数 */
  var lab = cellsToLab(cellUnsharp(cc.cells, cols, rows, 1.0), n);
  /* 选区正好是个矩形 → 直接当成 w×h 的小图纸来配色和分配 */
  var m = w * h, sub = new Float64Array(m * 3), idx = new Int32Array(m), i;
  for (var y = y0; y <= y1; y++){
    for (var x = x0; x <= x1; x++){
      var k = (y - y0) * w + (x - x0), gi = y * cols + x;
      idx[k] = gi;
      sub[k * 3] = lab[gi * 3]; sub[k * 3 + 1] = lab[gi * 3 + 1]; sub[k * 3 + 2] = lab[gi * 3 + 2];
    }
  }
  /* 色数按选区面积给（每 4 格一个色，24~128），近色合并更放宽（1.5，全局 2）
     —— 选区小，近似色交替的色斑风险低，despeckle + fragClean 兜底 */
  var S = selectPalette(sub, clamp(Math.round(m / 4), 24, 128), 1.5);
  var D = buildD(sub, S);
  var a = icmSmooth(D, w, h, 2, 2);              /* 极弱平滑，保住细出来的细节 */
  var codes = despeckle((function(){
    var out = new Int32Array(m);
    for (var t = 0; t < m; t++) out[t] = S[a[t]];
    return out;
  })(), w, h, 8, 2, sub);

  var st0 = computeStats();
  beginChange();
  var changed = 0, before = {}, after = {};
  for (i = 0; i < m; i++){ before[state.grid[idx[i]]] = 1; }
  for (i = 0; i < m; i++){
    var gi2 = idx[i];
    /* 底图没盖到的格子保持空，不填豆 */
    var sy = Math.floor(gi2 / cols), sx = gi2 % cols;
    var syc = r[1] + (sy + 0.5) * (r[3] - r[1]) / rows;
    var sxc = r[0] + (sx + 0.5) * (r[2] - r[0]) / cols;
    if (syc < 0 || syc >= chh || sxc < 0 || sxc >= cw){ state.grid[gi2] = 0; continue; }
    var v = codes[i] + 1;
    if (state.grid[gi2] !== v){ state.grid[gi2] = v; changed++; }
    after[v] = 1;
  }
  endChange();
  renderAll(); saveDraft();
  var st1 = computeStats();
  toast("选区 " + w + "×" + h + " 已细化：" + changed + " 格变化，" +
        "用色 " + st0.list.length + "→" + st1.list.length);
}

/* 精简用色：按用量从少到多，把色号并入「视觉最接近且仍保留」的色号（CIEDE2000）。
   目的是少买几包豆 —— 用量最少的色号往往只占几颗，单独买不划算。
   与旧的「合并相近色」不同：只牺牲用量最少的，主色和大面积色不会被改动。 */
/* v130：点缀色识别 —— 「眼睛、唇色、高光」这类面积小但必须留的色。
   判据（三条同时满足前两条之一+反差）：
     ① 占比 ≤ 4%（确实是零星色）
     ② 成簇：同色邻居占邻居总数 ≥ 35%（区分「真点缀」与「孤立杂豆」）
        或 邻域反差极大（ΔE ≥ 25）——单格高光/瞳孔也救回来
     ③ 与邻域平均 ΔE ≥ 10（跟周围明显不一样，是细节不是噪点）
   噪点（v129 抖动颗粒）ΔE 通常很小 → 不会误保，正好和去杂色不冲突。 */
function accentSet(st){
  var g = state.grid, cols = state.cols, rows = state.rows, lab = palLab();
  var k, cnt = {}, neigh = {}, de = {}, same = {};
  for (k = 0; k < st.list.length; k++){
    cnt[st.list[k].idx] = st.list[k].n; neigh[st.list[k].idx] = 0;
    de[st.list[k].idx] = 0; same[st.list[k].idx] = 0;
  }
  var DX = [1, -1, 0, 0], DY = [0, 0, 1, -1];
  for (var y = 0; y < rows; y++){
    for (var x = 0; x < cols; x++){
      var v = g[y * cols + x];
      if (!v) continue;
      var a = v - 1;
      for (var d = 0; d < 4; d++){
        var nx = x + DX[d], ny = y + DY[d];
        if (nx < 0 || ny < 0 || nx >= cols || ny >= rows) continue;
        var b2 = g[ny * cols + nx];
        if (!b2) continue;
        neigh[a]++;
        if (b2 - 1 === a){ same[a]++; continue; }
        de[a] += de2000(lab[a][0], lab[a][1], lab[a][2],
                        lab[b2-1][0], lab[b2-1][1], lab[b2-1][2]);
      }
    }
  }
  var out = {};
  for (k = 0; k < st.list.length; k++){
    var idx = st.list[k].idx;
    if (cnt[idx] / st.total > 0.04) continue;
    var clus = neigh[idx] ? same[idx] / neigh[idx] : 0;
    var nd = neigh[idx] ? de[idx] / neigh[idx] : 0;
    if (nd >= 10 && (clus >= 0.35 || nd >= 25)) out[idx] = 1;
  }
  return out;
}

function simplifyColors(target){
  var st = computeStats();
  if (!st.list.length){ toast("画布还是空的哦"); return; }
  target = Math.max(1, target | 0);
  /* v152：「不要」的色 —— 用户手动标记，无视点缀色保护，无条件并入最接近的存活色。
     一两颗的孤立杂豆很容易被 v130 的点缀色识别（孤立 + 高反差）误当成
     「眼睛/高光」这类关键特征色保下来；但是不是关键色该由用户说了算，
     所以这个标记优先级最高：压过自动点缀识别，也压过「已少于目标」的提前返回。 */
  var ban = state.banned || {}, hasBan = false, qi;
  for (qi = 0; qi < st.list.length; qi++){ if (ban[st.list[qi].idx]){ hasBan = true; break; } }
  if (st.list.length <= target && !hasBan){
    toast("当前 " + st.list.length + " 色，已少于目标 " + target + " 色");
    return;
  }
  var lab = palLab();
  /* v130：保护色 = 手动锁定 ∪ 自动识别的点缀色 —— 不参与精简（v152：被「不要」标记的除外） */
  var pin = state.pinned || {};
  var acc = accentSet(st);
  var kept = [], forced = [];
  function isKept(idx){ return !ban[idx] && !!(pin[idx] || acc[idx]); }
  /* v130 重写合并顺序：不再「按用量升序砍最少的色」（眼睛、唇色这类小面积关键色必然先没），
     改成每轮挑「合并代价最小」的一对色合并（经典 pairwise merge）：
       cost = ΔE2000 + 0.6 × 该色占比%
     → 色差主导：相近的灰阶先合并；独特色（豹子眼睛紫 ΔE 22.8）排到最后，天然保住；
       同色差量级下面积小的先合（大块色不被拆）。 */
  var alive = [], nOf = {}, i;
  for (i = 0; i < st.list.length; i++){ alive.push(st.list[i].idx); nOf[st.list[i].idx] = st.list[i].n; }
  for (i = 0; i < alive.length; i++) if (isKept(alive[i])) kept.push(PALETTE[alive[i]].id);
  var total = st.total, map = {}, affected = 0, moved = [];
  function resolve(x){
    var guard = 0;
    while (map[x] !== undefined && map[x] !== x && guard++ < 999) x = map[x];
    return x;
  }
  /* v152：强制移除轮 —— 「不要」的色先并，且不看目标色数（哪怕已经达标也照并）。
     量少的先定：两个「不要」色挨在一起时，小的先挂到大的上，大的再整体并进正常色。 */
  var banList = [];
  for (i = 0; i < alive.length; i++) if (ban[alive[i]]) banList.push(alive[i]);
  banList.sort(function(a, b){ return nOf[a] - nOf[b]; });
  for (var bi = 0; bi < banList.length; bi++){
    var fa = banList[bi];
    if (alive.indexOf(fa) < 0) continue;          /* 已并进另一个「不要」色，稍后随它一起走 */
    var fBest = 1e18, fb = -1;
    for (i = 0; i < alive.length; i++){
      var fc = alive[i];
      if (fc === fa) continue;
      var fd = de2000(lab[fa][0], lab[fa][1], lab[fa][2],
                      lab[fc][0], lab[fc][1], lab[fc][2]);
      if (fd < fBest){ fBest = fd; fb = fc; }
    }
    if (fb < 0) break;                            /* 全场只剩它一个（不可能，画布非空） */
    map[fa] = fb;
    moved.push(PALETTE[fa].id + "\u2192" + PALETTE[fb].id);
    forced.push(PALETTE[fa].id + "\u2192" + PALETTE[fb].id);
    affected += nOf[fa];
    nOf[fb] += nOf[fa];
    alive.splice(alive.indexOf(fa), 1);
  }
  while (alive.length > target){
    var bestCost = 1e18, ba = -1, bb = -1;
    for (i = 0; i < alive.length; i++){
      var a = alive[i];
      if (isKept(a)) continue;                     /* 保护色：一个都不删 */
      var sharePct = nOf[a] / total * 100;
      for (var j = 0; j < alive.length; j++){
        if (j === i) continue;
        var b = alive[j];
        var d = de2000(lab[a][0], lab[a][1], lab[a][2],
                       lab[b][0], lab[b][1], lab[b][2]);
        var cost = d + 0.6 * sharePct;
        if (cost < bestCost){ bestCost = cost; ba = a; bb = b; }
      }
    }
    if (ba < 0) break;                             /* 剩下的全是保护色 */
    if (nOf[bb] < nOf[ba]){ var tmp = ba; ba = bb; bb = tmp; }   /* 少的并入多的 */
    map[ba] = bb;
    moved.push(PALETTE[ba].id + "\u2192" + PALETTE[bb].id);
    affected += nOf[ba];
    nOf[bb] += nOf[ba];
    alive.splice(alive.indexOf(ba), 1);
  }
  if (!moved.length){ toast("没有可精简的色号"); return; }
  beginChange();
  for (var t = 0; t < state.grid.length; t++){
    var v = state.grid[t];
    if (v > 0){
      var r = resolve(v - 1);
      if (r !== v - 1) state.grid[t] = r + 1;
    }
  }
  endChange();
  renderAll(); saveDraft();
  var cur = alive.length;
  var msg = "已精简 " + moved.length + " 个色号（" + st.list.length + " \u2192 " + cur +
        " 色），改动 " + affected + " 格";
  if (forced.length) msg += "\n强制移除（标记不要）：" + forced.slice(0, 6).join("、") + (forced.length > 6 ? " 等" : "");
  if (moved.length) msg += "\n" + moved.slice(0, 6).join("、") + (moved.length > 6 ? " 等" : "");
  if (kept.length) msg += "\n保留保护色 " + kept.length + " 个：" + kept.slice(0, 5).join("、") + (kept.length > 5 ? " 等" : "");
  if (cur > target) msg += "\n剩余都是保护色，无法再减到 " + target + " 色";
  toast(msg);
}

/* 从种子格 flood fill（8 邻域）得到非空连通区域掩码 */
function floodMask(seed){
  var g = state.grid, cols = state.cols, rows = state.rows;
  if (!g[seed]) return null;
  var mask = new Uint8Array(g.length), stack = [seed];
  mask[seed] = 1;
  while (stack.length){
    var j = stack.pop();
    var jx = j % cols, jy = (j - jx) / cols;
    for (var dy = -1; dy <= 1; dy++){
      for (var dx = -1; dx <= 1; dx++){
        if (!dx && !dy) continue;
        var nx = jx + dx, ny = jy + dy;
        if (nx < 0 || ny < 0 || nx >= cols || ny >= rows) continue;
        var ni = ny*cols + nx;
        if (mask[ni] || !g[ni]) continue;
        mask[ni] = 1; stack.push(ni);
      }
    }
  }
  return mask;
}
function dilateMask(m, k){
  var cols = state.cols, rows = state.rows, cur = m;
  for (var t = 0; t < k; t++){
    var nx = new Uint8Array(cur.length);
    for (var y = 0; y < rows; y++){
      for (var x = 0; x < cols; x++){
        var i = y*cols + x;
        if (cur[i]){ nx[i] = 1; continue; }
        var hit = 0;
        for (var dy = -1; dy <= 1 && !hit; dy++){
          for (var dx = -1; dx <= 1; dx++){
            if (!dx && !dy) continue;
            var ax = x + dx, ay = y + dy;
            if (ax < 0 || ay < 0 || ax >= cols || ay >= rows) continue;
            if (cur[ay*cols + ax]){ hit = 1; break; }
          }
        }
        if (hit) nx[i] = 1;
      }
    }
    cur = nx;
  }
  return cur;
}
function erodeMask(m, k){
  var inv = new Uint8Array(m.length);
  for (var i = 0; i < m.length; i++) inv[i] = m[i] ? 0 : 1;
  var d = dilateMask(inv, k);
  for (i = 0; i < m.length; i++) d[i] = d[i] ? 0 : 1;
  return d;
}
function applyOutline(mask, mode, thickness, colorVal){
  var g = state.grid, n = g.length, cnt = 0, i;
  if (mode === "outer"){
    var d = dilateMask(mask, thickness);
    for (i = 0; i < n; i++) if (d[i] && !mask[i]){ g[i] = colorVal; cnt++; }
  } else {
    var e = erodeMask(mask, thickness);
    for (i = 0; i < n; i++) if (mask[i] && !e[i]){ g[i] = colorVal; cnt++; }
  }
  return cnt;
}
/* 工具：点击图案 → 给该连通图案外描边 1 格 */
function outlineAt(i){
  var mask = floodMask(i);
  if (!mask){ toast("这里是空格子，点图案本体试试"); return false; }
  var cnt = applyOutline(mask, "outer", 1, state.colorIdx + 1);
  if (!cnt) toast("图案已贴边，没有可描边的位置");
  else toast("已描边 " + cnt + " 格：" + PALETTE[state.colorIdx].id + " " + PALETTE[state.colorIdx].n);
  return cnt > 0;
}
/* 去除背景色：清除与画布边缘连通的同色区域（不影响图案内部同色孤岛） */
/* v100：清空当前图层（原「去背景」——与橡皮·同色连片重复，见评估）。只清格子，图层结构与参考图保留，可撤销 */
function clearActiveLayer(){
  var L = activeLayer();
  if (!L) return;
  var has = false;
  for (var i = 0; i < L.grid.length; i++) if (L.grid[i]){ has = true; break; }
  if (!has){ toast("「" + L.name + "」已经是空的"); return; }
  beginChange();
  for (var k = 0; k < L.grid.length; k++) L.grid[k] = 0;
  endChange();
  renderGrid(); updateStats(); updatePaletteMarks(); renderLayerPanel(); saveDraft();
  toast("已清空「" + L.name + "」（可撤销）");
}

/* 镜像：左右翻转当前图层（只动活动层，锁定层拒绝） */
function mirrorGrid(){
  var L = state.layers[state.active];
  if (!L || L.locked){ toast("当前图层已锁定，先解锁再镜像"); return; }
  beginChange();
  var g = state.grid, cols = state.cols, rows = state.rows, ng = new Array(g.length);
  for (var y = 0; y < rows; y++)
    for (var x = 0; x < cols; x++) ng[y*cols + x] = g[y*cols + (cols - 1 - x)];
  setActiveGrid(ng); endChange(); renderAll(); renderLayerPanel(); saveDraft();

/* =========================================================
   草稿持久化
   ========================================================= */
var draftTimer = null;
/* 游程编码：10 层 × 200×200 的裸数组会把 localStorage 挤爆，
   图纸里大片同色很多，RLE 一般能压到 1/20 以下 */
function rleEncode(g){
  var out = [], i = 0, n = g.length;
  while (i < n){
    var v = g[i] | 0, j = i + 1;
    while (j < n && (g[j] | 0) === v) j++;
    out.push(v, j - i);
    i = j;
  }
  return out;
}
function rleDecode(a, n){
  var g = new Array(n), p = 0, i;
  for (i = 0; i < n; i++) g[i] = 0;
  for (i = 0; i + 1 < a.length; i += 2){
    var v = a[i] | 0, c = a[i + 1] | 0;
    while (c-- > 0 && p < n) g[p++] = v;
  }
  return g;
}
/* v84：参考图也要进草稿，但不能直接塞原图 —— 那是几 MB 的 base64，
   会把 localStorage（5MB 上限）撑爆，结果连图纸本身都存不进去。
   存的是一份「够描图用」的压缩副本（最长边 ≤1024 的 JPEG），并按引用缓存，
   避免每次自动保存都重编码一遍。 */
var refDraftCache = { img: null, data: "" };
function refDraftData(){
  /* v117：始终存原图 —— 暖肤版是算出来的，恢复时按 warmOn 重算 */
  var img = state.refOriginal || state.refImage;
  if (!img) return "";
  if (refDraftCache.img === img) return refDraftCache.data;
  var sizes = [1024, 768, 512], out = "";
  for (var s = 0; s < sizes.length && !out; s++){
    try{
      var iw = img.naturalWidth || img.width, ih = img.naturalHeight || img.height;
      if (!iw || !ih) break;
      var k = Math.min(1, sizes[s] / Math.max(iw, ih));
      var cv = document.createElement("canvas");
      cv.width = Math.max(1, Math.round(iw * k));
      cv.height = Math.max(1, Math.round(ih * k));
      var c = cv.getContext("2d");
      c.imageSmoothingEnabled = true; c.imageSmoothingQuality = "high";
      c.drawImage(img, 0, 0, cv.width, cv.height);
      var d = cv.toDataURL("image/jpeg", 0.82);
      if (d.length <= 900000) out = d;            /* 还是太大就换更小的尺寸再来 */
    }catch(e){ break; }
  }
  refDraftCache.img = img; refDraftCache.data = out;
  return out;
}
/* 恢复参考图：先让缩略图立刻显示，原图加载完再重画画布（与上传流程一致） */
function applyRefData(data){
  if (!data) return;
  state.refDataUrl = data;
  var im = new Image();
  im.onload = function(){
    state.refOriginal = im;
    refDraftCache.img = im; refDraftCache.data = data;   /* 复用，别再编码一次 */
    if (state.warmOn){
      warmSkinImage(im, function(w){
        state.refImage = w; state.refDataUrl = w.src;
        renderRef(); updateRefUI(); renderLayerPanel();
      });
    } else {
      state.refImage = im;
      renderRef();
      updateRefUI();
      renderLayerPanel();
    }
    state.skinOk = skinRatioThumb(im) >= SKIN_MIN;
    updateWarmUI();
  };
  im.src = data;
}
/* v80：把「当前画布 → 可存储对象」抽出来，草稿箱、工程文件与本地应急副本共用同一份格式 */
function draftSnapshot(){
  var ls = [], i;
  for (i = 0; i < state.layers.length; i++){
    var L = state.layers[i];
    ls.push({ n: L.name, k: L.kind, o: Math.round(L.opacity * 100),

  }

    cols: state.cols, rows: state.rows,

    curId: curDraftId,                    /* v83：刷新后仍在「编辑某份草稿」的状态也要记住 */
    name: projName,                       /* v97：图纸名跟着快照走（草稿箱/工程文件/导出都用它） */
    refVisible: state.refVisible ? 1 : 0,

    showCodes: state.showCodes,

/* v80：把草稿对象应用到当前画布（草稿箱打开 / 导入工程文件 / 识别落地 共用） */
function applyDraftData(d){

   localStorage 那份只是应急副本（同步写、启动时若比草稿箱新就悄悄补进去，绝不载入画布）。

/* v107：工程文件跟着导出一起存（不再单独放入口）

   v150：用户明确不要任何 .bead 后缀 —— 就存「图纸名.json」，系统原生识别。
   导入端按内容读（不挑扩展名），accept 里 .bead / .bead.json / .json 全收，历史文件都能导。 */
function exportProject(done){
  var nm = safeFileName(projName) || ("拼豆图纸-" + state.cols + "x" + state.rows);
  var s = projectJSON(nm);
  /* v151：导出后把真实文件名说出来 —— 之前改了后缀，用户浏览器拿的是缓存的旧 HTML，
     导出名还是 .bead，而界面上没有任何地方能看出跑的是哪一版，排查全靠猜。 */
  deliverFile(new Blob([s], { type: "application/json" }), nm + ".json", function(){
    if (!zipSink) toast("工程文件：" + nm + ".json");
    if (done) done();
  });
}
/* 非图片文件的交付：桌面直接下载；移动端优先系统面板（存到文件），
   iframe 里 share 不可用时改为新标签打开（Safari 里还能再点分享 → 存储到文件） */
function deliverFile(blob, filename, done){
  if (zipSink){ zipSinkPut(filename, blob); if (done) done(); return; }
  try{
    var file = new File([blob], filename, { type: "application/json" });
    if (isMobileDevice() || inIframe()){
      if (navigator.canShare && navigator.canShare({ files: [file] })){
        navigator.share({ files: [file] }).then(function(){
          if (done) done();
        }).catch(function(err){
          /* 用户自己取消不算失败，但批量链要继续走下去（等于跳过这一份） */
          if (!err || err.name !== "AbortError") openBlobTab(blob, filename);
          if (done) done();
        });
        return;
      }
      openBlobTab(blob, filename);
      if (done) done();
      return;
    }
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob); a.download = filename;
    document.body.appendChild(a); a.click();
    setTimeout(function(){ URL.revokeObjectURL(a.href); if (a.parentNode) a.parentNode.removeChild(a); }, 2000);
    if (!exportQuiet) toast("已保存工程文件");
    if (done) done();
  }catch(e){ toast("导出失败，换个浏览器试试"); if (done) done(); }
}
function openBlobTab(blob, filename){
  try{
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url; a.target = "_blank"; a.rel = "noopener"; a.download = filename;
    document.body.appendChild(a); a.click();
    setTimeout(function(){ if (a.parentNode) a.parentNode.removeChild(a); URL.revokeObjectURL(url); }, 10000);
    toast("已打开工程文件，点分享可存储到文件");
  }catch(e){ toast("导出失败"); }
}
/* 导入：先把当前进度安置好（guardCurrent），再载入文件 —— 不会顶掉正在画的 */
function applyProjectText(text){
  var d;
  try{ d = JSON.parse(text); }catch(e){ toast("这个文件读不出来"); return false; }
  if (!d || !d.cols || (!d.layers && !d.grid)){ toast("这不是本工具的图纸文件"); return false; }
  guardCurrent(function(){
    applyDraftData(d);
    curDraftId = 0;                     /* 导入的内容还不等于草稿箱里任何一份 */
    renderAll(); renderLayerPanel(); updateStats && updateStats();
    updatePaletteMarks && updatePaletteMarks();
    centerCanvas(); saveDraft();
    closeDraftBox();
    toast("已导入「" + (d.name || ("图纸 " + d.cols + "×" + d.rows)) + "」");
  });
  return true;
}
var projInput = null;
function importProject(){
  if (!projInput){
    projInput = document.createElement("input");
    projInput.type = "file";
    /* v145：必须带 .bead —— v107 起工程文件就存成「图纸名.bead」了，
       而这里还写着 v85 时代的 .bead.json，macOS 的打开面板会按扩展名过滤，
       于是自己导出的工程文件反而选不了（灰掉）。
       v150：导出端定为「图纸名.json」（用户不要任何 .bead 后缀），
       accept 里 .bead / .bead.json / .json 全收，历代文件都能导。 */
    projInput.accept = ".bead,.bead.json,.json,application/json,text/plain,image/png,image/*";
    projInput.style.display = "none";
    projInput.addEventListener("change", function(){
      var f = this.files && this.files[0];
      var name = f ? f.name : "";
      this.value = "";
      if (!f) return;
      /* v86：图纸 PNG 也能导入 —— 先读内嵌数据，读不到再识别图像 */
      var isImg = (f.type && f.type.indexOf("image") === 0) || /\.png$/i.test(name);
      if (isImg){ importImage(f); return; }
      var fr = new FileReader();
      fr.onload = function(){ applyProjectText(String(fr.result || "")); };
      fr.onerror = function(){ toast("文件读取失败"); };
      fr.readAsText(f);
    });
    document.body.appendChild(projInput);
  }
  projInput.click();
}

/* =========================================================
   三期：认回「本工具生成的图纸」（v86）
   ① 导出 PNG 时把图纸数据写进 PNG 的 tEXt 块 —— 读得到就 100% 精确还原
   ② 读不到（图被压缩 / 转 JPEG / 截图）→ 退回图像识别：
      检测网格线周期 → 定位图纸区域 → 取每格主色 → 匹配最近色号
   ========================================================= */
var PNG_KEY = "bead-data";

/* --- base64（UTF-8 安全，分块避免 apply 栈溢出；不支持就不内嵌，不影响出图） --- */
function utf8ToB64(s){
  var bytes;
  try{ bytes = new TextEncoder().encode(s); }catch(e){ return null; }
  var out = "", i, chunk;
  for (i = 0; i < bytes.length; i += 8192){
    chunk = bytes.subarray ? bytes.subarray(i, i + 8192) : bytes.slice(i, i + 8192);
    out += String.fromCharCode.apply(null, chunk);
  }
  try{ return btoa(out); }catch(e){ return null; }
}
function b64ToUtf8(b64){
  var bin;
  try{ bin = atob(b64); }catch(e){ return null; }
  var bytes = new Uint8Array(bin.length), i;
  for (i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  try{ return new TextDecoder().decode(bytes); }catch(e){ return null; }
}

/* --- CRC32（PNG chunk 校验） --- */
var CRC32_T = (function(){
  var t = new Uint32Array(256), n, k, c;
  for (n = 0; n < 256; n++){
    c = n;
    for (k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
    t[n] = c >>> 0;
  }
  return t;
})();
function crc32(buf){
  var c = 0xFFFFFFFF, i;
  for (i = 0; i < buf.length; i++) c = CRC32_T[(c ^ buf[i]) & 0xFF] ^ (c >>> 8);
  return (c ^ 0xFFFFFFFF) >>> 0;
}
function readArrayBuffer(blob){
  return new Promise(function(res, rej){
    if (blob && blob.arrayBuffer && !/Safari/.test(navigator.userAgent)){
      try{ blob.arrayBuffer().then(res, rej); return; }catch(e){}
    }
    var fr = new FileReader();
    fr.onload = function(){ res(fr.result); };
    fr.onerror = function(){ rej(fr.error || new Error("read")); };
    fr.readAsArrayBuffer(blob);
  });
}
function asciiBytes(s){
  var a = new Uint8Array(s.length), i;
  for (i = 0; i < s.length; i++) a[i] = s.charCodeAt(i) & 0xFF;
  return a;
}
/* 在 IEND 之前插入一个 tEXt 块：阅读器一律忽略，图片照常显示 */
function pngEmbedText(blob, keyword, text){
  return readArrayBuffer(blob).then(function(ab){
    var u = new Uint8Array(ab), p = 8, iend = -1, len, type;
    if (u.length < 8 || u[0] !== 0x89 || u[1] !== 0x50) throw new Error("not png");
    while (p + 8 <= u.length){
      len = (u[p] << 24 | u[p+1] << 16 | u[p+2] << 8 | u[p+3]) >>> 0;
      if (len > u.length) break;
      type = String.fromCharCode(u[p+4], u[p+5], u[p+6], u[p+7]);
      if (type === "IEND"){ iend = p; break; }
      p += 12 + len;
    }
    if (iend < 0) throw new Error("no iend");
    var kw = asciiBytes(keyword + "\0"), tx = asciiBytes(text);
    var data = new Uint8Array(kw.length + tx.length);
    data.set(kw, 0); data.set(tx, kw.length);
    var out = new Uint8Array(u.length + 12 + data.length), q = iend, cr;
    out.set(u.subarray(0, iend), 0);
    out[q] = (data.length >>> 24) & 255; out[q+1] = (data.length >>> 16) & 255;
    out[q+2] = (data.length >>> 8) & 255; out[q+3] = data.length & 255;
    out[q+4] = 116; out[q+5] = 69; out[q+6] = 88; out[q+7] = 116;     /* tEXt */
    out.set(data, q + 8);
    cr = crc32(out.subarray(q + 4, q + 8 + data.length));
    var cq = q + 8 + data.length;
    out[cq] = (cr >>> 24) & 255; out[cq+1] = (cr >>> 16) & 255;
    out[cq+2] = (cr >>> 8) & 255; out[cq+3] = cr & 255;
    out.set(u.subarray(iend), cq + 4);
    return new Blob([out], { type: "image/png" });
  });
}
function pngReadText(ab, keyword){
  var u = new Uint8Array(ab), p = 8, len, type, i, s, z;
  if (u.length < 8 || u[0] !== 0x89 || u[1] !== 0x50) return null;
  while (p + 8 <= u.length){
    len = (u[p] << 24 | u[p+1] << 16 | u[p+2] << 8 | u[p+3]) >>> 0;
    if (len > u.length) break;
    type = String.fromCharCode(u[p+4], u[p+5], u[p+6], u[p+7]);
    if (type === "tEXt"){
      var start = p + 8, end = Math.min(start + len, u.length);
      s = "";
      for (i = start; i < end; i++) s += String.fromCharCode(u[i]);
      z = s.indexOf("\0");
      if (z >= 0 && s.slice(0, z) === keyword) return s.slice(z + 1);
    }
    if (type === "IEND") break;
    p += 12 + len;
  }
  return null;
}
/* 内嵌的图纸数据（不含缩略图 —— PNG 本身就是图，省体积） */
function pngDataText(){
  var d = draftSnapshot();
  d.app = PROJ_APP; d.kind = PROJ_KIND; d.pver = PROJ_VER;
  d.savedAt = Date.now();
  return utf8ToB64(JSON.stringify(d));
}

/* --- 图像识别兜底 --- */
function palRgb(idx){ return hexToRgb(PALETTE[idx].h); }
function nearestPalIdx(r, g, b){
  var best = -1, bd = 1e9, i, p, d;
  for (i = 0; i < PALETTE.length; i++){
    p = palRgb(i);
    d = (r - p[0]) * (r - p[0]) + (g - p[1]) * (g - p[1]) + (b - p[2]) * (b - p[2]);
    if (d < bd){ bd = d; best = i; }
  }
  return best;
}
/* 一列/一行的「边缘能量」：网格线贯穿整列，文字只在局部，能量差很大 */
function edgeEnergy(gray, W, H, horiz, a0, a1, b0, b1){
  var out = [], n = horiz ? W : H, t, u, sum;
  for (t = 0; t < n; t++) out.push(0);
  for (t = 1; t < n; t++){
    sum = 0;
    for (u = b0; u < b1; u++){
      var i0 = horiz ? (u * W + t) : (t * W + u);
      var i1 = horiz ? (u * W + t - 1) : ((t - 1) * W + u);
      sum += Math.abs(gray[i0] - gray[i1]);
    }
    out[t] = sum / Math.max(1, b1 - b0);
  }
  return out;
}
/* 「墨迹密度」：一条扫描线上非白像素的比例。
   图纸区每一列/行都有网格线穿过，纸外（留白、间隔带）几乎全白 —— 用它圈定图纸矩形，
   比在峰里找链稳得多（图例卡片的边框不会混进来）。 */
function inkProfile(gray, W, H, byRow, a0, a1){
  var n = byRow ? H : W, out = new Float32Array(n), t, u, cnt, i;
  a0 = Math.max(0, a0 | 0); a1 = Math.min(byRow ? W : H, a1 | 0);
  for (t = 0; t < n; t++){
    cnt = 0;
    for (u = a0; u < a1; u++){
      i = byRow ? (t * W + u) : (u * W + t);
      if (gray[i] < 248) cnt++;
    }
    out[t] = cnt / Math.max(1, a1 - a0);
  }
  return out;
}
/* 最长的连续「有墨」区间。maxGap：允许桥接的小间隙数 ——
   图纸里整列/整行都是空格很常见（比如图案边缘），那几列只剩格线，密度会掉到阈值以下，
   不允许间隙的话区间会在这里断掉，后面算出来的格数就全错了。 */
function longestDense(P, thr, maxGap){
  var n = P.length, best = null, i = 0, start, gap, j, end;
  maxGap = maxGap || 0;
  while (i < n){
    if (P[i] < thr){ i++; continue; }
    start = i; gap = 0; j = i;
    while (j < n){
      if (P[j] >= thr){ gap = 0; j++; continue; }
      if (gap >= maxGap) break;
      gap++; j++;
    }
    end = j - 1;
    while (end > start && P[end] < thr) end--;      /* 尾部因桥接混入的低点去掉 */
    if (!best || (end - start) > (best.b - best.a)) best = { a: start, b: end };
    i = j + 1;
  }
  return best;
}
/* 从 [a,b] 两端按周期 T 外扩：只要下一根确实是格线就继续。
   端点必须吸附到最近的格线再出发 —— 墨迹区的端点常偏几像素，
   直接用 a±T 会一格一格错开，扩两格就撞不到线了。 */
function growEdge(isLine, a, b, T, lo, hi, maxStep){
  var tol = Math.max(2, T * 0.35);
  function snap(v){
    var p, s = -1, bd = 1e9;
    for (p = Math.round(v - tol); p <= Math.round(v + tol); p++){
      if (p < lo || p > hi) continue;
      if (isLine(p) && Math.abs(p - v) < bd){ bd = Math.abs(p - v); s = p; }
    }
    return s;
  }
  var sa = snap(a), sb = snap(b), guard = 0, nx;
  if (sa >= 0) a = sa;
  if (sb >= 0) b = sb;
  maxStep = maxStep || 3;
  var limited = false;
  while (guard++ < maxStep){
    nx = snap(a - T);
    if (nx < 0 || nx >= a - 1) break;
    a = nx;
    if (guard >= maxStep) limited = true;      /* 撞到步数上限 = 边界没找全 */
  }
  guard = 0;
  while (guard++ < maxStep){
    nx = snap(b + T);
    if (nx < 0 || nx <= b + 1) break;
    b = nx;
    if (guard >= maxStep) limited = true;
  }
  return { a: a, b: b, limited: limited };
}
/* 格线贯穿度：真实网格线会贯穿整列/整行，随机图里的色块边缘不会。
   这是把「不是本工具的图」挡在门外的主要闸门。 */
function lineCoverage(ink, a, T, cells){
  var hit = 0, k, idx;
  for (k = 0; k <= cells; k++){
    idx = Math.round(a + k * T);
    if (idx >= 0 && idx < ink.length && ink[idx] >= 0.6) hit++;
  }
  return hit / (cells + 1);
}
function energyPeaks(E){
  var n = E.length, max = 0, mean = 0, i, thr, out = [], a, b, c, d2;
  for (i = 0; i < n; i++){ if (E[i] > max) max = E[i]; mean += E[i]; }
  mean /= (n || 1);
  if (max <= 0) return out;
  thr = Math.max(mean * 1.3, max * 0.08);
  for (i = 1; i < n - 1; i++){
    if (E[i] < thr) continue;
    if (E[i] >= E[i-1] && E[i] >= E[i+1]){
      a = E[i-1]; b = E[i]; c = E[i+1];
      d2 = (a - c) / (2 * (a - 2 * b + c) || 1);
      out.push(i + (Math.abs(d2) < 1 ? d2 : 0));
    }
  }
  return out;
}
/* 求网格周期：对边缘能量序列做自相关。
   比「相邻峰间距众数」稳得多 —— 个别格线检测不到只会让间距变成 2T/3T 污染众数，
   自相关看的是整条序列的周期性，缺几根线几乎不影响。 */
function guessPeriod(E, lo, hi){
  var n = E.length, i, d, mean = 0, v, s, R0, best = 0, bestR = -1e18;
  if (n < 24) return 0;
  for (i = 0; i < n; i++) mean += E[i];
  mean /= n;
  v = new Float32Array(n);
  for (i = 0; i < n; i++) v[i] = E[i] - mean;
  R0 = 0;
  for (i = 0; i < n; i++) R0 += v[i] * v[i];
  if (R0 <= 0) return 0;
  lo = Math.max(5, lo | 0); hi = Math.min(hi | 0, Math.floor(n / 3));
  if (hi <= lo) return 0;
  var R = new Float32Array(hi + 2), maxR = -1e18;
  for (d = lo; d <= hi; d++){
    s = 0;
    for (i = 0; i + d < n; i++) s += v[i] * v[i + d];
    s /= (n - d);
    R[d] = s;
    if (s > maxR){ maxR = s; best = d; }
  }
  if (maxR <= 0) return 0;
  /* 取「最小的显著局部极大」= 基频。
     导出图每 5 格虚线、每 10 格实线都比每格细线更黑，直接取全局最大会拿到 5T/10T 的谐波
     （实测拿到 114，真实周期是 11.4），所以必须从低频侧挑第一个够高的峰。 */
  for (d = lo + 1; d < hi; d++){
    if (R[d] >= maxR * 0.45 && R[d] >= R[d-1] && R[d] >= R[d+1]) return d;
  }
  return best;
}
/* 折叠打分：把能量序列按 mod T 折叠到 32 个相位桶里。
   真实周期 → 所有格线落进同一个桶（1 个尖峰）；
   周期的 1/k → 格线散到 k 个桶里（k 个等高峰）。
   不用峰检测 —— 真实 JPEG 图上色号文字会产生大量噪声峰
   （52 格的图测出 340 个峰，真格线只有 53 根），投票法会被冲垮。 */
function foldBins(E, T){
  var n = E.length, i, nb = 32, bins = new Float64Array(nb), cnt = new Float64Array(nb), b;
  for (i = 0; i < n; i++){
    b = Math.floor((i % T) / T * nb) % nb;
    bins[b] += E[i]; cnt[b]++;
  }
  var mean = 0;
  for (i = 0; i < nb; i++){ bins[i] /= Math.max(1, cnt[i]); mean += bins[i]; }
  mean /= nb;
  return { bins: bins, mean: mean };
}

  var f = foldBins(E, T), i, mx = 0;
  for (i = 0; i < 32; i++) mx = Math.max(mx, f.bins[i]);
  return f.mean > 0 ? (mx - f.mean) / f.mean : 0;
}
/* 亚像素细化：格线是 0.x 像素级的偏移，整数周期累积几十格就偏出好几像素 */

  var best = T, bestS = foldScore(E, T), t, sc, span = 0.8 + T * 0.06;
  for (t = T - span; t <= T + span; t += 0.05){

    if (sc > bestS){ bestS = sc; best = t; }
  }
  return best;

/* 用链反推精确周期：自相关只能给整数近似，累积 50 格会偏出好几像素；
   这里在 ±3 格里挑「格线命中率最高」的格数，再用 (b-a)/格数 得到浮点周期。 */
function refineCells(peaks, a, b, T0){

  var cells, k, p, j, hit, tol, T, sc;

    for (k = 0; k <= cells; k++){

      for (j = 0; j < peaks.length; j++){

        if (peaks[j] >= p - tol){ hit++; break; }
      }
    }
    sc = hit / (cells + 1);
    if (sc > bestScore){ bestScore = sc; best = cells; }
  }
  return { cells: best, T: (b - a) / best, score: bestScore };

/* 找最长的等差峰链（允许少量缺失），返回 [起点, 终点, 个数] */
function longestChain(peaks, T){
  var tol = Math.max(2, T * 0.35), bi = 0, bj = 0, bc = 0, i, k, p, j, found, miss;
  for (i = 0; i < peaks.length; i++){
    var cnt = 1, lastIdx = i, m = 0;
    for (k = 1; k < 400; k++){
      p = peaks[i] + k * T;
      found = -1;
      for (j = lastIdx + 1; j < peaks.length; j++){
        if (peaks[j] > p + tol) break;
        if (peaks[j] >= p - tol){ found = j; break; }
      }
      if (found < 0){ if (++m > 8) break; continue; }
      m = 0; cnt++; lastIdx = found;
    }

/* 识别结果落地：先安置当前内容（guardCurrent）再载入，与导入工程文件一致 */
function applyRecognized(res, name){
  var d = {
    cols: res.cols, rows: res.rows, ver: 2,
    layers: [{ n: "图纸层", k: "pattern", o: 100, v: 1, l: 0, r: rleEncode(res.grid) }],
    active: 0, sourceMode: "pixel"
  };
  guardCurrent(function(){
    applyDraftData(d);
    curDraftId = 0;
    renderAll(); renderLayerPanel(); updateStats && updateStats();
    updatePaletteMarks && updatePaletteMarks();
    centerCanvas(); saveDraft(); closeDraftBox();
    toast("已识别 " + res.cols + "×" + res.rows + "（" + res.filled + " 格）");

/* 图片导入：先读内嵌数据，读不到再图像识别 */
function importImage(file){
  readArrayBuffer(file).then(function(ab){
    var raw = pngReadText(ab, PNG_KEY), text = raw ? b64ToUtf8(raw) : null;
    if (text && applyProjectText(text)) return;      /* 内嵌数据：精确还原 */
    var url = URL.createObjectURL(file), im = new Image();
    im.onload = function(){
      URL.revokeObjectURL(url);
      var res = recognizeImage(im);
      if (!res){ toast("这张图认不出来"); return; }
      applyRecognized(res, file.name || "");
    };
    im.onerror = function(){ URL.revokeObjectURL(url); toast("图片打不开"); };
    im.src = url;
  }).catch(function(){ toast("文件读不出来"); });
}

/* v277：文件统一入口 —— 按内容嗅探分流（电脑端上传图片 / 导入文件共用）
   · json / .bead            → 读工程文件
   · 图片：先读 PNG 内嵌图纸数据，读到 → 精确还原工程；读不到 → 当参考图打开 */
function routeFile(f, reup){
  var nm = f.name || "";
  var isProj = /\.(json|bead)$/i.test(nm) || f.type === "application/json" || f.type === "text/json";
  if (isProj){ loadProject(f); return; }
  var isImg = (f.type && f.type.indexOf("image") === 0) || /\.(png|jpe?g|gif|webp|bmp)$/i.test(nm);
  if (!isImg){ loadImageFile(f, reup); return; }
  readArrayBuffer(f).then(function(ab){
    var text = null;
    try{ var raw = pngReadText(ab, PNG_KEY); text = raw ? b64ToUtf8(raw) : null; }catch(e){ text = null; }
    if (text && applyProjectText(text)) return;      /* 图纸 PNG：内嵌数据精确还原 */
    loadImageFile(f, reup);                          /* 普通图片：当参考图 */
  }).catch(function(){ loadImageFile(f, reup); });
}

function buildAuthorEl(){

    var rg = document.createRange(); rg.selectNodeContents(au);
    var sel = window.getSelection(); sel.removeAllRanges(); sel.addRange(rg);
    function commit(){
      au.contentEditable = "false";
      var v = (au.textContent || "").trim().slice(0, 24);
      saveAuthor(v);

/* v121：右缘竖栏塞进缩放组后，矮横屏（1133×657 这类）会顶出屏幕底部 ——

   ⚠ 不能用 getBoundingClientRect().height 判断：竖栏有 max-height，超出的部分
   被 overflow:visible 溢出到屏幕外，量出来的高度永远等于 max-height。用 scrollHeight。 */
function fitPadDock(){
  var d = $("padDockR");
  if (!d || d.hidden) return;
  d.classList.remove("pad-dense");
  var last = d.lastElementChild;
  if (!last) return;
  /* ⚠ 两个坑：① 竖栏有 max-height 且 overflow:visible，超出的部分是溢出到屏幕外而不是
     被裁掉，所以量 d 自己的高度永远等于 max-height，量不出溢出；② scrollHeight 对
     overflow:visible 的 flex 容器行为不一致。直接量最后一个子元素的底边最准。 */
  if (last.getBoundingClientRect().bottom > window.innerHeight - 14) d.classList.add("pad-dense");

/* v155：自刷新按钮 —— PWA 独立窗口没有地址栏、没有刷新键，出了更新只能退出重开，太折腾。
   按钮常驻顶栏最右，文字就是当前版本号：独立窗口里 document.title 没地方显示，
   这是唯一能直接看到「我现在跑的是哪版」的地方。
   点击：先查 version.txt（no-store）—— 有新版本 → 带 ?v= 跳转更新；
   没有新版 → 带 ?r= 时间戳重取一份（查询串变缓存键，绕过 HTTP 缓存，普通 reload 拿到的可能还是缓存）。
   资料库节点上没有 version.txt（404）→ 退回普通 reload。 */
function installRefreshBtn(){
  /* v156：原先挂在文档信息组末尾；v186 改到动作区最左（草稿箱前面） */
  var right = document.querySelector(".stage-toolbar .tb-right");

  if (!host || $("btnRefreshApp")) return;
  var b = document.createElement("button");
  b.className = "btn sm act"; b.id = "btnRefreshApp";   /* v189：版本刷新也是一枚正经按钮，和其他动作统一 */
  b.innerHTML = '<svg class="ic sm" aria-hidden="true" viewBox="0 0 16 16">' +
    '<path d="M13.3 8a5.3 5.3 0 1 1-1.55-3.75" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>' +
    '<path d="M13.5 1.9v2.85h-2.85" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>' + APP_VER;
    b.addEventListener("click", function(){
    try{
      fetch("version.txt", { cache: "no-store" }).then(function(r){
        if (!r.ok){ location.reload(); return ""; }      /* 资料库节点：没有 version.txt */
        return r.text();
      }).then(function(t){
        var sv = String(t || "").trim();
        if (sv && sv !== APP_VER){
          toast("发现新版本 " + sv + "，正在更新…");
          setTimeout(function(){ location.replace("./?v=" + encodeURIComponent(sv) + "&r=" + Date.now()); }, 400);
        } else {
          location.replace("./?r=" + Date.now());
        }
      }).catch(function(){ location.reload(); });
    }catch(e){ location.reload(); }
  });
  host.insertBefore(b, host.firstChild);
  tidyHeaderActions();
}

/* =========================================================
   v188：把 PWA 窗口那条系统标题栏染成页面底色
   存到程序坞打开时，窗口顶部那条是浏览器画的（白底 + 红绿灯 + 站点名），
   白得像贴了条膏药。theme-color 是唯一能改它的开关，只能运行时写 meta：
   云端同步只换 style/script，改 <head> 标记不会跟着走。
   ========================================================= */
function applyThemeColor(){
  try{
    var c = "";
    var b = getComputedStyle(document.body).backgroundColor;
    var h = getComputedStyle(document.documentElement).backgroundColor;
    function rgb(s){ var m = /rgba?\((\d+),\s*(\d+),\s*(\d+)(?:,\s*([\d.]+))?\)/.exec(s || ""); if (!m) return "";
      if (m[4] !== undefined && parseFloat(m[4]) === 0) return "";
      return "#" + [m[1],m[2],m[3]].map(function(v){ return ("0" + parseInt(v,10).toString(16)).slice(-2); }).join(""); }
    c = rgb(b) || rgb(h) || "#E9E9ED";
    var m = document.querySelector('meta[name="theme-color"]');
    if (!m){ m = document.createElement("meta"); m.setAttribute("name","theme-color"); document.head.appendChild(m); }
    m.setAttribute("content", c);
  }catch(e){}
}

    } else toast("当前环境不支持复制");
  });

  // 键盘
  document.addEventListener("keydown", function(e){
    if (/input|select|textarea/i.test(e.target.tagName)) return;
    if (e.target.isContentEditable) return;   /* v374：改名等编辑态打字不触发快捷键（"x"=清空图层） */
    var k = e.key.toLowerCase();
    if (k === "escape" && (openDrawer || document.querySelector(".layer-panel.open"))){
      closeAllOverlays(); return;
    }
    if (k === "escape"){
      var lpp = document.querySelector(".layer-panel");
      if (lpp && lpp.classList.contains("open")){
        lpp.classList.remove("open");
        $("btnLayerPad").classList.remove("active");
        return;
      }
    }
    if ((e.ctrlKey || e.metaKey) && k === "z"){ e.preventDefault(); if (e.shiftKey) redo(); else undo(); return; }
    if ((e.ctrlKey || e.metaKey) && k === "y"){ e.preventDefault(); redo(); return; }
    if ((e.ctrlKey || e.metaKey) && k === "s"){ e.preventDefault(); saveProject(); return; }
    if (k === " "){ spaceDown = true; gridCanvas.style.cursor = "grab"; e.preventDefault(); return; }
    /* 图层快捷键：[ ] 切换上下层，Ctrl/⌘+Shift+N 新建 */
    if ((e.ctrlKey || e.metaKey) && e.shiftKey && k === "n"){ e.preventDefault(); addLayer(); return; }
    if (k === "]"){ e.preventDefault(); setActiveLayer(state.active + 1, false); return; }
    if (k === "["){ e.preventDefault(); setActiveLayer(state.active - 1, false); return; }
    if (k === "h"){ e.preventDefault(); setTool("hand"); return; }
    if (k === "b") setTool("pencil");
    else if (k === "e"){
      if (state.tool !== "eraser") setTool("eraser");
      else {
        var EM = ["cell", "rect", "region"], EMN = {cell:"单格", rect:"框选", region:"同色连片"};
        state.eraseMode = EM[(EM.indexOf(state.eraseMode) + 1) % EM.length];
        syncEraseMode();
        toast("擦除方式：" + EMN[state.eraseMode]);
      }
    }
    else if (k === "g") setTool("fill");
    else if (k === "i") setTool("picker");
    else if (k === "r") setTool("rect");
    else if (k === "l") setTool("line");
    else if (k === "t") setTool("replace");
    else if (k === "x") clearActiveLayer();
    else if (k === "c") setTool("ellipse");
    else if (k === "o") setTool("outline");
    else if (k === "v") setTool("move");
  });
  document.addEventListener("keyup", function(e){
    if (e.key === " "){ spaceDown = false; gridCanvas.style.cursor = "crosshair"; }
  });

  /* 平板形态变了（横竖屏切换 / 分屏）要重新适应画布 */
  window.addEventListener("resize", function(){
    if (updateDeviceClass()) fitZoom();
    updateLayout();
    fitPadDock();   /* v121：右栏多了缩放组，矮横屏要切紧凑档，别顶出屏幕 */
    placeEraseMenu();   /* v124：工具条折行后橡皮按钮位置变了，菜单要重新夹一次 */
  });
  /* 转屏时 resize 往往早于可视口真正换过来，补一次延迟测量 */
  window.addEventListener("orientationchange", function(){
    setTimeout(function(){ updateLayout(); fitPadDock(); }, 280);
  });
}
/* v124：橡皮二级菜单原本按 eraser 按钮的 offsetLeft 定位。
   手机/分屏上工具条折行后橡皮常落在靠右列，菜单（触摸端实测 119px 宽）
   会捅出工具条右缘 → 整页可以横向拖动（390 视口实测溢出 30px）。
   这里把左偏移夹进包含块：只在会溢出时才移位，仍然紧贴按钮。
   （iPad 那份由 CSS `left:auto!important` 接管，优先级高于内联样式，不受影响。） */
function placeEraseMenu(){
  var wrap = $("segWrap");
  if (!wrap) return;
  var eb = document.querySelector('[data-tool="eraser"]');
  if (!eb) return;
  var host = wrap.offsetParent, hostW = host ? host.clientWidth : 0;
  var lf = eb.offsetLeft, wW = wrap.offsetWidth || 0;
  if (hostW > 0 && wW > 0 && lf + wW > hostW - 2) lf = Math.max(0, hostW - wW - 2);
  wrap.style.left = lf + "px";
}
function setTool(t){
  state.tool = t;
  var tools = $("tools").querySelectorAll(".tool");
  for (var i = 0; i < tools.length; i++){
    tools[i].classList.toggle("active", tools[i].getAttribute("data-tool") === t);
  }
  if (localRedo && t !== "rect") localRedo = false;
  resetCanvasCursor();
  /* 两份橡皮菜单都要跟着开合；桌面那份按 eraser 按钮位置定位，iPad 那份由 CSS 向左弹出 */
  var wrap = $("segWrap");
  if (wrap){
    placeEraseMenu();
    wrap.classList.toggle("open", t === "eraser");
  }
  if ($("segWrapPad")) $("segWrapPad").classList.toggle("open", t === "eraser");
  /* 规范①：选工具就收起所有浮层（橡皮的二级菜单属于当前工具，上面刚打开，保留） */
  if (openDrawer) setDrawer(null);
  closeLayerPanel();
  /* 右缘操作条上移动/去背景副本的选中态 */
  var ptl = document.querySelectorAll("#padDockR [data-ptool]");
  for (var pj = 0; pj < ptl.length; pj++){
    ptl[pj].classList.toggle("active", ptl[pj].getAttribute("data-ptool") === t);
  }
}

/* =========================================================
   启动
   ========================================================= */
/* v355：数字输入框的自绘上下微调按钮（替代无法定制的原生 spinner） */
function ensureNumSteppers(){
  var list;
  try{ list=document.querySelectorAll('input[type=number]'); }catch(e){ return; }
  for (var i=0;i<list.length;i++){
    var inp=list[i];
    if (inp._numStep) continue;
    var host=inp.parentNode;
    if (!host) continue;
    if (getComputedStyle(host).position === 'static') host.style.position='relative';
    var box=document.createElement('div');
    box.className='num-step';
    var up=document.createElement('button'); up.type='button'; up.setAttribute('aria-label','增加');
    up.innerHTML='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 15l7-7 7 7" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>';
    var dn=document.createElement('button'); dn.type='button'; dn.setAttribute('aria-label','减少');
    dn.innerHTML='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 9l7 7 7-7" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>';
    (function(inp2){
      up.addEventListener('click', function(e){ e.preventDefault(); e.stopPropagation();
        try{ inp2.stepUp(); }catch(err){}
        inp2.dispatchEvent(new Event('input',{bubbles:true}));
        inp2.dispatchEvent(new Event('change',{bubbles:true}));
      });
      dn.addEventListener('click', function(e){ e.preventDefault(); e.stopPropagation();
        try{ inp2.stepDown(); }catch(err){}
        inp2.dispatchEvent(new Event('input',{bubbles:true}));
        inp2.dispatchEvent(new Event('change',{bubbles:true}));
      });
    })(inp);
    box.appendChild(up); box.appendChild(dn);
    host.appendChild(box);
    inp._numStep=1;
    inp.style.paddingRight='22px';
  }
}
function init(){
  ensureHoverBox();
  updateDeviceClass();            /* 布局形态要在首次渲染前定下来 */
  /* v164：标题条拎到窗口最上面（横跨三栏顶部）。standalone 红绿灯只让出左侧一段
     （CSS: .stage-toolbar{padding-left:78px}），不再整条留白。平板不动：抽屉按钮留在画布台顶部。 */
  try{
    if (!isTablet()){
      var _app = document.querySelector(".app"), _tb = document.querySelector(".stage-toolbar");
      if (_app && _tb && _tb.parentNode !== _app) _app.insertBefore(_tb, _app.querySelector(".layout"));
    }
  }catch(e){}
  var lpHead = document.querySelector(".lp-head");
  if (lpHead) lpAddHome = lpHead;   /* 桌面态 lp-add 的原位 */
  /* v93：打开就是新的，不再把上次的内容塞回画布 —— 要就去草稿箱点开 */
  if (!state.layers || !state.layers.length) initLayers(null);
  var oldBrand = document.querySelector(".brand");
  if (oldBrand) oldBrand.parentNode.removeChild(oldBrand);   /* v97：品牌区下线（云端 HTML 仍有，运行时移除） */
  syncActiveGrid();
  $("inCols").value = state.cols;
  $("inRows").value = state.rows;
  $("chkGrid").checked = state.showGrid;
  $("chkCodes").checked = state.showCodes;
  $("rngTarget").value = state.colorTarget;
  $("lbTarget").textContent = "目标 " + state.colorTarget + " 色";
  $("inRW").value = state.cols; $("inRH").value = state.rows;
  updateOptimizeInfo();
  (function(){
    var fb = $("fitRow").querySelectorAll("button");
    for (var i = 0; i < fb.length; i++) fb[i].classList.toggle("active", fb[i].getAttribute("data-fit") === state.refFit);
    syncEraseMode();
    $("segWrap").classList.toggle("open", state.tool === "eraser");
    if ($("segWrapPad")) $("segWrapPad").classList.toggle("open", state.tool === "eraser");
  })();
  updateLockUI();
  installClearTool();            /* v100：云端「去背景」按钮改造为「清空」（须在 bindUI 前） */
  bindUI();
  updateRefUI();
  setColor(state.colorIdx);
  setTool("pencil");
  renderAll();
  renderLayerPanel();
  /* v352：fitZoom 延迟到布局稳定后（双帧）—— init 时面板/画布尺寸未定型，
     提前计算会拿到错误视口导致画布偏移（左/上边缘格子被裁） */
  requestAnimationFrame(function(){ requestAnimationFrame(function(){ fitZoom(); }); });
  ensureNumSteppers();
  installDraftButton();          /* v80：草稿箱入口（仅平板；桌面由 installToolbar 装「草稿箱」） */
  installToolbar();              /* v96/v98：顶栏信息/动作分组，桌面缩放组下沉工具栏 */
  applyThemeColor();             /* v188：系统标题栏染成页面底色，去掉顶部那条白条 */
  updateStats();                 /* v187：hd-block 副标的尺寸/色数/豆数要等 span 建好后才填得上（boot 里 renderAll 在 installToolbar 之前） */
  if (!projName) applyProjName(nameSync());   /* v202：先把标题填上，不等草稿箱 */
  installProjName();             /* v97：顶栏中央的图纸名 */
  installNewButton();            /* v97：新建画布入口 */
  installSaveDraftBtn();         /* v98：存草稿动作（桌面） */
  installImportBtn();            /* v140：导入文件（新建旁边） */
  installRefreshBtn();           /* v155：版本号 + 检查更新/强刷（顶栏最右） */
  nameForNew().then(applyProjName);   /* v97：初始默认名（0924-01） */
  bindSessionSave();             /* v93：切后台 / 关页面 → 归档进草稿箱 */
  sessionRecover();              /* v93：本地副本只补进草稿箱，绝不自动载入 */
  offerSessionRestore();         /* v133：画布是空的就主动问一句要不要恢复上次那份 */
}
/* =========================================================
   v133：刷新 ≠ 丢图
   关闭/刷新前进度会自动归档进草稿箱（bindSessionSave），但 v93 刻意不自动载入
   —— 结果用户刷新后看到空白画布，第一反应是「我的图没了」，还得自己去草稿箱翻。
   v139：不再弹窗问「要不要恢复」—— 弹窗打断人，很烦。
   数据反正已经在草稿箱里躺着，安静说一句就够，要用的人自己去草稿箱点开。
   画布上有内容时一个字都不说。
   ========================================================= */
function offerSessionRestore(){
  if (typeof hasContent !== "function") return;
  setTimeout(function(){
    if (hasContent()) return;
    draftAll().then(function(list){
      list = list || [];
      var best = null, i;
      for (i = 0; i < list.length; i++){
        if (!list[i].auto) continue;
        if (!best || (list[i].updatedAt || 0) > (best.updatedAt || 0)) best = list[i];
      }
      if (!best) return;
      var when = "";
      try{ when = draftRelTime(best.updatedAt); }catch(e){}
      toast("上次没画完的「" + (best.name || "未命名图纸") + "」已存草稿箱" +
            (when ? "（" + when + "）" : "") + "，点「草稿箱」找回");
    }).catch(function(){});
  }, 1200);
}
/* v141：存到 macOS 程序坞（Safari「添加到程序坞」＝ standalone PWA）打开时，
   窗口没有标题栏，系统红绿灯直接浮在内容左上角、会盖住 UI。
   检测到就给 html 挂 .standalone，CSS 里把骨架往下让一个标题栏高度。
   双保险：matchMedia 不认识的旧浏览器再测 navigator.standalone（iOS 用）。
   v146：iPad / iPhone 加到主屏幕也算 standalone，但它们的顶栏已经写了
   `padding:calc(4px + env(safe-area-inset-top))`，状态栏避让是自带的 ——
   再叠这 28px 会在顶部空出一大条。所以 iOS 系一律不加这个类。 */
(function(){
  var sa = false;
  try{ sa = !!(window.matchMedia && matchMedia("(display-mode: standalone)").matches); }catch(e){}
  if (!sa){ try{ sa = window.navigator.standalone === true; }catch(e){} }
  if (!sa) return;
  var ua = "";
  try{ ua = navigator.userAgent || ""; }catch(e){}
  var ios = /iPad|iPhone|iPod/.test(ua);
  if (!ios){
    try{ ios = (navigator.platform === "MacIntel") && navigator.maxTouchPoints > 1; }catch(e){}
  }
  if (!ios) document.documentElement.classList.add("standalone");
})();
init();

})();
</script>
