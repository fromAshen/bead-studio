}
/* 绘制过程中只刷新当前层缩略图，节流避免每笔都重画 10 张 */
function touchThumb(){
  clearTimeout(thumbTimer);
  thumbTimer = setTimeout(renderLayerPanel, 260);
}

/* =========================================================
   图层拖拽排序
   鼠标：移动 5px 即进入拖拽。触摸：长按 320ms 才进入，
   否则纵向滑动会和列表滚动打架（横排手机端则是横向滚动）。
   ========================================================= */
var lpDrag = null, lpDragDone = false;
function lpItems(){ return $("lpList").querySelectorAll(".lp-item[data-i]"); }
function lpIsRow(){
  var s = getComputedStyle($("lpList"));
  return s.flexDirection === "row" || s.flexDirection === "row-reverse";
}
function lpClearMarks(){
  var els = $("lpList").querySelectorAll(".drop-before,.drop-after");
  for (var i = 0; i < els.length; i++) els[i].classList.remove("drop-before", "drop-after");
}
/* 返回 DOM 插入位 k（0..n）。DOM 是倒序的，所以数组插入位 = len - k */
function lpDropSlot(x, y){
  var it = lpItems(), row = lpIsRow(), p = row ? x : y;
  for (var k = 0; k < it.length; k++){
    var r = it[k].getBoundingClientRect();
    if (p < (row ? r.left + r.width / 2 : r.top + r.height / 2)) return k;
  }
  return it.length;
}
function lpMark(k){
  lpClearMarks();
  var it = lpItems();
  if (!it.length) return;
  if (k < it.length) it[k].classList.add("drop-before");
  else it[it.length - 1].classList.add("drop-after");
}
function lpEndDrag(commit){
  if (!lpDrag) return;
  var d = lpDrag; lpDrag = null;
  clearTimeout(d.timer);
  d.el.classList.remove("dragging");
  lpClearMarks();
  if (!d.on) return;
  lpDragDone = true;                                  // 抑制紧随其后的 click
  if (commit && d.slot !== undefined){
    var name = state.layers[d.from] ? state.layers[d.from].name : "";
    if (reorderLayer(d.from, state.layers.length - d.slot)) toast("已移动「" + name + "」");
    else renderLayerPanel();
  } else renderLayerPanel();
}
function bindLayerDrag(){
  var list = $("lpList");
  list.addEventListener("pointerdown", function(e){
    if (e.button === 2) return;
    var it = e.target.closest ? e.target.closest(".lp-item[data-i]") : null;
    if (!it) return;
    /* 眼睛 / 锁 / 透明度滑杆 / 勾选框 / 操作按钮 / 改名中 —— 都不该触发拖拽 */
    if (e.target.closest("button, input, [contenteditable='true']")) return;
    lpDrag = { el: it, from: +it.getAttribute("data-i"), x: e.clientX, y: e.clientY,
               id: e.pointerId, touch: e.pointerType !== "mouse", on: false, timer: 0 };
    if (lpDrag.touch){
      lpDrag.timer = setTimeout(function(){
        if (!lpDrag) return;
        lpDrag.on = true;
        lpDrag.el.classList.add("dragging");
        lpMark(lpDrag.slot = lpDropSlot(lpDrag.x, lpDrag.y));
      }, 320);
    }
  });
  window.addEventListener("pointermove", function(e){
    if (!lpDrag || e.pointerId !== lpDrag.id) return;
    var m = Math.abs(e.clientX - lpDrag.x) + Math.abs(e.clientY - lpDrag.y);
    if (!lpDrag.on){
      if (lpDrag.touch){
        if (m > 12){ clearTimeout(lpDrag.timer); lpDrag = null; }   // 判为滚动列表，放手
        return;
      }
      if (m <= 5) return;
      lpDrag.on = true;
      lpDrag.el.classList.add("dragging");
    }
    e.preventDefault();
    lpMark(lpDrag.slot = lpDropSlot(e.clientX, e.clientY));
  }, { passive: false });
  window.addEventListener("pointerup", function(){ lpEndDrag(true); });
  window.addEventListener("pointercancel", function(){ lpEndDrag(false); });
}

/* =========================================================
   历史记录
   ========================================================= */
var undoStack = [], redoStack = [], snapshotBefore = null;
/* 快照要带上整套图层（结构 + 内容），否则撤销会把图层弄乱 */
function snapshot(){
  var ls = [], i;
  for (i = 0; i < state.layers.length; i++){
    var L = state.layers[i];
    ls.push({ id: L.id, name: L.name, kind: L.kind, grid: L.grid.slice(),
              opacity: L.opacity, visible: L.visible, locked: L.locked });
  }
  return { cols: state.cols, rows: state.rows, layers: ls, active: state.active,
           refOff: {x: state.refOff.x, y: state.refOff.y} };
}
/* 擦除方式「单格 / 框选 / 同色连片」：桌面在 dock 底部横排，iPad 在右栏橡皮旁竖排弹出。
   两份 DOM 同时存在（各自只在对应形态显示），状态同步统一走这两个函数，
   只更新其中一份就会出现「点了没反应 / 两份显示不一致」。 */
function erModeBtns(){
  var a = $("eraseModes") ? $("eraseModes").querySelectorAll(".seg-b") : [];
  var b = $("eraseModesPad") ? $("eraseModesPad").querySelectorAll(".seg-b") : [];
  var out = [];
  for (var i = 0; i < a.length; i++) out.push(a[i]);
  for (var j = 0; j < b.length; j++) out.push(b[j]);
  return out;
}
function syncEraseMode(){
  var all = erModeBtns();
  for (var i = 0; i < all.length; i++)
    all[i].classList.toggle("active", all[i].getAttribute("data-em") === state.eraseMode);
}
function beginChange(){ snapshotBefore = snapshot(); }
function sameSnapshot(a){
  if (a.cols !== state.cols || a.rows !== state.rows) return false;
  if (a.layers.length !== state.layers.length || a.active !== state.active) return false;
  if (a.refOff.x !== state.refOff.x || a.refOff.y !== state.refOff.y) return false;
  for (var i = 0; i < a.layers.length; i++){
    var x = a.layers[i], L = state.layers[i];
    if (x.id !== L.id || x.name !== L.name || x.opacity !== L.opacity ||
        x.visible !== L.visible || x.locked !== L.locked) return false;
    if (!sameGrid(x.grid, L.grid)) return false;
  }
  return true;
}
function endChange(){
  if (!snapshotBefore) return;
  var before = snapshotBefore; snapshotBefore = null;
  if (sameSnapshot(before)) return;
  undoStack.push(before);
  if (undoStack.length > 60) undoStack.shift();
  redoStack.length = 0;
  markLayerDirty(activeLayer());
  touchThumb();
  saveDraft();
}
function sameGrid(a, b){
  if (a.length !== b.length) return false;
  for (var i = 0; i < a.length; i++) if (a[i] !== b[i]) return false;
  return true;
}
function applySnapshot(s){
  state.cols = s.cols; state.rows = s.rows;
  state.layers = [];
  for (var i = 0; i < s.layers.length; i++){
    var x = s.layers[i];
    var L = makeLayer(x.name, x.kind, x.grid.slice());
    L.id = x.id; L.opacity = x.opacity; L.visible = x.visible; L.locked = x.locked;
    state.layers.push(L);
  }
  if (!state.layers.length) initLayers(null);
  state.active = clamp(s.active | 0, 0, state.layers.length - 1);
  state.refActive = false;
  syncActiveGrid();
  markAllLayersDirty();
  state.refOff.x = s.refOff.x; state.refOff.y = s.refOff.y;
  $("inCols").value = s.cols; $("inRows").value = s.rows;
  if (state.lockRatio) state.lockVal = clamp(s.rows / s.cols, 0.04, 25);
  renderAll();
  renderLayerPanel();
}
function undo(){
  if (!undoStack.length) { toast("没有可撤销的操作"); return; }
  redoStack.push(snapshot());
  applySnapshot(undoStack.pop());
  saveDraft();
}
function redo(){
  if (!redoStack.length) { toast("没有可重做的操作"); return; }
  undoStack.push(snapshot());
  applySnapshot(redoStack.pop());
  saveDraft();
}

/* =========================================================
   绘制：豆子 / 网格 / 标尺
   ========================================================= */
function roundRectPath(c, x, y, w, h, r){
  r = Math.min(r, w/2, h/2);
  c.beginPath();
  c.moveTo(x + r, y);
  c.arcTo(x + w, y, x + w, y + h, r);
  c.arcTo(x + w, y + h, x, y + h, r);
  c.arcTo(x, y + h, x, y, r);
  c.arcTo(x, y, x + w, y, r);
  c.closePath();
}
/* 单元格绘制：圆豆 / 色块 / 带色号标注（idx = 调色板下标） */
function drawCell(c, x, y, s, idx, hi){
  var p = PALETTE[idx];
  c.fillStyle = p.h;
  c.fillRect(x, y, s, s);                     // 铺满整格：无间隙、无圆角
  if (state.showCodes && s >= 12){
    var rgb = hexToRgb(p.h);
    var lum = (rgb[0] * 0.299 + rgb[1] * 0.587 + rgb[2] * 0.114) / 255;
    var fs = Math.max(6, Math.min(s * 0.44, 13));
    c.font = "800 " + fs.toFixed(1) + "px 'Helvetica Neue',Arial,'PingFang SC',sans-serif";
    c.textAlign = "center"; c.textBaseline = "middle";
    c.fillStyle = lum >= 0.6 ? "#1D1D1F" : "#FFFFFF";
    c.fillText(p.id, x + s/2, y + s/2 + 0.5);
  }
  if (hi){
    c.lineWidth = 1.5; c.strokeStyle = "#111114";   /* 与 --ring 同值（canvas 不认 CSS 变量） */
    c.strokeRect(x + 1, y + 1, s - 2, s - 2);
  }
}

/* 取模（结果恒为正） */
function relMod(v, m){ return ((v % m) + m) % m; }
/* 主网格（每 10 格）居中分布：除不尽的余量平均分到两侧
   52 → 1 + 50 + 1、78 → 4 + 70 + 4、104 → 2 + 100 + 2 */
function gridOffset(n){ return Math.floor(relMod(n, 10) / 2); }
/* v87：画布与导出共用同一套主线偏移 —— 以前画布居中、导出却从左边排，
   两边对不上。现在切到「自适应」后的尺寸就按 10 的倍数排，导出照抄画布。 */
function gridOffX(){ return state.gridAlign === "start" ? 0 : gridOffset(state.cols); }
function gridOffY(){ return state.gridAlign === "start" ? 0 : gridOffset(state.rows); }

/* 画一层的格子到给定 context。shx/shy 是移动工具的实时预览偏移 */
function drawLayerCells(c, g, cols, rows, s, shx, shy, allowHi){
  for (var y = 0; y < rows; y++){
    var py = y + shy;
    if (py < 0 || py >= rows) continue;
    for (var x = 0; x < cols; x++){
      var v = g[y*cols + x];
      if (!v) continue;
      var px = x + shx;
      if (px < 0 || px >= cols) continue;
      drawCell(c, px*s, py*s, s, v-1, allowHi && v-1 === state.highlight);
    }
  }
}
/* 非活动层缓存到离屏画布：10 层 × 4 万格逐帧重画会卡，
   只有内容/缩放/尺寸变化时才重建 */
function layerCanvas(L, sp, cols, rows, s){
  var d = dpr();
  if (L._cv && !L._dirty && L._z === state.zoom && L._c === cols && L._r === rows &&
      L._codes === state.showCodes) return L._cv;
  var cv = L._cv || document.createElement("canvas");
  cv.width = Math.max(1, Math.round(sp.w * d));
  cv.height = Math.max(1, Math.round(sp.h * d));
  var cc = cv.getContext("2d");
  cc.setTransform(d, 0, 0, d, 0, 0);
  cc.clearRect(0, 0, sp.w, sp.h);
  drawLayerCells(cc, L.grid, cols, rows, s, 0, 0, false);
  L._cv = cv; L._dirty = false;
  L._z = state.zoom; L._c = cols; L._r = rows; L._codes = state.showCodes;
  return cv;
}
function renderGrid(){
  var sp = sizePx(), c = setupCanvas(gridCanvas, sp.w, sp.h), s = cellPx();
  c.clearRect(0, 0, sp.w, sp.h);          // 空格保持透明，露出棋盘格底

  var cols = state.cols, rows = state.rows;
  var shx = shiftPrev ? shiftPrev.dx : 0, shy = shiftPrev ? shiftPrev.dy : 0;
  /* 从下到上叠加所有可见图层：上层的豆子盖住下层 */
  for (var li = 0; li < state.layers.length; li++){
    var L = state.layers[li];
    if (!L.visible) continue;
    var isAct = (li === state.active && !state.refActive);
    c.save();
    c.globalAlpha = clamp(L.opacity, 0, 1);
    if (isAct){
      drawLayerCells(c, L.grid, cols, rows, s, shx, shy, true);
    } else {
      c.drawImage(layerCanvas(L, sp, cols, rows, s), 0, 0, sp.w, sp.h);
    }
    c.restore();
  }

  // 形状预览
  if (pending){
    if (pending.tool === "eraser"){
      var ex0 = Math.min(pending.x0, pending.x1), ex1 = Math.max(pending.x0, pending.x1);
      var ey0 = Math.min(pending.y0, pending.y1), ey1 = Math.max(pending.y0, pending.y1);
      c.save();
      c.fillStyle = "rgba(255,255,255,.72)";
      c.fillRect(ex0*s, ey0*s, (ex1 - ex0 + 1)*s, (ey1 - ey0 + 1)*s);
      c.setLineDash([5, 4]); c.lineWidth = 1.6; c.strokeStyle = "rgba(29,29,31,.75)";
      c.strokeRect(ex0*s + .8, ey0*s + .8, (ex1 - ex0 + 1)*s - 1.6, (ey1 - ey0 + 1)*s - 1.6);
      c.restore();
    } else {
      c.save();
      c.globalAlpha = 0.55;
      var pts = shapePoints(pending);
      for (var i = 0; i < pts.length; i++){
        var p = pts[i];
        drawCell(c, p.x*s, p.y*s, s, state.colorIdx, false);
      }
      c.restore();
    }
  }

  if (state.showGrid){
    var i2, px, lw = Math.max(1, Math.min(1.4, s * 0.06));
    var offX = gridOffX(), offY = gridOffY();
    // 每格细线（v222：跳过口径 5→10，虚线已删不再留大缺口；位置不取整，间距均匀）
    c.lineWidth = 1; c.strokeStyle = "rgba(17,17,20,.08)";
    c.beginPath();
    for (i2 = 1; i2 < cols; i2++){
      if (relMod(i2 - offX, 10) === 0) continue;
      px = i2*s;
      c.moveTo(px, 0); c.lineTo(px, sp.h);
    }
    for (i2 = 1; i2 < rows; i2++){
      if (relMod(i2 - offY, 10) === 0) continue;
      px = i2*s;
      c.moveTo(0, px); c.lineTo(sp.w, px);
    }
    c.stroke();
    /* v219：每 5 格虚线取消 —— 画布上只保留两档线（细格 + 每 10 格），更干净 */
    // 每 10 格：实线加粗
    c.lineWidth = Math.max(1.2, Math.min(1.6, s * 0.07));
    c.strokeStyle = "rgba(17,17,20,.20)";
    c.beginPath();
    for (i2 = 1; i2 < cols; i2++){
      if (relMod(i2 - offX, 10) !== 0) continue;
      px = i2*s;
      c.moveTo(px, 0); c.lineTo(px, sp.h);
    }
    for (i2 = 1; i2 < rows; i2++){
      if (relMod(i2 - offY, 10) !== 0) continue;
      px = i2*s;
      c.moveTo(0, px); c.lineTo(sp.w, px);
    }
    c.stroke();
    // 外框
    c.lineWidth = Math.max(1.2, Math.min(1.6, s * 0.07));
    c.strokeStyle = "rgba(17,17,20,.20)";
    c.strokeRect(lw/2, lw/2, sp.w - lw, sp.h - lw);
  }

  /* 悬停高亮：把「鼠标正下方的那一格」画出来 —— 所见即所画，
     避免格子小 / 底图叠加时判断不了点在哪一格 */
  if (hoverCell >= 0){
    var hx = hoverCell % cols, hy = (hoverCell / cols) | 0;
    var lw2 = Math.max(1.2, Math.min(1.8, s * 0.08));
    c.save();
    c.lineWidth = lw2; c.strokeStyle = "rgba(17,17,20,.45)";
    c.strokeRect(hx * s + lw2 / 2, hy * s + lw2 / 2, s - lw2, s - lw2);
    c.lineWidth = Math.max(1, lw2 - 1); c.strokeStyle = "rgba(255,255,255,.9)";
    c.strokeRect(hx * s + lw2, hy * s + lw2, s - lw2 * 2, s - lw2 * 2);
    c.restore();
  }
}

function renderRef(){
  var sp = sizePx(), c = setupCanvas(refCanvas, sp.w, sp.h);
  c.clearRect(0, 0, sp.w, sp.h);
  var img = state.refImage;                     // 画布上只叠原图，重绘稿单独展示在对比框里
  if (!img || !state.showRef || !state.refVisible) return;
  var iw = img.naturalWidth || img.width, ih = img.naturalHeight || img.height;
  var k = (state.refFit === "cover") ? Math.max(sp.w / iw, sp.h / ih) : Math.min(sp.w / iw, sp.h / ih);
  var dw = iw * k, dh = ih * k;
  var dx = (sp.w - dw) / 2 + state.refOff.x * state.zoom;
  var dy = (sp.h - dh) / 2 + state.refOff.y * state.zoom;
  c.save();
  c.globalAlpha = clamp(state.refOpacity, 0.05, 1);
  c.imageSmoothingEnabled = true;
  c.imageSmoothingQuality = "high";
  c.drawImage(img, dx, dy, dw, dh);
  c.restore();
}



/* =========================================================
   布局：双向居中（内容超出时改为起点对齐，保证可滚动）
   ========================================================= */
function updateLayout(){
  var sp = sizePx();
  canvasStack.style.width = sp.w + "px";
  canvasStack.style.height = sp.h + "px";

  var needW = sp.w + 44, needH = sp.h + 44;
  var cw = canvasScroll.clientWidth, ch = canvasScroll.clientHeight;

  canvasScroll.classList.toggle("ax-center", needW <= cw);
  canvasScroll.classList.toggle("ax-start", needW > cw);
  canvasScroll.classList.toggle("ay-center", needH <= ch);
  canvasScroll.classList.toggle("ay-start", needH > ch);

  /* v187：infoSize/infoZoom2 在桌面端已被 v186 移出顶栏，sizeTag 也可能不在——
     这些引用必须判空，否则 renderAll 在这里抛错，后面的 updateStats/updatePaletteMarks 全被跳过 */
  var eS = $("infoSize"); if (eS) eS.textContent = state.cols + " × " + state.rows;
  var eT = $("sizeTag"); if (eT) eT.textContent = state.cols + " × " + state.rows;
  var eV = $("zoomVal"); if (eV) eV.textContent = Math.round(state.zoom * 100) + "%";
  var mmW = state.cols * BEAD_MM, mmH = state.rows * BEAD_MM;
  var useCm = Math.max(mmW, mmH) >= 100;
  var unit = useCm ? " cm" : " mm";
  function nv(v){ return (useCm ? v / 10 : v).toFixed(1); }
  var eZ = $("infoZoom2"); if (eZ) eZ.textContent = "实物 " + nv(mmW) + " × " + nv(mmH) + unit;
}

function renderAll(){
  renderRef();
  renderGrid();
  updateLayout();
  updateStats();
  updatePaletteMarks();
  syncPresetActive();
}

/* =========================================================
   缩放
   ========================================================= */
function setZoom(z, centerKeep){
  z = clamp(z, MIN_ZOOM, MAX_ZOOM);
  var sc = canvasScroll;
  var cx = 0.5, cy = 0.5, cellBefore = cellPx();
  if (centerKeep){
    cx = (sc.scrollLeft + sc.clientWidth / 2) / Math.max(1, state.cols * cellBefore);
    cy = (sc.scrollTop + sc.clientHeight / 2) / Math.max(1, state.rows * cellBefore);
  }
  state.zoom = z;
  renderAll();
  if (centerKeep){
    var cp = cellPx();
    sc.scrollLeft = cx * state.cols * cp - sc.clientWidth / 2;
    sc.scrollTop = cy * state.rows * cp - sc.clientHeight / 2;
  }
  saveDraft();
}
function fitZoom(){
  var sp0 = { w: state.cols * CELL, h: state.rows * CELL };
  var padX = 66, padY = 66;
  var z = Math.min((canvasScroll.clientWidth - padX) / sp0.w, (canvasScroll.clientHeight - padY) / sp0.h);
  setZoom(clamp(z, MIN_ZOOM, MAX_ZOOM), false);
  centerCanvas();
}
/* v72：把画布挪回正中。画布可以随便拖（拖出可视区也正常），
   但点「1:1」或「适应屏幕」时必须能一步找回原位。 */
function centerCanvas(){
  var sc = canvasScroll;
  sc.scrollLeft = Math.max(0, (sc.scrollWidth - sc.clientWidth) / 2);
  sc.scrollTop  = Math.max(0, (sc.scrollHeight - sc.clientHeight) / 2);
}

/* =========================================================
   坐标换算 & 绘制交互
   ========================================================= */
function cellAt(e){
  var r = gridCanvas.getBoundingClientRect();
  var x = e.clientX - r.left, y = e.clientY - r.top;
  var s = cellPx();
  var c = Math.floor(x / s), rw = Math.floor(y / s);
  if (c < 0 || rw < 0 || c >= state.cols || rw >= state.rows) return null;
  return { x: c, y: rw, i: rw * state.cols + c };
}
function shapePoints(p){
  var pts = [], x, y;
  if (p.tool === "ellipse"){
    /* 格子中心落在椭圆内即入选 */
    var x0 = Math.min(p.x0, p.x1), x1 = Math.max(p.x0, p.x1);
    var y0 = Math.min(p.y0, p.y1), y1 = Math.max(p.y0, p.y1);
    var cx = (x0 + x1 + 1) / 2, cy = (y0 + y1 + 1) / 2;
    var rx = (x1 - x0 + 1) / 2, ry = (y1 - y0 + 1) / 2;
    /* 椭圆同样是 1 格宽的轮廓：格子中心要落在椭圆内、且落在「缩一圈」的内椭圆外 */
    var irx = Math.max(rx - 1, 0.01), iry = Math.max(ry - 1, 0.01);
    for (y = y0; y <= y1; y++) for (x = x0; x <= x1; x++){
      var ddx = (x + 0.5 - cx) / rx, ddy = (y + 0.5 - cy) / ry;
      var idx = (x + 0.5 - cx) / irx, idy = (y + 0.5 - cy) / iry;
      if (ddx * ddx + ddy * ddy <= 1.0 && idx * idx + idy * idy > 1.0) pts.push({x:x, y:y});
    }
  } else if (p.tool === "rect"){
    /* 矩形工具 = 1 格宽的空心边框（实心留给「橡皮·框选」和局部细化的区域填充）。
       局部细化走的是 redoRegion(矩形范围)，不经过这里，所以不受影响。 */
    var x0 = Math.min(p.x0, p.x1), x1 = Math.max(p.x0, p.x1);
    var y0 = Math.min(p.y0, p.y1), y1 = Math.max(p.y0, p.y1);
    for (x = x0; x <= x1; x++){ pts.push({x:x, y:y0}); pts.push({x:x, y:y1}); }
    for (y = y0 + 1; y <= y1 - 1; y++){ pts.push({x:x0, y:y}); pts.push({x:x1, y:y}); }
  } else if (p.tool === "fill-rect" || p.tool === "eraser"){
    var x0 = Math.min(p.x0, p.x1), x1 = Math.max(p.x0, p.x1);
    var y0 = Math.min(p.y0, p.y1), y1 = Math.max(p.y0, p.y1);
    for (y = y0; y <= y1; y++) for (x = x0; x <= x1; x++) pts.push({x:x, y:y});
  } else {
    // Bresenham
    var dx = Math.abs(p.x1 - p.x0), dy = Math.abs(p.y1 - p.y0);
    var sx = p.x0 < p.x1 ? 1 : -1, sy = p.y0 < p.y1 ? 1 : -1;
    var err = dx - dy, cx = p.x0, cy = p.y0;
    for (;;){
      pts.push({x:cx, y:cy});
      if (cx === p.x1 && cy === p.y1) break;
      var e2 = 2 * err;
      if (e2 > -dy){ err -= dy; cx += sx; }
      if (e2 < dx){ err += dx; cy += sy; }
    }
  }
  return pts;
}
function floodFill(i, toVal){
  var target = state.grid[i];
  if (target === toVal) return false;
  var cols = state.cols, rows = state.rows, g = state.grid;
  var stack = [i], x, y, j;
  while (stack.length){
    j = stack.pop();
    if (g[j] !== target) continue;
    g[j] = toVal;
    x = j % cols; y = (j - x) / cols;
    if (x > 0) stack.push(j - 1);
    if (x < cols - 1) stack.push(j + 1);
    if (y > 0) stack.push(j - cols);
    if (y < rows - 1) stack.push(j + cols);
  }
  return true;
}
/* 同色连通区域掩码（4 邻域，与「填充」的范围一致） */
function floodSameMask(seed){
  var g = state.grid, cols = state.cols, rows = state.rows;
  var v = g[seed];
  if (!v) return null;
  var mask = new Uint8Array(g.length), stack = [seed];
  mask[seed] = 1;
  while (stack.length){
    var j = stack.pop(), jx = j % cols, jy = (j - jx) / cols, ni;
    if (jx > 0)        { ni = j - 1;    if (!mask[ni] && g[ni] === v){ mask[ni] = 1; stack.push(ni); } }
    if (jx < cols - 1) { ni = j + 1;    if (!mask[ni] && g[ni] === v){ mask[ni] = 1; stack.push(ni); } }
    if (jy > 0)        { ni = j - cols; if (!mask[ni] && g[ni] === v){ mask[ni] = 1; stack.push(ni); } }
    if (jy < rows - 1) { ni = j + cols; if (!mask[ni] && g[ni] === v){ mask[ni] = 1; stack.push(ni); } }
  }
  return mask;
}
/* 整体移动图案：按格位移，移出画布的部分裁掉（可撤销） */
function shiftGrid(dx, dy){
  var g = state.grid, cols = state.cols, rows = state.rows;
  var ng = new Array(cols * rows);
  for (var i = 0; i < ng.length; i++) ng[i] = 0;
  for (var y = 0; y < rows; y++){
    var ny = y + dy;
    if (ny < 0 || ny >= rows) continue;
    for (var x = 0; x < cols; x++){
      var nx = x + dx;
      if (nx < 0 || nx >= cols) continue;
      ng[ny * cols + nx] = g[y * cols + x];
    }
  }
  setActiveGrid(ng);
}
function applyAt(cell, isStart){
  var g = state.grid, t = state.tool, v;
  if (t === "replace"){
    if (!isStart) return false;
    var old = g[cell.i];
    if (old === 0){ toast("这里是空格子"); return false; }
    v = state.colorIdx + 1;
    if (old === v) return false;
    for (var k = 0; k < g.length; k++) if (g[k] === old) g[k] = v;
    toast("已替换：" + PALETTE[old-1].n + " → " + PALETTE[v-1].n);
    return true;
  }
  if (t === "pencil" || t === "rect" || t === "line"){
    v = state.colorIdx + 1;
    if (g[cell.i] === v) return false;
    g[cell.i] = v; return true;
  }
  if (t === "eraser"){
    if (g[cell.i] === 0) return false;
    g[cell.i] = 0; return true;
  }
  if (t === "fill"){
    if (!isStart) return false;
    return floodFill(cell.i, state.colorIdx + 1);
  }
  if (t === "picker"){
    var cur = g[cell.i];
    if (cur > 0){ setColor(cur - 1); toast("已取色：" + PALETTE[cur-1].id + " " + PALETTE[cur-1].n); }
    else toast("这里是空格子");
    return false;
  }
  if (t === "outline"){
    if (!isStart) return false;
    return outlineAt(cell.i);
  }
  return false;
}

/* 画布光标：移动工具/抓手各有形态，其余是画笔十字。三处收尾共用，避免漏改 */
function resetCanvasCursor(){
  gridCanvas.style.cursor = state.tool === "move" ? "move" : (state.tool === "hand" ? "grab" : "crosshair");
}
function startPan(e){
  panning = { sx: e.clientX, sy: e.clientY, sl: canvasScroll.scrollLeft, st: canvasScroll.scrollTop, warned: false };
  try { e.currentTarget.setPointerCapture(e.pointerId); } catch(err) {}
  gridCanvas.style.cursor = "grabbing";
  e.preventDefault();
}
/* ---------- 触摸双指：拖动平移 + 捏合缩放 ----------
   手机既没有中键也没有空格键，画布又是 touch-action:none，
   没有这段就完全没法在小屏上移动视野 —— 只能靠这里补 */
var pinch = null, pinchT = 0, pinchRAF = false;
function tDist(t){
  var dx = t[0].clientX - t[1].clientX, dy = t[0].clientY - t[1].clientY;
  return Math.sqrt(dx*dx + dy*dy) || 1;
}
function tMid(t){ return { x:(t[0].clientX + t[1].clientX)/2, y:(t[0].clientY + t[1].clientY)/2 }; }
function pinchReset(t, z){
  var m = tMid(t);
  pinch.d = tDist(t); pinch.mx = m.x; pinch.my = m.y; pinch.z = z;

}
/* v75：捏合缩放不再「每 55ms 真重绘一次 + 以视口中心为锚点」——
   那样手指底下的内容每跳一级就漂移一次，看着就是画面乱跳。
   改成：过程里只用 transform 做预览（全程零重绘，60fps），抬手时按双指中点结算一次。 */
function pinchPreview(k, dx, dy){
  var f = canvasFrame;
  f.style.transformOrigin = (pinch.u * 100) + "% " + (pinch.v * 100) + "%";
  f.style.transform = "translate(" + dx + "px," + dy + "px) scale(" + k + ")";
}
/* 抬手结算：把「双指中点指向的那个画板坐标」重新对回手指底下 */
function pinchCommit(nz, mx, my){
  var f = canvasFrame;
  f.style.transform = ""; f.style.transformOrigin = "";
  setZoom(nz, false);
  var r = f.getBoundingClientRect();
  canvasScroll.scrollLeft += (r.left + pinch.u * r.width) - mx;
  canvasScroll.scrollTop  += (r.top  + pinch.v * r.height) - my;

/* ---------- 多指轻点：双指撤销 / 三指重做（与 Procreate 一致） ----------
   关键点：第一根手指落下时 pointerdown 已经画了一格。多指一旦成立，
   必须先把这次未完成的改动回滚 —— 否则「双指轻点撤销」会变成
   「先误画一格、再撤销掉它」，用户看着毫无反应。
   顺带修掉一个老问题：双指平移前那一格误画，以前一直留在图纸上。 */
var tap = null;

  if (!snapshotBefore) return false;

  snapshotBefore = null;
  drawing = null; pending = null; moving = null; refDrag = null; shiftPrev = null;
  applySnapshot(s);                     /* 内部已 renderAll + renderLayerPanel */
  updateStats(); updatePaletteMarks();

gridCanvas.addEventListener("touchstart", function(e){
  if (e.touches.length >= 2){
    cancelPendingStroke();
    if (!tap) tap = { n: e.touches.length, t: Date.now(),

    else tap.n = Math.max(tap.n, e.touches.length);
  }
  if (e.touches.length !== 2){ pinch = null; return; }
  pinch = {};
  pinchReset(e.touches, state.zoom);
  /* 锚点 = 双指中点在画板上的相对位置（用未变换的 rect 量） */
  var pr = canvasFrame.getBoundingClientRect(), pm = tMid(e.touches);
  pinch.u = clamp((pm.x - pr.left) / Math.max(1, pr.width), 0, 1);
  pinch.v = clamp((pm.y - pr.top) / Math.max(1, pr.height), 0, 1);

    if (Math.abs(e.touches[0].clientX - tap.x) > 12 ||
        Math.abs(e.touches[0].clientY - tap.y) > 12) tap.moved = true;
  }
  if (!pinch || e.touches.length !== 2) return;

  if (!pinch.zooming && Math.abs(nz - state.zoom) > 0.004) pinch.zooming = true;
  if (pinch.zooming){
    if (!pinchRAF){
      pinchRAF = true;
      requestAnimationFrame(function(){

        if (pinch && pinch.zooming) pinchPreview(pinch.nz / pinch.z, pinch.dx, pinch.dy);

gridCanvas.addEventListener("touchend", function(e){
  if (e.touches.length < 2 && pinch){
    /* v75：预览模式在这里一次性结算（真重绘只发生一次）；纯平移则已实时滚动过 */
    if (pinch.zooming) pinchCommit(pinch.nz, pinch.cx, pinch.cy);

  }
  if (tap && e.touches.length === 0){
    var q = tap; tap = null;
    if (!q.moved && Date.now() - q.t < 320){
      if (q.n === 2){
        var hadU = undoStack.length > 0;
        undo();
        if (hadU) toast("双指轻点：已撤销");
      } else if (q.n >= 3){
        var hadR = redoStack.length > 0;

      }

gridCanvas.addEventListener("touchcancel", function(){
  /* 中断时也要结算，否则画板会停在 transform 预览态 */
  if (pinch){
    if (pinch.zooming) pinchCommit(pinch.nz, pinch.cx, pinch.cy);
    else { canvasFrame.style.transform = ""; canvasFrame.style.transformOrigin = ""; }
    pinch = null;
  }
  tap = null;
});

function panTick(e){
  if (!panning) return;
  if (!panning.warned &&
      canvasScroll.scrollWidth <= canvasScroll.clientWidth + 1 &&
      canvasScroll.scrollHeight <= canvasScroll.clientHeight + 1){
    panning.warned = true;
    toast("当前缩放下画布已完整显示，放大后即可平移");
  }
  canvasScroll.scrollLeft = panning.sl - (e.clientX - panning.sx);
  canvasScroll.scrollTop = panning.st - (e.clientY - panning.sy);
}
canvasScroll.addEventListener("pointerdown", function(e){
  if (e.button !== 1 || e.target === gridCanvas) return;   // 中键拖空白处平移视图
  startPan(e);
});
canvasScroll.addEventListener("pointermove", panTick);
canvasScroll.addEventListener("pointerup", function(){
  if (panning){ panning = null; resetCanvasCursor(); }
});
gridCanvas.addEventListener("pointerdown", function(e){
  /* 规范：点画布 → 收起所有浮层与菜单（工具选择保留） */
  if (openDrawer || document.querySelector(".layer-panel.open")) closeAllOverlays();
  if (e.button === 2) return;                 // 右键留给擦除
  /* 触摸时第二根手指不参与绘制（它属于双指手势） */
  if (e.pointerType === "touch" && !e.isPrimary) return;
  if (e.pointerType === "pen") notePenInput();
  if (e.button === 1 || spaceDown || state.tool === "hand"){
    startPan(e);
    return;
  }
  /* 选中参考图层时：拖动 = 挪动底图位置（方便和格子对齐） */
  if (state.refActive){
    if (!state.refImage){ toast("还没有上传参考图"); return; }
    try { gridCanvas.setPointerCapture(e.pointerId); } catch(err) {}
    beginChange();
    refDrag = { sx: e.clientX, sy: e.clientY, ox: state.refOff.x, oy: state.refOff.y };
    e.preventDefault();
    return;
  }
  /* Pencil 模式下手指只负责平移，顺带挡掉手掌误触 */
  if (e.pointerType === "touch" && penMode){
    startPan(e);
    return;
  }
  if (!canDraw()) return;
  var cell = cellAt(e);
  if (!cell) return;
  /* 橡皮 · 同色连片：整片一次擦掉（范围与「填充」一致） */
  if (state.tool === "eraser" && state.eraseMode === "region"){
    var rm = floodSameMask(cell.i);
    if (!rm){ toast("这里是空格子"); return; }
    var rv = state.grid[cell.i], rc = 0;
    beginChange();
    for (var rq = 0; rq < rm.length; rq++) if (rm[rq]){ state.grid[rq] = 0; rc++; }
    endChange();
    renderGrid(); updateStats(); updatePaletteMarks(); saveDraft();
    toast("已擦除 " + PALETTE[rv-1].id + " " + PALETTE[rv-1].n + " 连片 " + rc + " 格");
    e.preventDefault();
    return;
  }
  /* 移动：拖动整体搬动画布中的图案 */
  if (state.tool === "move"){
    try { gridCanvas.setPointerCapture(e.pointerId); } catch(err) {}
    beginChange();
    moving = { sx: cell.x, sy: cell.y, dx: 0, dy: 0 };
    shiftPrev = { dx: 0, dy: 0 };
    e.preventDefault();
    return;
  }
  try { gridCanvas.setPointerCapture(e.pointerId); } catch(err) {}
  beginChange();
  drawing = { last: -1 };
  if (state.tool === "rect" || state.tool === "ellipse" || state.tool === "line" ||
      (state.tool === "eraser" && state.eraseMode === "rect")){
    pending = { tool: (state.tool === "eraser" ? "eraser" : state.tool),
                x0: cell.x, y0: cell.y, x1: cell.x, y1: cell.y };
    renderGrid();
  } else {
    applyAt(cell, true);
    drawing.last = cell.i;
    renderGrid(); updateStats(); updatePaletteMarks();
  }
  e.preventDefault();
});

gridCanvas.addEventListener("pointermove", function(e){
  var cell = cellAt(e);
  setPos(cell ? ("列 " + (cell.x + 1) + " · 行 " + (cell.y + 1)) : "");
  /* 悬停高亮：只在换了格子时重绘，避免每次移动都全量渲染 */
  var hv = cell ? cell.i : -1;
  if (hv !== hoverCell){ hoverCell = hv; if (!drawing && !pending && !moving) renderGrid(); }

  if (refDrag){
    state.refOff.x = refDrag.ox + (e.clientX - refDrag.sx) / state.zoom;
    state.refOff.y = refDrag.oy + (e.clientY - refDrag.sy) / state.zoom;
    clampRefOff();      /* v122：拖到边界就停住，别拖出一片空白 */
    renderRef();
    setPos("底图偏移 " + Math.round(state.refOff.x) + " , " + Math.round(state.refOff.y));
    return;
  }
  if (pinch) return;                      /* 双指手势中，不画 */
  if (panning){
    panTick(e);
    return;
  }
  if (moving){
    if (cell){
      var mdx = cell.x - moving.sx, mdy = cell.y - moving.sy;
      if (mdx !== moving.dx || mdy !== moving.dy){
        moving.dx = mdx; moving.dy = mdy;
        shiftPrev = { dx: mdx, dy: mdy };
        renderGrid();
      }
      setPos("位移 " + (mdx > 0 ? "+" : "") + mdx + " · " + (mdy > 0 ? "+" : "") + mdy);
    }
    return;
  }
  if (!drawing) return;
  if (pending){
    if (cell){
      pending.x1 = cell.x; pending.y1 = cell.y;
    }
    renderGrid();
    return;
  }
  if (!cell) return;
  if (cell.i === drawing.last) return;
  applyAt(cell, false);
  drawing.last = cell.i;
  renderGrid(); updateStats(); updatePaletteMarks();
});

function endPointer(e){
  if (refDrag){
    refDrag = null;
    clampRefOff();
    endChange();
    renderRef();
    /* v122：拖动现在真的改变裁切区域，松手就按新位置重转，所见即所得。
       以前这里只 renderRef()，屏幕变了生成没变，用户拖半天白拖。 */
    imageToPattern();
    saveDraft();
    return;
  }
  if (panning){
    panning = null;
    resetCanvasCursor();
    if (snapshotBefore) endChange();
    return;
  }
  if (moving){
    var mdx = moving.dx, mdy = moving.dy;
    moving = null; shiftPrev = null;
    if (mdx || mdy){
      shiftGrid(mdx, mdy);
      toast("已移动 " + (mdx > 0 ? "右" : "左") + Math.abs(mdx) + " 格 · " + (mdy > 0 ? "下" : "上") + Math.abs(mdy) + " 格");
    }
    endChange();
    renderGrid(); updateStats(); updatePaletteMarks();
    saveDraft();
    return;
  }
  if (!drawing) return;
  if (pending && localRedo && pending.tool === "rect"){
    var rr = pending;
    pending = null; localRedo = false; drawing = null;
    endChange();                                  /* 关掉 pointerdown 开启的空 change */
    redoRegion(Math.min(rr.x0, rr.x1), Math.min(rr.y0, rr.y1),
               Math.max(rr.x0, rr.x1), Math.max(rr.y0, rr.y1));
    return;
  }
  if (pending){
    var pts = shapePoints(pending);
    var val = (pending.tool === "eraser") ? 0 : (state.colorIdx + 1);
    for (var i = 0; i < pts.length; i++){
      var idx = pts[i].y * state.cols + pts[i].x;
      state.grid[idx] = val;
    }
    pending = null;
  }
  drawing = null;
  endChange();
  renderGrid(); updateStats(); updatePaletteMarks();
  saveDraft();
}
gridCanvas.addEventListener("pointerup", endPointer);
gridCanvas.addEventListener("pointercancel", endPointer);
gridCanvas.addEventListener("pointerleave", function(){
  setPos("");
  if (hoverCell >= 0){ hoverCell = -1; renderGrid(); }
});
gridCanvas.addEventListener("contextmenu", function(e){ e.preventDefault(); });

/* 右键 = 橡皮 */
gridCanvas.addEventListener("mousedown", function(e){
  if (e.button === 2){
    if (!canDraw()) return;
    var cell = cellAt(e);
    if (cell && state.grid[cell.i] !== 0){
      beginChange(); state.grid[cell.i] = 0; endChange();
      renderGrid(); updateStats(); updatePaletteMarks(); touchThumb();
    }
  }
});

canvasScroll.addEventListener("wheel", function(e){
  if (e.ctrlKey || e.metaKey){
    e.preventDefault();

/* =========================================================
   色板
   ========================================================= */
function buildPalette(filter){
  var box = $("palBox"), html = "";
  var kw = (filter || "").trim().toLowerCase();
  for (var gi = 0; gi < GROUPS.length; gi++){
    var gname = GROUPS[gi], items = [];
    for (var i = 0; i < PALETTE.length; i++){
      var p = PALETTE[i];
      if (p.g !== gname) continue;
      if (kw && p.id.toLowerCase().indexOf(kw) < 0 && p.n.indexOf(kw) < 0 && p.g.indexOf(kw) < 0) continue;
      items.push(p);
    }
    if (!items.length) continue;
    var col = !!state.palCollapsed[gname];
    html += '<div class="pal-group-t' + (col ? " collapsed" : "") + '" data-g="' + gname + '">' +

function computeStats(){
  var counts = {}, total = 0;
  for (var i = 0; i < state.grid.length; i++){
    var v = state.grid[i];
    if (!v) continue;
    counts[v - 1] = (counts[v - 1] || 0) + 1;
    total++;
  }
  var arr = [];
  for (var key in counts){
    if (counts.hasOwnProperty(key)) arr.push({ idx: parseInt(key, 10), n: counts[key] });
  }
  arr.sort(function(a, b){ return b.n - a.n; });
  return { list: arr, total: total };
}

/* =========================================================
   v123：画板大小由底图算出来，而不是给几个固定档位
   —— 上一版的「简洁 52 / 标准 78 / 精细 104」换任何图都是这三个数，
      等于没推荐。这里把「长边多少格」变成一个由图片算出的值：

   1) 先看底图是不是像素画（精灵图 / 马赛克图）。这类图有天然格数，
      数一下横向同色游程的众数就是每格多少像素，1:1 转最还原。
   2) 否则做一条「多尺度还原误差曲线」：把图按 N 格降采样成 N 个色块，
      再铺回原尺寸，量它和原图的平均色差。N 越大误差越小，但收益递减。
      取「误差已经足够小」或「再加格数收益不到 30%」的那个 N。

   纯本地运算（积分图 + 隔点采样），不依赖任何模型 / 网络。
   ========================================================= */
var REC_LO = 28, REC_HI = 128, REC_STEP = 4;   /* 扫描的长边格数范围 */
var REC_WORK = 384;                            /* 误差曲线用的工作长边 */
var REC_SCAN = 1200;                           /* 数原生格数用的长边 */
var REC_ABS = 2.2;                             /* 平均色差低于此值 = 已经够还原 */
var REC_FRAC = 0.30;                           /* 收益不足最高收益的 30% 就停 */

/* 把底图画到离屏画布上取像素；nearest=true 时关闭平滑（数游程要靠硬边） */
function refWorkCanvas(img, cap, nearest){
  var w = img.naturalWidth || img.width || 1;
  var h = img.naturalHeight || img.height || 1;
  var k = Math.min(1, cap / Math.max(w, h));
  var W = Math.max(1, Math.round(w * k)), H = Math.max(1, Math.round(h * k));
  var cv = document.createElement("canvas"); cv.width = W; cv.height = H;
  var c = cv.getContext("2d", { willReadFrequently: true });
  if (nearest) c.imageSmoothingEnabled = false;
  c.fillStyle = "#FFFFFF"; c.fillRect(0, 0, W, H);  /* v153：透明 PNG 先铺白底，否则 alpha=0 的像素按 RGB(0,0,0) 读进来就是黑背景 */
  c.drawImage(img, 0, 0, W, H);
  return { d: c.getImageData(0, 0, W, H).data, W: W, H: H };
}
/* 三通道积分图：任取一个矩形都能 O(1) 求出面积和，用来算每一格的均值 */
function refIntegral(d, W, H){
  var W1 = W + 1, I = new Int32Array(W1 * (H + 1) * 3), x, y, p, i, up, left, ul;
  for (y = 0; y < H; y++){
    for (x = 0; x < W; x++){
      p = (y * W + x) * 4;
      i = ((y + 1) * W1 + (x + 1)) * 3;
      up = (y * W1 + (x + 1)) * 3; left = ((y + 1) * W1 + x) * 3; ul = (y * W1 + x) * 3;
      I[i]     = d[p]     + I[up]     + I[left]     - I[ul];
      I[i + 1] = d[p + 1] + I[up + 1] + I[left + 1] - I[ul + 1];
      I[i + 2] = d[p + 2] + I[up + 2] + I[left + 2] - I[ul + 2];
    }
  }
  return I;
}
/* N 格降采样后铺回原尺寸，与原图的平均色差（0-255）。隔点取样，误差 <2% */
function refGridMae(I, d, W, H, cols, rows){
  var W1 = W + 1, r, c, i, o, area, i00, i10, i01, i11;
  var yb = new Int32Array(rows + 1), xb = new Int32Array(cols + 1);
  for (i = 0; i <= rows; i++) yb[i] = Math.min(H, (i * H / rows) | 0);
  for (i = 0; i <= cols; i++) xb[i] = Math.min(W, (i * W / cols) | 0);
  var m = new Float64Array(rows * cols * 3);
  for (r = 0; r < rows; r++){
    var y0 = yb[r], y1 = Math.max(yb[r + 1], y0 + 1);
    for (c = 0; c < cols; c++){
      var x0 = xb[c], x1 = Math.max(xb[c + 1], x0 + 1);
      area = (y1 - y0) * (x1 - x0);
      i00 = (y0 * W1 + x0) * 3; i10 = (y0 * W1 + x1) * 3;
      i01 = (y1 * W1 + x0) * 3; i11 = (y1 * W1 + x1) * 3;
      o = (r * cols + c) * 3;
      m[o]     = (I[i11]     - I[i10]     - I[i01]     + I[i00])     / area;
      m[o + 1] = (I[i11 + 1] - I[i10 + 1] - I[i01 + 1] + I[i00 + 1]) / area;
      m[o + 2] = (I[i11 + 2] - I[i10 + 2] - I[i01 + 2] + I[i00 + 2]) / area;
    }
  }
  var sum = 0, cnt = 0, x, y, p, ry, ci;
  for (y = 0; y < H; y += 2){
    ry = Math.min(rows - 1, (y * rows / H) | 0);
    for (x = 0; x < W; x += 2){
      ci = Math.min(cols - 1, (x * cols / W) | 0);
      o = (ry * cols + ci) * 3; p = (y * W + x) * 4;
      sum += Math.abs(d[p] - m[o]) + Math.abs(d[p + 1] - m[o + 1]) + Math.abs(d[p + 2] - m[o + 2]);
      cnt += 3;
    }
  }
  return sum / Math.max(1, cnt);
}
/* 数底图的天然格数：横向同色游程的众数就是「一格多少像素」。
   照片 / 插画的游程基本都是 1~2 且不集中，会被 35% 的门槛挡掉。 */
function refNativeRun(d, W, H){
  var step = Math.max(1, (H / 160) | 0), half = W >> 1;
  var hist = {}, total = 0, best = 0, bv = 0, k;
  for (var y = 0; y < H; y += step){
    var base = y * W * 4, run = 1, x, p;
    for (x = 1; x < W; x++){
      p = base + x * 4;
      if (d[p] === d[p - 4] && d[p + 1] === d[p - 3] && d[p + 2] === d[p - 2]) run++;
      else { if (run <= half){ hist[run] = (hist[run] || 0) + 1; total++; } run = 1; }
    }
  }
  if (total < 200) return 0;
  for (k in hist){ if (hist[k] > bv){ bv = hist[k]; best = k | 0; } }
  if (best < 2 || bv < 0.35 * total) return 0;
  return best;
}
/* 主入口：返回 { long, cols, rows, note } */
function analyzeSize(img){
  var sar = ((img.naturalWidth || img.width) || 1) / ((img.naturalHeight || img.height) || 1);
  function dims(n){
    return sar >= 1 ? [n, Math.max(1, Math.round(n / sar))]
                    : [Math.max(1, Math.round(n * sar)), n];
  }
  function pack(n, kind, note){
    var t = dims(n);
    return { long: n, kind: kind, note: note,
             cols: clamp(t[0], 4, MAX_SIDE), rows: clamp(t[1], 4, MAX_SIDE) };
  }
  try{
    var sc = refWorkCanvas(img, REC_SCAN, true);
    var run = refNativeRun(sc.d, sc.W, sc.H);
    var wk = refWorkCanvas(img, REC_WORK, false);
    var I = refIntegral(wk.d, wk.W, wk.H), W = wk.W, H = wk.H, ar = W / H;
    function maeAt(n){
      var c = ar >= 1 ? n : Math.max(1, Math.round(n * ar));
      var r = ar >= 1 ? Math.max(1, Math.round(n / ar)) : n;
      return refGridMae(I, wk.d, W, H, c, r);
    }
    /* 像素画：直接 1:1，再在 ±15% 内挑误差最小的那个整数格数对齐 */
    if (run){
      var n0 = Math.max(sc.W, sc.H) / run;
      if (n0 >= 16 && n0 <= 180){
        var lo = Math.max(8, Math.round(n0 * 0.85)), hi = Math.min(200, Math.round(n0 * 1.15));
        var bn = lo, be = 1e9, n, e;
        for (n = lo; n <= hi; n++){ e = maeAt(n); if (e < be){ be = e; bn = n; } }
        return pack(bn, "pixel", "底图本身是像素画（每格约 " + run + "px），1:1 转最还原");
      }
    }
    /* 普通图：扫一条误差曲线，单调化后找拐点 */
    var cands = [], E = [], i;
    for (i = REC_LO; i <= REC_HI; i += REC_STEP) cands.push(i);
    for (i = 0; i < cands.length; i++) E.push(maeAt(cands[i]));
    for (i = 1; i < E.length; i++) if (E[i] > E[i - 1]) E[i] = E[i - 1];   /* 采样抖动不算数 */
    var tgt = E[E.length - 1] + REC_FRAC * Math.max(E[0] - E[E.length - 1], 1e-6);
    for (i = 0; i < cands.length; i++){

  for (y = 0; y < rows; y++){
    for (x = 0; x < cols; x++){

        if (x < minX) minX = x;
        if (x > maxX) maxX = x;
        if (y < minY) minY = y;
        if (y > maxY) maxY = y;

    var src = state.layers[li].grid, ng = new Array(nw * nh);
    for (y = 0; y < nh; y++)
      for (x = 0; x < nw; x++) ng[y*nw + x] = src[(y + minY)*cols + (x + minX)];
    state.layers[li].grid = ng;
  }
  state.cols = nw; state.rows = nh;

  if ($("inRW")) { $("inRW").value = nw; $("inRH").value = nh; }
  if (state.lockRatio) state.lockVal = clamp(nh / nw, 0.04, 25);

/* =========================================================

   —— 肤色域单独用会把暖调头发/背景一起染黄（实测发区命中 21%）；
      发丝、水珠、织物是高纹理，皮肤是平滑的，加纹理门槛后发区命中降到 0.0%。

    for (y = 0; y < h; y++){
      var o = y * w, s = 0;
      for (x = 0; x <= r && x < w; x++) s += from[o + x];
      for (x = 0; x < w; x++){
        tmp[o + x] = s / win;
        var add = x + r + 1, sub = x - r;
        if (add < w) s += from[o + add];
        if (sub >= 0) s -= from[o + sub];
      }
    }
    for (x = 0; x < w; x++){
      var s2 = 0;
      for (y = 0; y <= r && y < h; y++) s2 += tmp[y * w + x];
      for (y = 0; y < h; y++){

      var gy = (y + 1 < h) ? Math.abs(Yb[i + w] - Yb[i]) : 0;

      var a1 = acc[y1 * w + x1];
      var b1 = y0 ? acc[(y0 - 1) * w + x1] : 0;
      var c1 = x0 ? acc[y1 * w + (x0 - 1)] : 0;
      var d1 = (y0 && x0) ? acc[(y0 - 1) * w + (x0 - 1)] : 0;

    }

    while (sp > 0){
      var cur = stack[--sp]; sz++;

      if (cx2 > 0 && cells[cur - 1] && !seen[cur - 1]){ seen[cur - 1] = 1; curMark[cur - 1] = 1; stack[sp++] = cur - 1; }
      if (cx2 + 1 < cw && cells[cur + 1] && !seen[cur + 1]){ seen[cur + 1] = 1; curMark[cur + 1] = 1; stack[sp++] = cur + 1; }
      if (cy2 > 0 && cells[cur - cw] && !seen[cur - cw]){ seen[cur - cw] = 1; curMark[cur - cw] = 1; stack[sp++] = cur - cw; }
      if (cy2 + 1 < ch && cells[cur + cw] && !seen[cur + cw]){ seen[cur + cw] = 1; curMark[cur + cw] = 1; stack[sp++] = cur + cw; }
    }

  }

  if (bestSize){
    for (y = 0; y < h; y++){
      var by = (y / BS) | 0;
      for (x = 0; x < w; x++){

      }
    }

  /* 软边：盒模糊两轮，再乘回 1（块边界与孔洞被抹平） */
  var tmp = new Float32Array(n);

  for (i = 0; i < n; i++){ var mv = mask[i] * 4; mask[i] = mv > 1 ? 1 : mv; }

    var m2 = mask[i]; if (m2 <= 0.002) continue;
    var pr = d[i * 4], pg = d[i * 4 + 1], pb = d[i * 4 + 2];
    var wr = pr * 1.08 + 4, wg = pg * 1.01, wb = pb * 0.85;
    d[i * 4]     = clamp(Math.round(pr + (wr - pr) * m2), 0, 255);
    d[i * 4 + 1] = clamp(Math.round(pg + (wg - pg) * m2), 0, 255);
    d[i * 4 + 2] = clamp(Math.round(pb + (wb - pb) * m2), 0, 255);
  }
  c.putImageData(id, 0, 0);
  var out = new Image();
  out.onload = function(){ cb(out); };
  out.onerror = function(){ cb(src); };
  out.src = cv.toDataURL("image/jpeg", 0.95);
}

/* on=true 暖肤 / false 还原原图；切换后立刻按新底图重转 */
function applyWarm(on){

/* =========================================================

/* =========================================================

   双线性会产生锯齿。源区域可越界（留白模式），越界按白色补。
   ========================================================= */
function fitRect(iw, ih, cols, rows, mode, offx, offy){
  /* v122：offx/offy = 用户在画布上把底图拖走的量（state.refOff，单位＝未缩放画布像素）。
     以前这两个值压根没传进来 —— 拖完底图点「一键转图纸」，取样还是按画面正中裁，
     这就是「生成的不是我想要的那一部分」的根因。
     换算：画布上把图往右挪 offx 像素，等于取样窗在源图上往左挪 offx /(CELL·k) 像素。
     k 由 cols/rows 与图尺寸算出，所以无论源图预处理时缩放过多少都成立。 */
  var k, mx, my, ox, oy;
  if (mode === "cover"){
    k = Math.max(cols / iw, rows / ih);
    var wc = cols / k, hc = rows / k;
    mx = Math.max(0, (iw - wc) / 2); my = Math.max(0, (ih - hc) / 2);  /* 取样窗在图内还能挪多少 */
    ox = clamp((offx || 0) / (CELL * k), -mx, mx);
    oy = clamp((offy || 0) / (CELL * k), -my, my);

  var w = iw * k, h = ih * k;

  mx = Math.max(0, (cols - w) / 2 / k); my = Math.max(0, (rows - h) / 2 / k);
