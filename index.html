  if (rlLay > 60) rlLay = 28;                     /* 明显跑偏时退回经验值 */
  var est = W / T0 - (52 + 2 * rlLay) / 32;
  var cols = Math.round(est);
  if (Math.abs(est - cols) > 0.4) return null;    /* 周期不准的话格数就不会是整数 */
  if (cols < 4 || cols > MAX_SIDE) return null;
  var T = T0;                                     /* 格子是正方形，横竖同一个周期 */
  var rows = Math.max(1, Math.round((y1 - y0) / T));
  if (rows < 4 || rows > MAX_SIDE) return null;
  /* 双向校验：本工具的图横竖是同一套网格。随机照片/普通图很难同时满足
     「纵向也是这个周期」且「格线命中率够高」—— 这是拒绝无关图片的主要闸门。 */
  var rowE = edgeEnergy(gray, W, H, false, 0, 0, x0, x1);
  var rp = energyPeaks(rowE), Ty0i = guessPeriod(rowE, Math.max(5, Math.round(T * 0.6)), Math.round(T * 1.6));
  if (!Ty0i) return null;
  var Ty0 = polishPeriod(rowE, Ty0i);
  if (Math.abs(Ty0 - T) > Math.max(2, T * 0.35)) return null;
  var ry = refineCells(rp, y0, y1, Ty0);
  if (ry.score < 0.5) return null;
  if (Math.abs(ry.cells - rows) > Math.max(2, Math.round(rows * 0.12))) return null;
  /* 格线必须真的贯穿：随机照片/普通图很难让绝大多数候选线都贯穿整列整行 */
  if (lineCoverage(inkProfile(gray, W, H, false, y0, y1), x0, T, cols) < 0.5) return null;
  if (lineCoverage(inkProfile(gray, W, H, true, x0, x1), y0, T, rows) < 0.5) return null;

  /* v90：先从图例里取出「这张图真正用到的颜色」。
     图例卡片就是调色板的子集（26 色就是 26 张卡片），每格只在这十几种颜色里挑，
     比在整本 100+ 色的调色板里找精确得多 —— 相近色（G5/G8 之类）再也不会互相认错。 */
  var palSet = legendPalette(px, gray, W, H, T / 32, cols, rows, x0 / (T / 32), y0 / (T / 32), rlLay);

  /* 逐格取主色：格内 4×4 采样 + 量化众数，避开网格线与格内色号文字 */
  /* 采样点要随格子大小自适应：格子大时往里收避开格线，格子小时不能太靠边。
     固定 0.12 在 30 格缩略图（T≈20px）上正好压在格线上，会把整格认错。 */
  /* 采样 6×6：靠边的点躲开格线，靠内的点在「没印色号」的图上更准，
     最后按量化众数定色 —— 色号文字只占中间一小块，永远压不过边缘的票。 */
  var ins = Math.min(0.26, Math.max(3 / T, 0.13));
  var SAFE_PT = [ins, ins + 0.10, ins + 0.20, 1 - ins - 0.20, 1 - ins - 0.10, 1 - ins];
  var grid = new Array(cols * rows), cbuf = new Float32Array(cols * rows * 3);
  var cx, cy, si, sj, sx, sy, o, key, bucket, bestKey, bestN2;
  var sumR, sumG, sumB, cnt, rr2, gg2, bb2, white, filled = 0;
  for (cy = 0; cy < rows; cy++){
    for (cx = 0; cx < cols; cx++){
      bucket = {}; bestKey = -1; bestN2 = 0;
      for (si = 0; si < 6; si++){
        for (sj = 0; sj < 6; sj++){
          /* 采样点落在「安全带」：格线占 0~0.06，色号文字占 0.29~0.71，
             只在 0.12/0.22/0.78/0.88 取点才能拿到格子本来的颜色。 */
          sx = Math.round(x0 + (cx + SAFE_PT[si]) * T);
          sy = Math.round(y0 + (cy + SAFE_PT[sj]) * T);
          if (sx < 0 || sy < 0 || sx >= W || sy >= H) continue;
          o = (sy * W + sx) * 4;
          key = ((px[o] >> 4) << 8) | ((px[o+1] >> 4) << 4) | (px[o+2] >> 4);
          if (bucket[key] === undefined) bucket[key] = [0, 0, 0, 0];
          bucket[key][0]++; bucket[key][1] += px[o]; bucket[key][2] += px[o+1]; bucket[key][3] += px[o+2];
          if (bucket[key][0] > bestN2){ bestN2 = bucket[key][0]; bestKey = key; }
        }
      }
      if (bestKey < 0) continue;
      cnt = bucket[bestKey][0];
      cbuf[(cy * cols + cx) * 3]     = bucket[bestKey][1] / cnt;
      cbuf[(cy * cols + cx) * 3 + 1] = bucket[bestKey][2] / cnt;
      cbuf[(cy * cols + cx) * 3 + 2] = bucket[bestKey][3] / cnt;
    }
  }
  /* 定色号：空格底色是**纯白** (255,255,255)；白豆画的是 #FEFEFE —— 只差 1，
     肉眼看不出，但识别能分开。JPEG 会把这个差别糊掉（254/255 乱跳），
     那时白豆和空格确实无法区分，属于物理极限。 */
  var onPal = 0;
  var assign = function(idxs){
    var i, r2, g2, b2, pi, pc, dmin, v;
    onPal = 0; filled = 0;
    for (i = 0; i < grid.length; i++){
      r2 = cbuf[i*3]; g2 = cbuf[i*3+1]; b2 = cbuf[i*3+2];
      if (!r2 && !g2 && !b2){ grid[i] = 0; continue; }
      if (r2 > 254.5 && g2 > 254.5 && b2 > 254.5){ grid[i] = 0; continue; }   /* 纯白 = 空格 */
      pi = idxs ? nearestInIdxs(idxs, r2, g2, b2) : nearestPalIdx(r2, g2, b2);
      pc = palRgb(pi);
      dmin = (r2 - pc[0]) * (r2 - pc[0]) + (g2 - pc[1]) * (g2 - pc[1]) + (b2 - pc[2]) * (b2 - pc[2]);
      v = pi + 1;
      grid[i] = v;
      if (v){ filled++; if (dmin <= 900) onPal++; }      /* 900 ≈ 每通道差 17 */
    }
  };
  /* 两套都算，取更贴合的那套：图例取对了能修掉相近色混淆，
     图例取歪了（卡片位置算偏）反而更糟 —— 所以用「落色调色板的比例」来选。 */
  assign(null);
  var bFilled = filled, bOnPal = onPal, bGrid = grid.slice();
  var bRate = bFilled ? bOnPal / bFilled : 0;
  if (palSet && palSet.length >= 2){
    var set = palSet.slice(), far = [], i2, r3, g3, b3, pi2, pc2, d2;
    assign(set);
    /* 图例难免漏几张卡片（色号文字太淡）：把离图例色都远的格子按整本调色板认一次，
       把认出来的色号补进集合，缺的颜色就自己补上了 */
    for (i2 = 0; i2 < grid.length; i2++){
      r3 = cbuf[i2*3]; g3 = cbuf[i2*3+1]; b3 = cbuf[i2*3+2];
      if (!r3 && !g3 && !b3) continue;
      pi2 = nearestInIdxs(set, r3, g3, b3); pc2 = palRgb(pi2);
      d2 = (r3 - pc2[0]) * (r3 - pc2[0]) + (g3 - pc2[1]) * (g3 - pc2[1]) + (b3 - pc2[2]) * (b3 - pc2[2]);
      if (d2 > 400){
        var pj = nearestPalIdx(r3, g3, b3);
        if (far.indexOf(pj) < 0) far.push(pj);
      }
    }
    if (far.length) assign(set.concat(far));
    var sRate = filled ? onPal / filled : 0;
    if (sRate < bRate - 0.02){ grid = bGrid; filled = bFilled; onPal = bOnPal; }
  }
  if (!filled) return null;
  /* 别裁「全空的边」：图案居中时最外一圈本来就是空的，裁掉等于少一格，整张图就错位了。
     边界是否找对交给外扩的格线判据和「图宽/周期」校验去保证。 */
  /* 颜色闸门：本工具的图，每格都是调色板里的纯色（压缩后也只差几个色阶）。
     普通照片/随机图的颜色是连续的，绝大多数格子都落不到调色板上 —— 据此判不是我们的图纸。 */
  if (onPal / filled < 0.9) return null;
  return { cols: cols, rows: rows, grid: grid, filled: filled };
}
/* 识别结果落地：先安置当前内容（guardCurrent）再载入，与导入工程文件一致 */
function applyRecognized(res, name){
  var d = {
    cols: res.cols, rows: res.rows, ver: 2,
    layers: [{ n: "图纸层", k: "pattern", o: 100, v: 1, l: 0, r: rleEncode(res.grid) }],
    active: 0, sourceMode: "pixel"
  };
  guardCurrent(function(){
    applyDraftData(d);
    curDraftId = 0;
    renderAll(); renderLayerPanel(); updateStats && updateStats();
    updatePaletteMarks && updatePaletteMarks();
    centerCanvas(); saveDraft(); closeDraftBox();
    toast("已识别 " + res.cols + "×" + res.rows + "（" + res.filled + " 格）");
  });
}
/* 图片导入：先读内嵌数据，读不到再图像识别 */
function importImage(file){
  readArrayBuffer(file).then(function(ab){
    var raw = pngReadText(ab, PNG_KEY), text = raw ? b64ToUtf8(raw) : null;
    if (text && applyProjectText(text)) return;      /* 内嵌数据：精确还原 */
    var url = URL.createObjectURL(file), im = new Image();
    im.onload = function(){
      URL.revokeObjectURL(url);
      var res = recognizeImage(im);
      if (!res){ toast("这张图认不出来"); return; }
      applyRecognized(res, file.name || "");
    };
    im.onerror = function(){ URL.revokeObjectURL(url); toast("图片打不开"); };
    im.src = url;
  }).catch(function(){ toast("文件读不出来"); });
}

/* ---------- 草稿箱界面（DOM 动态创建，云端只需替换 style/script） ---------- */
function draftRelTime(t){
  var d = Date.now() - t, m = Math.round(d / 60000);
  if (m < 1) return "刚刚";
  if (m < 60) return m + " 分钟前";
  if (m < 1440) return Math.round(m / 60) + " 小时前";
  return Math.round(m / 1440) + " 天前";
}
function buildDraftBox(){
  var mask = document.createElement("div");
  mask.className = "modal-mask"; mask.id = "draftModal"; mask.hidden = true;
  mask.innerHTML =
    '<div class="draft-box">' +
      '<div class="draft-head">' +
        '<div class="m-t" id="draftTitle">草稿箱</div>' +
        '<button class="draft-x" id="draftClose"><svg class="ic" aria-hidden="true"><use href="#i-close"/></svg></button>' +
      '</div>' +
      '<div class="draft-grid" id="draftGrid"></div>' +
    '</div>';
  document.body.appendChild(mask);
  mask.addEventListener("click", function(e){ if (e.target === this) closeDraftBox(); });
  $("draftClose").addEventListener("click", closeDraftBox);
  return mask;
}
function renderDraftList(){
  var grid = $("draftGrid");
  if (!grid) return Promise.resolve();
  return draftAll().then(function(list){
    list.sort(function(a, b){ return (b.updatedAt || 0) - (a.updatedAt || 0); });
    grid.innerHTML = "";
    $("draftTitle").textContent = "草稿箱（" + list.length + "/" + MAX_DRAFTS + "）";
    /* v141：空态 —— 给个说法，别只剩一条滚动条 */
    if (!list.length){
      var em = document.createElement("div");
      em.className = "draft-empty";
      em.innerHTML = '<svg class="ic" aria-hidden="true"><use href="#i-folder"/></svg>' +
        '<div>还没有草稿<br>画完点顶栏「存草稿」，下次进来就能接着画</div>';
      grid.appendChild(em);
      return;
    }
    for (var i = 0; i < list.length; i++){
      (function(rec){
        var card = document.createElement("div");
        card.className = "draft-card" + (rec.id === curDraftId ? " cur" : "");
        card.innerHTML =
          '<img alt="" src="' + (rec.thumb || "") + '">' +
          '<div class="draft-meta"><span class="draft-name" data-id="' + rec.id + '"></span>' +
          '<span class="draft-time"></span></div>' +
          '<button class="draft-del"><svg class="ic" aria-hidden="true"><use href="#i-trash"/></svg></button>';
        card.querySelector(".draft-name").textContent = rec.name || "未命名";
        card.querySelector(".draft-time").textContent = draftRelTime(rec.updatedAt || Date.now()) + (rec.auto ? " · 自动保存" : "");
        card.addEventListener("click", function(){
          draftOpen(rec).then(function(){ closeDraftBox(); });
        });
        /* 双击改名（与图层名一致的操作语言） */
        card.querySelector(".draft-name").addEventListener("dblclick", function(e){
          e.stopPropagation();
          var el = this, old = el.textContent;
          el.contentEditable = "true"; el.focus();
          document.getSelection().selectAllChildren(el);
          function done(){
            el.contentEditable = "false";
            var v = (el.textContent || "").trim().slice(0, 20) || old;
            el.textContent = v;
            dbTx("readwrite", function(st){ return st.get(rec.id); });
            rec.name = v;
            dbTx("readwrite", function(st){ return st.put(rec); });
          }
          el.addEventListener("blur", done, { once: true });
          el.addEventListener("keydown", function(ev){
            if (ev.key === "Enter"){ ev.preventDefault(); el.blur(); }
            if (ev.key === "Escape"){ el.textContent = old; el.blur(); }
          });
        });
        card.querySelector(".draft-del").addEventListener("click", function(e){
          e.stopPropagation();
          if (this.dataset.armed === "1"){
            draftDel(rec.id).then(renderDraftList);
          } else {
            this.dataset.armed = "1"; this.classList.add("armed");
            setTimeout(function(){ var b = card.querySelector(".draft-del");
              if (b){ b.dataset.armed = "0"; b.classList.remove("armed"); } }, 2600);
          }
        });
        grid.appendChild(card);
      })(list[i]);
    }
  }).catch(function(){ grid.innerHTML = ""; });
}
function openDraftBox(){
  var mask = $("draftModal") || buildDraftBox();
  mask.hidden = false;
  renderDraftList();
}
function closeDraftBox(){ var m = $("draftModal"); if (m) m.hidden = true; }

/* v99：作者名 —— 顶栏信息组可点输入，记住上一次（与导出共用一份存储） */
var EXP_KEY = STORE_KEY + "-export";
/* v138：作者名默认 Ashen。
   只在「从没设置过」时才用默认值 —— 用户主动清空过（存的是空串）就保持空，
   不强行塞回来，想匿名的人还是能匿名。 */
var DEF_AUTHOR = "Ashen";
function readAuthor(){
  try {
    var raw = localStorage.getItem(EXP_KEY);
    if (raw === null) return DEF_AUTHOR;
    return (JSON.parse(raw).author || "").trim();
  } catch(e){ return DEF_AUTHOR; }
}
function saveAuthor(au){
  try { localStorage.setItem(EXP_KEY, JSON.stringify({ author: au })); } catch(e){}
}
/* v121：作者名控件 —— 原来只写在桌面分支里，平板上顶栏连「作者」都没有（改完图纸
   却没法署名，导出封面上的作者永远空着）。抽出来给两个形态共用一份实现。 */
function buildAuthorEl(){
  var au = document.createElement("span");
  au.className = "tb-author"; au.id = "tbAuthor";
    au.addEventListener("click", function(){
    if (au.isContentEditable) return;
    au.contentEditable = "true"; au.classList.remove("empty");
    au.textContent = au.getAttribute("data-v") || "";
    au.focus();
    var rg = document.createRange(); rg.selectNodeContents(au);
    var sel = window.getSelection(); sel.removeAllRanges(); sel.addRange(rg);
    function commit(){
      au.contentEditable = "false";
      var v = (au.textContent || "").trim().slice(0, 24);
      saveAuthor(v);
      au.setAttribute("data-v", v);
      au.textContent = v || "作者名";
      au.classList.toggle("empty", !v);
    }
    au.addEventListener("blur", commit, { once: true });
    au.addEventListener("keydown", function(ev){
      if (ev.key === "Enter"){ ev.preventDefault(); au.blur(); }
      if (ev.key === "Escape"){ au.textContent = au.getAttribute("data-v") || "作者名"; au.blur(); }
    });
  });
  var av = readAuthor();
  au.setAttribute("data-v", av);
  au.textContent = av || "作者名";
  au.classList.toggle("empty", !av);
  return au;
}

/* v121：右缘竖栏塞进缩放组后，矮横屏（1133×657 这类）会顶出屏幕底部 ——
   实测内容高度超出可用高度就切紧凑档 .pad-dense（按钮 44px、缩放行压薄）。
   ⚠ 不能用 getBoundingClientRect().height 判断：竖栏有 max-height，超出的部分
   被 overflow:visible 溢出到屏幕外，量出来的高度永远等于 max-height。用 scrollHeight。 */
function fitPadDock(){
  var d = $("padDockR");
  if (!d || d.hidden) return;
  d.classList.remove("pad-dense");
  var last = d.lastElementChild;
  if (!last) return;
  /* ⚠ 两个坑：① 竖栏有 max-height 且 overflow:visible，超出的部分是溢出到屏幕外而不是
     被裁掉，所以量 d 自己的高度永远等于 max-height，量不出溢出；② scrollHeight 对
     overflow:visible 的 flex 容器行为不一致。直接量最后一个子元素的底边最准。 */
  if (last.getBoundingClientRect().bottom > window.innerHeight - 14) d.classList.add("pad-dense");
}
/* v121：缩放组（− 百分比 + / 适应屏幕 / 1:1）搬进右缘竖栏底部。
   搬的是原节点而不是副本 —— 事件监听已经绑在这批节点上，appendChild 不会丢；
   桌面完全不执行这段，桌面顶栏/底部工具栏的布局零影响。 */
function moveZoomToPadDock(){
  if (!isTablet()) return;
  var dock = $("padDockR"), tb = document.querySelector(".stage-toolbar");
  if (!dock || !tb || $("padZoom")) return;
  var box = tb.querySelector(".zoom-box"), fit = $("btnFit"), z100 = $("btnZoom100");
  if (!box && !fit && !z100) return;
  var wrap = document.createElement("div");
  wrap.className = "pad-zoom"; wrap.id = "padZoom";
  if (box) wrap.appendChild(box);
  if (fit || z100){
    var row = document.createElement("div");
    row.className = "pad-zoom-row";
    if (fit){ fit.classList.add("pad-zfit"); fit.classList.remove("sm"); row.appendChild(fit); }
    if (z100){ z100.classList.add("pad-zfit"); z100.classList.remove("sm"); row.appendChild(z100); }
    wrap.appendChild(row);
  }
  dock.appendChild(wrap);
  fitPadDock();
}

function nameForNew(){
  var d = new Date();
  var pre = ("0" + (d.getMonth() + 1)).slice(-2) + ("0" + d.getDate()).slice(-2);   /* 0924 */
  return draftAll().then(function(list){
    var mx = 0, i, m;

    for (i = 0; i < list.length; i++){
      m = /^(\d{4})-(\d+)$/.exec(list[i].name || "");
      if (m && m[1] === pre) mx = Math.max(mx, parseInt(m[2], 10));

  }).catch(function(){ return pre + "-01"; });

   v188：把 PWA 窗口那条系统标题栏染成页面底色

   白得像贴了条膏药。theme-color 是唯一能改它的开关，只能运行时写 meta：
   云端同步只换 style/script，改 <head> 标记不会跟着走。
   ========================================================= */
function applyThemeColor(){
  try{
    var c = "";
    var b = getComputedStyle(document.body).backgroundColor;
    var h = getComputedStyle(document.documentElement).backgroundColor;
    function rgb(s){ var m = /rgba?\((\d+),\s*(\d+),\s*(\d+)(?:,\s*([\d.]+))?\)/.exec(s || ""); if (!m) return "";
      if (m[4] !== undefined && parseFloat(m[4]) === 0) return "";
      return "#" + [m[1],m[2],m[3]].map(function(v){ return ("0" + parseInt(v,10).toString(16)).slice(-2); }).join(""); }
    c = rgb(b) || rgb(h) || "#E9E9ED";
    var m = document.querySelector('meta[name="theme-color"]');
    if (!m){ m = document.createElement("meta"); m.setAttribute("name","theme-color"); document.head.appendChild(m); }
    m.setAttribute("content", c);
  }catch(e){}
}

      closeAllOverlays(); return;

/* v124：橡皮二级菜单原本按 eraser 按钮的 offsetLeft 定位。
   手机/分屏上工具条折行后橡皮常落在靠右列，菜单（触摸端实测 119px 宽）
   会捅出工具条右缘 → 整页可以横向拖动（390 视口实测溢出 30px）。
   这里把左偏移夹进包含块：只在会溢出时才移位，仍然紧贴按钮。
   （iPad 那份由 CSS `left:auto!important` 接管，优先级高于内联样式，不受影响。） */
function placeEraseMenu(){
  var wrap = $("segWrap");
  if (!wrap) return;
  var eb = document.querySelector('[data-tool="eraser"]');
  if (!eb) return;
  var host = wrap.offsetParent, hostW = host ? host.clientWidth : 0;
  var lf = eb.offsetLeft, wW = wrap.offsetWidth || 0;
  if (hostW > 0 && wW > 0 && lf + wW > hostW - 2) lf = Math.max(0, hostW - wW - 2);
  wrap.style.left = lf + "px";
}
function setTool(t){
  state.tool = t;
  var tools = $("tools").querySelectorAll(".tool");
  for (var i = 0; i < tools.length; i++){
    tools[i].classList.toggle("active", tools[i].getAttribute("data-tool") === t);
  }
  if (localRedo && t !== "rect") localRedo = false;
  resetCanvasCursor();
  /* 两份橡皮菜单都要跟着开合；桌面那份按 eraser 按钮位置定位，iPad 那份由 CSS 向左弹出 */
  var wrap = $("segWrap");
  if (wrap){
    placeEraseMenu();
    wrap.classList.toggle("open", t === "eraser");
  }
  if ($("segWrapPad")) $("segWrapPad").classList.toggle("open", t === "eraser");
  /* 规范①：选工具就收起所有浮层（橡皮的二级菜单属于当前工具，上面刚打开，保留） */
  if (openDrawer) setDrawer(null);
  closeLayerPanel();
  /* 右缘操作条上移动/去背景副本的选中态 */
  var ptl = document.querySelectorAll("#padDockR [data-ptool]");
  for (var pj = 0; pj < ptl.length; pj++){
    ptl[pj].classList.toggle("active", ptl[pj].getAttribute("data-ptool") === t);
  }
}

  })();
  updateLockUI();
  installClearTool();            /* v100：云端「去背景」按钮改造为「清空」（须在 bindUI 前） */
  bindUI();
  updateRefUI();
  setColor(state.colorIdx);
  setTool("pencil");
  renderAll();
  renderLayerPanel();
  fitZoom();
  installDraftButton();          /* v80：草稿箱入口（仅平板；桌面由 installToolbar 装「草稿箱」） */
  installToolbar();              /* v96/v98：顶栏信息/动作分组，桌面缩放组下沉工具栏 */
  applyThemeColor();             /* v188：系统标题栏染成页面底色，去掉顶部那条白条 */
  updateStats();                 /* v187：hd-block 副标的尺寸/色数/豆数要等 span 建好后才填得上（boot 里 renderAll 在 installToolbar 之前） */
  if (!projName) applyProjName(nameSync());   /* v202：先把标题填上，不等草稿箱 */
  installProjName();             /* v97：顶栏中央的图纸名 */

  bindSessionSave();             /* v93：切后台 / 关页面 → 归档进草稿箱 */

/* =========================================================
   v133：刷新 ≠ 丢图
   关闭/刷新前进度会自动归档进草稿箱（bindSessionSave），但 v93 刻意不自动载入
   —— 结果用户刷新后看到空白画布，第一反应是「我的图没了」，还得自己去草稿箱翻。
   v139：不再弹窗问「要不要恢复」—— 弹窗打断人，很烦。
   数据反正已经在草稿箱里躺着，安静说一句就够，要用的人自己去草稿箱点开。
   画布上有内容时一个字都不说。
   ========================================================= */
function offerSessionRestore(){
  if (typeof hasContent !== "function") return;
  setTimeout(function(){
    if (hasContent()) return;
    draftAll().then(function(list){
      list = list || [];
      var best = null, i;
      for (i = 0; i < list.length; i++){
        if (!list[i].auto) continue;
        if (!best || (list[i].updatedAt || 0) > (best.updatedAt || 0)) best = list[i];
      }
      if (!best) return;
      var when = "";
      try{ when = draftRelTime(best.updatedAt); }catch(e){}
      toast("上次没画完的「" + (best.name || "未命名图纸") + "」已存草稿箱" +
            (when ? "（" + when + "）" : "") + "，点「草稿箱」找回");
    }).catch(function(){});
  }, 1200);
}
/* v141：存到 macOS 程序坞（Safari「添加到程序坞」＝ standalone PWA）打开时，
   窗口没有标题栏，系统红绿灯直接浮在内容左上角、会盖住 UI。
   检测到就给 html 挂 .standalone，CSS 里把骨架往下让一个标题栏高度。
   双保险：matchMedia 不认识的旧浏览器再测 navigator.standalone（iOS 用）。
   v146：iPad / iPhone 加到主屏幕也算 standalone，但它们的顶栏已经写了
   `padding:calc(4px + env(safe-area-inset-top))`，状态栏避让是自带的 ——
   再叠这 28px 会在顶部空出一大条。所以 iOS 系一律不加这个类。 */
(function(){
  var sa = false;
  try{ sa = !!(window.matchMedia && matchMedia("(display-mode: standalone)").matches); }catch(e){}
  if (!sa){ try{ sa = window.navigator.standalone === true; }catch(e){} }
  if (!sa) return;
  var ua = "";
  try{ ua = navigator.userAgent || ""; }catch(e){}
  var ios = /iPad|iPhone|iPod/.test(ua);
  if (!ios){
    try{ ios = (navigator.platform === "MacIntel") && navigator.maxTouchPoints > 1; }catch(e){}
  }
  if (!ios) document.documentElement.classList.add("standalone");
})();
init();

})();
</script>
<script>
(function(){
  function applyBgSkin(name){
    document.documentElement.setAttribute("data-bg", name);
    var row = document.getElementById("bgSkinRow");
    if (row) Array.prototype.forEach.call(row.querySelectorAll(".bgd"), function(b){
      b.classList.toggle("on", b.getAttribute("data-skin") === name);
    });
    try{ localStorage.setItem("beadBgSkin", name); }catch(e){}
  }
  var row = document.getElementById("bgSkinRow");
  if (row){
    var saved = "warm";
    try{ saved = localStorage.getItem("beadBgSkin") || "warm"; }catch(e){}
    applyBgSkin(saved);
    row.addEventListener("click", function(e){
      var b = e.target.closest ? e.target.closest("[data-skin]") : null;
      if (b) applyBgSkin(b.getAttribute("data-skin"));
    });
  }
})();
</script>
</body>
</html>
