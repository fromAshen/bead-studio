      var bi = -1, bj = -1, bd4 = Infinity;
      for (j = 0; j < m; j++){
        for (k = j + 1; k < m; k++){
          var q1 = pl2[S[j]], q2 = pl2[S[k]];
          var dd2 = de2000(q1[0], q1[1], q1[2], q2[0], q2[1], q2[2]);
          if (dd2 < bd4){ bd4 = dd2; bi = j; bj = k; }
        }
      }
      if (bi < 0 || bd4 >= mergeThr) break;
      var keep = cnt[bi] >= cnt[bj] ? bi : bj, drop = keep === bi ? bj : bi;
      S.splice(drop, 1); m--;
      /* 重新分配 */
      cnt = new Int32Array(m);
      for (i = 0; i < n; i++){
        var l4 = lab[i * 3], a4 = lab[i * 3 + 1], b4 = lab[i * 3 + 2], o4 = i * m;
        var bd5 = Infinity, bst5 = 0;
        for (j = 0; j < m; j++){
          var p4 = pl2[S[j]];
          var e4 = de2000(l4, a4, b4, p4[0], p4[1], p4[2]);
          if (e4 * e4 < bd5){ bd5 = e4 * e4; bst5 = j; }
        }
        a2[i] = bst5; cnt[bst5]++;
      }
    }
    var newS = [], seen2 = {};
    for (k = 0; k < m; k++){
      var sr = 0, sg = 0, sb = 0, c = 0;
      for (i = 0; i < n; i++){
        if (a2[i] === k){ sr += lab[i * 3]; sg += lab[i * 3 + 1]; sb += lab[i * 3 + 2]; c++; }
      }
      if (!c) continue;
      var id2 = snapCenter(sr / c * W0, sg / c * W1, sb / c * W2);
      if (!seen2[id2]){ seen2[id2] = 1; newS.push(id2); }
    }
    if (!newS.length) break;
    if (newS.length === S.length && newS.every(function(v, ix){ return v === S[ix]; })){ S = newS; break; }
    S = newS;
  }
  return S;
}

/* =========================================================
   转图纸主流程
   ========================================================= */
/* 抽样各格颜色（转图纸的前 4 步）：全图转换与局部细化共用，避免两份管线。
   返回未锐化的 cells（锐化强度两种场景不同，由调用方决定） */
function computeCells(cols, rows){
  if (!state.refImage) return null;

  /* 1. 源图限幅绘制到 ≤1024（太大没有额外信息，只拖慢速度） */
  var iw = state.refImage.naturalWidth || state.refImage.width;
  var ih = state.refImage.naturalHeight || state.refImage.height;
  var sc = Math.min(1, 1024 / Math.max(iw, ih));
  var cw = Math.max(1, Math.round(iw * sc)), chh = Math.max(1, Math.round(ih * sc));
  var cv = document.createElement("canvas");
  cv.width = cw; cv.height = chh;
  var cx = cv.getContext("2d");
  cx.imageSmoothingEnabled = true; cx.imageSmoothingQuality = "high";
  /* v153：透明 PNG 转出来背景全黑 —— canvas 默认透明，alpha=0 的像素 RGB 是 (0,0,0)，
     getImageData 一读，整片透明背景就成了纯黑。先铺白底再画图：透明背景 = 白色格子
     （不想要背景的话，把白色标「不要」再精简即可）。参考图层里仍按棋盘格显示透明。 */
  cx.fillStyle = "#FFFFFF"; cx.fillRect(0, 0, cw, chh);
  cx.drawImage(state.refImage, 0, 0, cw, chh);
  var d;
  try { d = cx.getImageData(0, 0, cw, chh).data; }
  catch(err){ toast("无法读取图片像素（跨域限制）"); return null; }

  /* 2. 转换风格（用户指定） */
  var kind = state.sourceMode;

  /* 3. 增强：照片做曝光归一化 + 提饱和；像素画保持原色（平涂色本身就该原样映射） */
  if (kind === "photo") enhanceData(d, cw * chh, autoSat(d, cw * chh));

  /* 4. 适配 + 面积平均超采样 */
  /* v122：把底图拖动量一起传进去 —— 拖到哪儿，生成的就是哪儿 */
  var r = fitRect(cw, chh, cols, rows, state.refFit, state.refOff.x, state.refOff.y);
  var SS = Math.max(2, Math.min(8, Math.floor(1024 / Math.max(cols, rows))));
  var sup = resampleBox(d, cw, chh, r[0], r[1], r[2], r[3], cols * SS, rows * SS);
  var st = cellStats(sup, cols, rows, SS);
  var n = cols * rows, i;
  var cells = (kind === "pixel") ? st.mode : st.mean;
  /* ⚠ 照片别改取色方式（v111 实测）：试过「按格内块面对比向主导色偏」与「用暗部细节色」，
     两张测试图上色差都变差（4.17→4.35、4.48→5.18），眼睛这类小特征反而被改成孤立暗点。
     面积平均对连续色调就是最优解；细节交给「色数 + 抖动 + 自适应锐化」去承担。 */
  /* 像素画：还原细描边（众数取色会丢掉占格 <50% 的轮廓线）。
     迟滞连接：强描边格（占比≥0.14）作种子，与其相邻的弱描边格（≥0.06）
     跟随还原，迭代 3 轮 —— 否则轮廓会一段一段断开 */
  if (kind === "pixel"){
    var promoted = new Uint8Array(n);
    for (i = 0; i < n; i++) if (st.lineShare[i] >= 0.14) promoted[i] = 1;
    for (var pass = 0; pass < 3; pass++){
      var grown = [];
      for (var yy = 0; yy < rows; yy++){
        for (var xx = 0; xx < cols; xx++){
          var mi = yy * cols + xx;
          if (promoted[mi] || st.lineShare[mi] < 0.06) continue;
          if ((xx > 0 && promoted[mi - 1]) || (xx < cols - 1 && promoted[mi + 1]) ||
              (yy > 0 && promoted[mi - cols]) || (yy < rows - 1 && promoted[mi + cols])) grown.push(mi);
        }
      }
      if (!grown.length) break;
      for (i = 0; i < grown.length; i++) promoted[grown[i]] = 1;
    }
    /* 骨架化：把多格宽的描边细化为 1 格宽（Zhang-Suen）。
       该算法保证不删除端点、不切断线条、不产生空洞 —— 形状不变，只变细 */
    (function thin(){
      var m = promoted, del = [], changed = true, k, y, x, i2;
      while (changed){
        changed = false; del.length = 0;
        for (y = 1; y < rows - 1; y++){
          for (x = 1; x < cols - 1; x++){
            i2 = y * cols + x;
            if (!m[i2]) continue;
            var p0 = m[i2 - cols] ? 1 : 0,        p1 = m[i2 - cols + 1] ? 1 : 0,
                p2 = m[i2 + 1] ? 1 : 0,           p3 = m[i2 + cols + 1] ? 1 : 0,
                p4 = m[i2 + cols] ? 1 : 0,        p5 = m[i2 + cols - 1] ? 1 : 0,
                p6 = m[i2 - 1] ? 1 : 0,           p7 = m[i2 - cols - 1] ? 1 : 0;
            var B = p0 + p1 + p2 + p3 + p4 + p5 + p6 + p7;
            if (B < 2 || B > 6) continue;
            var A = (p7 === 0 && p0 === 1) + (p0 === 0 && p1 === 1) + (p1 === 0 && p2 === 1) +
                    (p2 === 0 && p3 === 1) + (p3 === 0 && p4 === 1) + (p4 === 0 && p5 === 1) +
                    (p5 === 0 && p6 === 1) + (p6 === 0 && p7 === 1);
            if (A !== 1) continue;
            if (p0 * p2 * p4 !== 0 || p2 * p4 * p6 !== 0) continue;
            del.push(i2);
          }
        }
        if (del.length){ changed = true; for (k = 0; k < del.length; k++) m[del[k]] = 0; }
      }
    })();
    for (i = 0; i < n; i++){
      if (promoted[i]){
        cells[i * 3] = st.line[i * 3]; cells[i * 3 + 1] = st.line[i * 3 + 1]; cells[i * 3 + 2] = st.line[i * 3 + 2];
      }
    }
  }
  return { cells: cells, st: st, rect: r, cw: cw, chh: chh, n: n };
}
function cellsToLab(cells, n){
  var lab = new Float64Array(n * 3);
  for (var i = 0; i < n; i++){
    var L3 = rgb2lab(cells[i * 3], cells[i * 3 + 1], cells[i * 3 + 2]);
    lab[i * 3] = L3[0]; lab[i * 3 + 1] = L3[1]; lab[i * 3 + 2] = L3[2];
  }
  return lab;
}
/* v147：暗部色相守卫 —— MARD 暗区（L<50）只有栗色/暗红棕（F11 #5A2121、G8 #753832
   这类 a≈26 的豆），缺少暗琥珀棕。暖调阴影（腹影、颈影、暗调肤色）会被最近豆规则
   吸进栗色家族，整片阴影色相被转红 15~20°，实物上就是「红色的暗部很奇怪」。
   实测 104×154 暗调人像：F10/G7/G20 这些色相正确的豆在候选色板里是 0 颗。
   这里只做窄域修正：高饱和(chroma>20)暗豆(L<50) × 暖色相格(格 chroma>8) 且
   色相差 >15° 才重挑；重挑时色相优先（≤22° 内）、亮度限制在格 ±8/+16 内、
   候选豆自身 chroma≥8（不许塌到灰黑）。半中性影调豆（M12/G17，chroma 13~18）
   与冷色区完全不动 —— 它们承担的灰色阴影是设计内的。 */
function hueGuard(codes, cols, rows, lab){
  var n = cols * rows, pl = palLab(), i, j;
  for (i = 0; i < n; i++){
    var v = codes[i]; if (!v) continue;
    var p = pl[v];
    var bc = Math.hypot(p[1], p[2]);
    if (bc <= 20 || p[0] >= 50) continue;          /* 只管高饱和暗豆（栗色家族） */
    var l = lab[i * 3], a = lab[i * 3 + 1], b = lab[i * 3 + 2];
    var cc = Math.hypot(a, b);
    if (cc <= 8) continue;                          /* 格子本身低饱和：灰影不动 */
    var ch = Math.atan2(b, a) * 180 / Math.PI; if (ch < 0) ch += 360;
    var bh = Math.atan2(p[2], p[1]) * 180 / Math.PI; if (bh < 0) bh += 360;
    var hd = Math.abs(bh - ch); if (hd > 180) hd = 360 - hd;
    if (hd <= 15) continue;
    var best = -1, bs = 1e9;
    for (j = 0; j < pl.length; j++){
      var q = pl[j];
      var qc = Math.hypot(q[1], q[2]);
      if (qc < 8) continue;                         /* 不许塌到灰/黑 */
      var qh = Math.atan2(q[2], q[1]) * 180 / Math.PI; if (qh < 0) qh += 360;
      var qhd = Math.abs(qh - ch); if (qhd > 180) qhd = 360 - qhd;
      if (qhd > 22) continue;                       /* 新豆色相必须贴住格子 */
      if (q[0] < l - 8 || q[0] > l + 16) continue;  /* 亮度不许跳档 */
      var dq = (q[0] - l) * (q[0] - l) + (q[1] - a) * (q[1] - a) + (q[2] - b) * (q[2] - b)
               + Math.max(0, qhd - 8);
      if (dq < bs){ bs = dq; best = j; }
    }
    if (best >= 0 && best !== v) codes[i] = best;
  }
  return codes;
}

function imageToPattern(skipChange){
  var cols = state.cols, rows = state.rows;
  if (!state.refImage){ toast("请先上传图片"); return; }
  clampRefOff();   /* v122：画板尺寸/适配方式可能刚变过，先把拖动量夹回合法范围再取样 */
  var t0 = Date.now();
  var cc = computeCells(cols, rows);
  if (!cc) return;
  var st = cc.st, r = cc.rect, cw = cc.cw, chh = cc.chh, n = cc.n, i;
  var cells = cc.cells, kind = state.sourceMode;
  var rawCells = cells;                     /* 锐化前的原色，供转换后诊断用 */
  /* 照片：轻度自适应锐化（细节区 0.7 / 平色区 0.3）。
     对标实测：锐化强度与「过冲格」几乎线性相关 —— 2.2 会让 6.5% 的格子
     严重偏离原图（格间对比冲到原图的 2 倍），正是脸颊斑驳的根源。
     细节改由「更多色号」承担（K 48→96），既准又不脏。
     dmap 后面还要驱动自适应平滑，这里只算一次 */
  var dmap = null;
  if (kind === "photo"){
    dmap = detailMap(cells, cols, rows);
    cells = cellUnsharpAdaptive(cells, cols, rows, 0.3, 0.7, dmap);
  }
  var lab = cellsToLab(cells, n);

  /* 5. 选豆 & 分配 */
  if (!skipChange) beginChange();
  var codes = new Int32Array(n);
  if (kind === "pixel"){
    /* 像素画：逐格直映全色板（零归纳、零混色），只做轻度平滑去噪点。
       平滑候选集限定为「初分配实际用到的豆」，既快又不会把色块改成无关色 */
    var Dp = buildD(lab, AUTO_IDX);
    var ap = argminD(Dp, n, AUTO_IDX.length);
    var used = {}, S = [];
    for (i = 0; i < n; i++) if (!used[ap[i]]){ used[ap[i]] = 1; S.push(AUTO_IDX[ap[i]]); }
    S.sort(function(a, b){ return a - b; });
    var Ds = buildD(lab, S);
    var asg = argminD(Ds, n, S.length);
    if (state.smooth > 0) asg = icmSmooth(Ds, cols, rows, state.smooth, 2);
    for (i = 0; i < n; i++) codes[i] = S[asg[i]];
  } else {
    /* 照片走「写实还原」路线：96 色候选 + 轻锐化 + 弱平滑 + 保守清理。
       对标满意样张（102×102 / 35 色）后调整：色数放开才能留住肤色层次
       与唇色、眼周这类点缀色，实测用色 26→31、平均色差 7.59→6.21 */
    var S2 = selectPalette(lab, autoPaletteK(cols, rows, lab), 2);
    var D2 = buildD(lab, S2);
    var a2;
    if (state.dither){
      /* v113：全局强度给足，再由逐格权重决定「用在哪」—— 渐变区抖出颗粒过渡，平涂与轮廓不抖 */
      a2 = fsDither(lab, S2, cols, rows, autoDitherAmt(lab, cols, rows) / 100,
                    ditherWeights(lab, cols, rows, D2, S2.length, argminD(D2, n, S2.length)));
    } else {
      a2 = argminD(D2, n, S2.length);
      /* 自适应平滑：平色区 lam=14 压掉渐变区的交替杂色（脸颊不脏），
         细节区 lam=3 保留明暗交界处的立体粒子 */
      var lamMap = null;
      if (dmap){
        lamMap = new Float64Array(n);
        for (var li = 0; li < n; li++) lamMap[li] = 14 - 11 * dmap[li];
      }
      a2 = icmSmooth(D2, cols, rows, 4, 2, lamMap);
    }
    for (i = 0; i < n; i++) codes[i] = S2[a2[i]];
    if (!state.dither){
      codes = despeckle(codes, cols, rows, 10, 2, lab);
      codes = fragClean(codes, cols, rows, 8, 4, 2, lab);
    }
    codes = hueGuard(codes, cols, rows, lab);   /* v147：暗部色相守卫（栗色家族矫正） */
  }
  /* 生成结果只写进「图纸层」，手绘层一个都不碰 */
  var PL = patternLayer();
  if (PL.grid.length !== n) PL.grid = makeGrid(cols, rows, false);
  var pg = PL.grid;
  for (i = 0; i < n; i++) pg[i] = codes[i] + 1;
  /* 底图没盖到的格子保持空（透明），不填豆 */
  for (var my = 0; my < rows; my++){
    var syc = r[1] + (my + 0.5) * (r[3] - r[1]) / rows;
    for (var mx2 = 0; mx2 < cols; mx2++){
      if (syc < 0 || syc >= chh){ pg[my * cols + mx2] = 0; continue; }
      var sxc = r[0] + (mx2 + 0.5) * (r[2] - r[0]) / cols;
      if (sxc < 0 || sxc >= cw) pg[my * cols + mx2] = 0;
    }
  }
  PL.visible = true;
  markLayerDirty(PL);
  syncActiveGrid();
  if (!skipChange) endChange();
  lastDiag = diagnose(rawCells, codes, cols, rows, kind, r);
  finishConvert(cols, rows, kind, Date.now() - t0);
}

/* 转换诊断：告诉用户这张图「差在哪、该调什么」，而不是让他自己猜参数。
   三项独立判断：① 色域是否被 MARD 色板覆盖（决定要不要抖动）
   ② 每格合并了多少源像素（决定尺寸够不够）③ 平涂占比（决定风格选对没） */
function diagnose(raw, codes, cols, rows, kind, rect){
  var n = cols * rows, i, tips = [];
  var pl = palLab();
  /* ① 色板覆盖：找不到接近色的格子占比 */
  var bad = 0, sumDE = 0;
  for (i = 0; i < n; i++){
    var L3 = rgb2lab(raw[i * 3], raw[i * 3 + 1], raw[i * 3 + 2]);
    var d = de2000(L3[0], L3[1], L3[2], pl[codes[i]][0], pl[codes[i]][1], pl[codes[i]][2]);
    sumDE += d;
    if (d > 8) bad++;
  }
  var badShare = bad / n;
  /* 阈值 0.40：实测低于此值时开启抖动的收益不到 25%，不值得牺牲颗粒感 */
  if (!state.dither && badShare > 0.40)
    tips.push("颜色 " + Math.round(badShare * 100) + "% 找不到接近的豆色 —— 建议开启「抖动」，用相邻格错落混出中间色（远看颜色会准很多）");
  /* ② 尺寸：每格合并的源像素数（越多=细节被平均掉得越狠） */
  var spc = (rect && rect[2] > rect[0] && rect[3] > rect[1])
            ? (rect[2] - rect[0]) * (rect[3] - rect[1]) / n : 0;
  if (spc > 40){
    var want = Math.max(cols + 16, Math.round(cols * Math.sqrt(spc / 30) / 4) * 4);
    want = clamp(want, cols + 16, MAX_SIDE);
    tips.push(spc > 60
      ? "每格合并了约 " + Math.round(spc) + " 个像素，细节全被平均掉了 —— 尺寸建议加到 " + want + " 格" +
        (want >= MAX_SIDE ? "（已接近上限，可先裁出主体再转）" : "")
      : "还有细节没放下 —— 尺寸加到 " + want + " 格会更清晰");
  }
  /* ③ 风格：平涂占比（相邻格同色的比例） */
  var same = 0, pairs = 0;
  for (var y = 0; y < rows; y++){
    for (var x = 0; x < cols; x++){
      var v = codes[y * cols + x];
      if (x + 1 < cols){ pairs++; if (codes[y * cols + x + 1] === v) same++; }
      if (y + 1 < rows){ pairs++; if (codes[(y + 1) * cols + x] === v) same++; }
    }
  }
  var flat = pairs ? same / pairs : 0;
  var nc = {}, ncol = 0;
  for (i = 0; i < n; i++) if (!nc[codes[i]]){ nc[codes[i]] = 1; ncol++; }
  /* 平涂 + 用色少 = 像素画特征；单纯「暗部大片同色」不算（那是逆光照片） */
  if (kind === "photo" && flat > 0.78 && ncol <= 14)
    tips.push("这张图 " + Math.round(flat * 100) + "% 是平涂色块、只用 " + ncol + " 色 —— 换「像素画」风格会更干净利落");
  if (kind === "pixel" && flat < 0.32)
    tips.push("这张图是连续色调、几乎没有平涂区 —— 换「照片」风格层次会好很多");
  return { tips: tips, badShare: badShare, spc: spc, flat: flat, dE: sumDE / n };
}
function finishConvert(cols, rows, kind, ms){
  state.showCodes = true;
  $("chkCodes").checked = true;
  renderAll();
  renderLayerPanel();
  /* v119：转完图纸一律回到「完整可见 + 居中」。
     这里原来只在每格 <15px 时把缩放拉到 1:1：它既不复位滚动位置，
     在 iPad 上还会把 104 格这类大图纸整个顶出可视区 —— 于是每次转完
     都得手动点「适应屏幕」才能找回来。
     现在先 fitZoom（含居中）；桌面视口大，适应后每格仍 <15px 才补 1:1 并居中，
     平板一律保持完整可见。 */
  fitZoom();
  if (cellPx() < 15 && !isTabletLayout()){ setZoom(1, false); centerCanvas(); }
  toast("已按" + (kind === "photo" ? "照片" : "像素画") + "生成到图纸层 · " + ms + "ms");
}

/* =========================================================
   导入导出
   ========================================================= */
/* ---------- 图纸排版：只算坐标，不碰 canvas ----------
   v125：把排版从 exportPNG 里抽出来，是为了让「分片渲染」能复用同一份坐标 ——
   高清导出要把一张图切成几十块分别画，每块都必须按同一套坐标落笔，否则块与块之间会错行。 */
function sheetLayout(st){
  var legend = st.list;
  var EX = 32;                                  // 导出单元格尺寸（保证格内色号清晰）
  var pad = 26;
  var rt = state.showRulers ? RULER_TOP + GAP : 0;   // 上
  var rb = state.showRulers ? RULER_TOP + GAP : 0;   // 下
  var rl = state.showRulers ? RULER_LEFT + GAP : 0;  // 左
  var rr = state.showRulers ? RULER_LEFT + GAP : 0;  // 右
  var drawW = state.cols * EX;
  var W = drawW + pad * 2 + rl + rr;
  /* v126：信息字号与图例随图纸宽度**严格等比**缩放。
     以前 infoFs 封顶 46px —— 200 格的图纸宽 6400+，46px 只占 0.7%，
     小图（52 格）看着正常，大图就缩成蚂蚁字。现在去掉软封顶（只在超大图纸上留硬上限），
     并把图例卡片、间距、字号全部挂到同一个比例系数 lgK 上，上下两条信息带按比例放大。
     注意：只放大「带子」，格子尺寸 EX 与导出分辨率一概不动。 */
  var infoFs = clamp(Math.round(W * 0.016), 26, 132);
  var lgK = infoFs / 24;
  var itemW = Math.round(78 * lgK), itemH = Math.round(54 * lgK);
  var gapX = Math.round(12 * lgK), gapY = Math.round(14 * lgK);
  var perRow = Math.max(1, Math.floor((drawW + gapX) / (itemW + gapX)));
  var legendRows = legend.length ? Math.ceil(legend.length / perRow) : 0;
  var legendH = legend.length ? legendRows * (itemH + gapY) : 0;
  var infoH = Math.round(infoFs * 2.7);
  var H = pad + infoH + rt + state.rows * EX + rb + pad + legendH;
  return { EX:EX, pad:pad, rt:rt, rb:rb, rl:rl, rr:rr, drawW:drawW, W:W, H:H,
           infoFs:infoFs, lgK:lgK, itemW:itemW, itemH:itemH, gapX:gapX, gapY:gapY,
           perRow:perRow, legendH:legendH, infoH:infoH, ox:pad + rl, oy:pad + infoH + rt,
           legend:legend, st:st };
}

/* ---------- 把整张图纸画到任意 context ----------
   cl = 逻辑坐标下的裁剪框 {x0,y0,x1,y1}，只画与它相交的部分（分片渲染靠这个省掉 90% 的重复绘制）；
   不传就是画全图。调用前由调用方设好 transform（缩放 + 平移）。 */
function drawSheet(c, L, au, cl){
  var EX = L.EX, pad = L.pad, W = L.W, H = L.H, ox = L.ox, oy = L.oy;
  var st = L.st, legend = L.legend, infoFs = L.infoFs, lgK = L.lgK;
  var i, j;
  function hit(x, y, w, h){
    if (!cl) return true;
    return !(x > cl.x1 || y > cl.y1 || x + w < cl.x0 || y + h < cl.y0);
  }
  /* 背景：分片时只填自己这块 —— 不填会留下透明像素，转 RGB 后变成黑块 */
  c.fillStyle = "#FFFFFF";
  c.fillRect(cl ? cl.x0 : 0, cl ? cl.y0 : 0,
             cl ? (cl.x1 - cl.x0) : W, cl ? (cl.y1 - cl.y0) : H);

  // 信息条：左侧 MARD/尺寸/豆数/色数，右端作者；同级加粗一行
  var ty = pad + Math.round(infoFs * 1.25);
  if (hit(pad, pad, W - pad * 2, L.infoH)){
    /* v127：整体左右排版 —— 左「【作者】· 尺寸 · 豆数 · 色数」，右端红色胶囊版权声明。
       字距收紧（分隔符从全角「　·　」改半角「 · 」）；徽章放不下时自动缩字号到 12px 为止。 */
    c.textBaseline = "alphabetic";
    var F1 = "700 " + infoFs + "px -apple-system,'PingFang SC',sans-serif";
    var sep = " · ";
    var left = "\u3010\u4f5c\u8005\uff1a" + au + "\u3011" + sep + state.cols + " × " + state.rows + sep +
               "共 " + st.total + " 豆" + sep + st.list.length + " 色";
    var decl = "原创图纸 · 禁止二传 · 禁止商用";
    var declFs = Math.round(infoFs * 0.75);
    var fD = "600 " + declFs + "px -apple-system,'PingFang SC',sans-serif";
    c.font = fD; var dw = c.measureText(decl).width;
    c.font = F1; var lw = c.measureText(left).width;
    var gapA = Math.round(infoFs * 0.8);
    while (declFs > 12 && lw + gapA + Math.round(dw + declFs * 1.8) > W - pad * 2){
      declFs -= 1;
      fD = "600 " + declFs + "px -apple-system,'PingFang SC',sans-serif";
      c.font = fD; dw = c.measureText(decl).width;
    }
    var ph = Math.round(declFs * 2.0), pw2 = Math.round(dw + declFs * 1.8);
    var bx = W - pad - pw2;                      /* 徽章贴最右边 */
    var py = Math.round(ty - infoFs * 0.35 - ph / 2);
    roundRectPath(c, bx, py, pw2, ph, Math.round(ph / 2));
    c.fillStyle = "#D5342B"; c.fill();
    c.textAlign = "left"; c.fillStyle = "#FFFFFF"; c.font = fD;
    c.fillText(decl, bx + Math.round(declFs * 0.9), py + Math.round(ph * 0.66));
    c.font = F1; c.fillStyle = "#1D1D1F";
    c.fillText(left, pad, ty);
  }

// 四周格数标尺
  function strip(x, y, len, thick, count, horiz, flip){
    var w = horiz ? len : thick, h = horiz ? thick : len;
    if (!hit(x, y, w, h)) return;
    c.save(); c.translate(x, y);
    c.fillStyle = "#FAFAFA"; c.fillRect(0, 0, w, h);
    function line(at, dash, lw, col){
      var q = Math.round(at * EX) + .5;
      c.setLineDash(dash); c.lineWidth = lw; c.strokeStyle = col;
      c.beginPath();
      if (horiz){ c.moveTo(q, 0); c.lineTo(q, h); } else { c.moveTo(0, q); c.lineTo(w, q); }
      c.stroke();
      c.setLineDash([]);
    }
    var n;                                        // 导出用：从左到右，5 格虚线、10 格实线
    for (n = 1; n < count; n++){ if (relMod(n, 5) === 0) continue; line(n, [], 1, "rgba(0,0,0,.09)"); }
    for (n = 1; n < count; n++){ if (relMod(n, 10) !== 5) continue; line(n, [3, 2], 1, "rgba(0,0,0,.22)"); }
    for (n = 1; n < count; n++){ if (relMod(n, 10) !== 0) continue; line(n, [], 1.4, "rgba(0,0,0,.34)"); }
    c.font = "600 10px -apple-system,'PingFang SC',sans-serif";
    c.textAlign = "center"; c.textBaseline = "middle";
    for (n = 0; n < count; n++){
      var cx = horiz ? (n + .5) * EX : thick / 2;
      var cy = horiz ? thick / 2 : (n + .5) * EX;
      c.fillStyle = (relMod(n + 1, 10) === 0) ? "rgba(0,0,0,.78)" : "rgba(0,0,0,.55)";
      c.fillText(String(n + 1), cx, cy);
    }
    c.restore();
  }
  if (state.showRulers){
    strip(ox, oy - RULER_TOP - GAP, L.drawW, RULER_TOP, state.cols, true, false);
    strip(ox, oy + state.rows * EX + GAP, L.drawW, RULER_TOP, state.cols, true, true);
    strip(ox - RULER_LEFT - GAP, oy, state.rows * EX, RULER_LEFT, state.rows, false, false);
    strip(ox + L.drawW + GAP, oy, state.rows * EX, RULER_LEFT, state.rows, false, true);
  }

  // 像素格（含色号标注）：只遍历与裁剪框相交的那些格
  var cx0 = cl ? Math.max(0, Math.floor((cl.x0 - ox) / EX)) : 0;
  var cx1 = cl ? Math.min(state.cols, Math.ceil((cl.x1 - ox) / EX)) : state.cols;
  var cy0 = cl ? Math.max(0, Math.floor((cl.y0 - oy) / EX)) : 0;
  var cy1 = cl ? Math.min(state.rows, Math.ceil((cl.y1 - oy) / EX)) : state.rows;
  for (var y2 = cy0; y2 < cy1; y2++){
    for (var x2 = cx0; x2 < cx1; x2++){
      var v = state.grid[y2 * state.cols + x2];
      if (!v) continue;
      drawCell(c, ox + x2 * EX, oy + y2 * EX, EX, v - 1, false);
    }
  }

  // 网格线：每格细线 + 每 5 格虚线 + 每 10 格实线加粗（叠加在图纸上方）
  /* v87：以前这里写死「从左到右，不居中」，和画布（居中）对不上。
     现在直接沿用画布的主线分布，导出的图就是你看到的那个样子。 */
  var eoX = gridOffX(), eoY = gridOffY();
  var lx0 = Math.max(1, cx0), lx1 = Math.min(state.cols, cx1 + 1);
  var ly0 = Math.max(1, cy0), ly1 = Math.min(state.rows, cy1 + 1);
  /* v126：网格线改成红色。以前是半透明黑，压在深色/黑色豆子上完全看不见 ——
     细线走「先白后黑」两遍：白线负责深色豆区域、黑线负责浅色豆区域，两边都看得见；
     每 5 格红色虚线、每 10 格红色实线，加粗提亮，深色区不再糊成一片。 */
  c.beginPath();
  for (i = lx0; i < lx1; i++){ if (relMod(i - eoX, 5) === 0) continue; c.moveTo(ox + i*EX + .5, oy); c.lineTo(ox + i*EX + .5, oy + state.rows*EX); }
  for (j = ly0; j < ly1; j++){ if (relMod(j - eoY, 5) === 0) continue; c.moveTo(ox, oy + j*EX + .5); c.lineTo(ox + state.cols*EX, oy + j*EX + .5); }
  c.strokeStyle = "rgba(255,255,255,.30)"; c.lineWidth = 1; c.stroke();
  c.strokeStyle = "rgba(0,0,0,.13)";       c.lineWidth = 1; c.stroke();
  c.setLineDash([9, 6]);
  c.strokeStyle = "rgba(255,20,20,.92)"; c.lineWidth = 2.2;
  c.beginPath();
  for (i = lx0; i < lx1; i++){ if (relMod(i - eoX, 10) !== 5) continue; c.moveTo(ox + i*EX + .5, oy); c.lineTo(ox + i*EX + .5, oy + state.rows*EX); }
  for (j = ly0; j < ly1; j++){ if (relMod(j - eoY, 10) !== 5) continue; c.moveTo(ox, oy + j*EX + .5); c.lineTo(ox + state.cols*EX, oy + j*EX + .5); }
  c.stroke();
  c.setLineDash([]);
  c.strokeStyle = "#FF0000"; c.lineWidth = 2.8;
  c.beginPath();
  for (i = lx0; i < lx1; i++){ if (relMod(i - eoX, 10) !== 0) continue; c.moveTo(ox + i*EX + .5, oy); c.lineTo(ox + i*EX + .5, oy + state.rows*EX); }
  for (j = ly0; j < ly1; j++){ if (relMod(j - eoY, 10) !== 0) continue; c.moveTo(ox, oy + j*EX + .5); c.lineTo(ox + state.cols*EX, oy + j*EX + .5); }
  c.stroke();
  if (hit(ox, oy, state.cols * EX, state.rows * EX)){
    c.lineWidth = 2.8; c.strokeStyle = "#FF0000";
    c.strokeRect(ox + .5, oy + .5, state.cols*EX - 1, state.rows*EX - 1);
  }

  // 图例色号：横向卡片，按图纸宽度自动换行
  if (legend.length){
    var gy = oy + state.rows * EX + L.rb + Math.round(14 * lgK);
    for (var k = 0; k < legend.length; k++){
      var it = legend[k], p = PALETTE[it.idx];
      var cxp = ox + (k % L.perRow) * (L.itemW + L.gapX);
      var cyp = gy + Math.floor(k / L.perRow) * (L.itemH + L.gapY);
      if (!hit(cxp, cyp, L.itemW, L.itemH)) continue;
      roundRectPath(c, cxp, cyp, L.itemW, L.itemH, Math.round(11 * lgK));
      c.fillStyle = "#FFFFFF"; c.fill();
      c.lineWidth = 1; c.strokeStyle = "rgba(0,0,0,.14)"; c.stroke();
      c.save();
      roundRectPath(c, cxp, cyp, L.itemW, L.itemH, Math.round(11 * lgK)); c.clip();
      c.fillStyle = p.h; c.fillRect(cxp, cyp, L.itemW, Math.round(L.itemH * 0.61));
      c.restore();
      var cc = hexToRgb(p.h);
      var lum = (cc[0] * .299 + cc[1] * .587 + cc[2] * .114) / 255;
      c.fillStyle = lum >= .6 ? "#1D1D1F" : "#FFFFFF";
      c.font = "600 " + Math.round(13 * lgK) + "px -apple-system,'PingFang SC',sans-serif";
      c.textAlign = "center"; c.textBaseline = "middle";
      c.fillText(p.id, cxp + L.itemW / 2, cyp + L.itemH * 0.31);
      c.fillStyle = "#1D1D1F";
      c.font = "700 " + Math.round(15 * lgK) + "px -apple-system,'PingFang SC',sans-serif";
      c.fillText(String(it.n), cxp + L.itemW / 2, cyp + L.itemH * 0.8);
    }
  }
}

/* ---------- v125：canvas 上限探测 ----------
   以前把 iOS 的上限写死成「单边 4096 / 面积 16.7M」，实际 iPadOS 机型之间并不一致。
   这里创建一根细长条去试（最大 16384×64，只占 1M 像素，探测本身不会撑爆内存），
   读到我们写进去的红色就算这一档可用。探不到就退回保守值。 */
var _climits = null;
function canvasWorks(cv, w, h){
  try{
    cv.width = w; cv.height = h;
    var c = cv.getContext("2d");
    if (!c) return false;
    c.fillStyle = "#FF0000"; c.fillRect(0, 0, w, h);
    var d = c.getImageData(w - 1, h - 1, 1, 1).data;
    return !!(d && d[0] === 255 && d[3] === 255);
  }catch(e){ return false; }
}
function canvasLimits(){
  if (_climits) return _climits;
  var res = { side: 4096, area: 16.7e6 };
  try{
    var cv = document.createElement("canvas");
    var sides = [4096, 6144, 8192, 12288, 16384], i;
    for (i = 0; i < sides.length; i++){
      if (!canvasWorks(cv, sides[i], 64)) break;
      res.side = sides[i];
    }
    cv.width = 1; cv.height = 1;               /* 探测用的 canvas 立刻放掉 */
  }catch(e){}
  _climits = res;
  return res;
}

/* ---------- v125：分片渲染 + 手写 PNG ----------
   iOS 的 canvas 有硬上限，200 格的图纸 2x 需要 13000×13700 ≈ 179M 像素，
   一张 toBlob 根本吐不出来 —— 于是只能整体缩小，用户拿到手的每格只剩 19px（设计值是 32px）。
   这里的做法：把图切成横条、每条再切成小块，逐块画到小 canvas 上取像素，
   边取边用 CompressionStream 压进 PNG 流。全程只有「一条」的像素在内存里（几 MB），
   所以最终图像可以远大于单块 canvas 的上限。
   PNG 容器自己写：IHDR + tEXt（图纸数据直接写进去，省掉二次编码）+ 分段 IDAT + IEND。 */
var PX_BUDGET = 100e6;           /* 移动端单张图纸的像素预算（≈每格 49px @200 格） */
/* v148：2x 只留给小图纸。
   ⚠️ 别用「按比例封顶像素」的办法降体积 —— 实测 104×154 从 2x 按 0.853 降到 5863×9388，
      文件反而从 4.74MB 涨到 6.85MB：非整数倍缩放让每条网格线、每个色号文字都产生
      抗锯齿，颜色种类暴涨，deflate 压不动。要么整数 2x、要么整数 1x，中间档最糟。
   判定只用「格子区域」：每格 32px 时 1x 已经等于 300dpi 下 2.7mm/格 ≈ 实物原大，
   2x 是给小图纸放大看的；200×200 本来就走 1x，不受影响。 */
function bigSheet(L){
  var gw = state.cols * L.EX, gh = state.rows * L.EX;
  return (gw * gh > 7.5e6 || gw > 8400 || gh > 8400);
}
function sheetStep(L){ return bigSheet(L) ? 1 : 2; }
function canTiledPNG(){ return typeof CompressionStream === "function"; }
function pngChunk(type, data){
  var len = data.length, out = new Uint8Array(len + 12), cr, q;
  out[0] = (len >>> 24) & 255; out[1] = (len >>> 16) & 255;
  out[2] = (len >>> 8) & 255;   out[3] = len & 255;
  out[4] = type.charCodeAt(0); out[5] = type.charCodeAt(1);
  out[6] = type.charCodeAt(2); out[7] = type.charCodeAt(3);
  if (len) out.set(data, 8);
  cr = crc32(out.subarray(4, 8 + len)); q = 8 + len;
  out[q] = (cr >>> 24) & 255; out[q+1] = (cr >>> 16) & 255;
  out[q+2] = (cr >>> 8) & 255;  out[q+3] = cr & 255;
  return out;
}
function pngIHDR(w, h){
  var d = new Uint8Array(13);
  d[0] = (w >>> 24) & 255; d[1] = (w >>> 16) & 255; d[2] = (w >>> 8) & 255; d[3] = w & 255;
  d[4] = (h >>> 24) & 255; d[5] = (h >>> 16) & 255; d[6] = (h >>> 8) & 255; d[7] = h & 255;
  d[8] = 8;   /* 位深 8 */
  d[9] = 2;   /* 颜色类型 2 = RGB（白底图纸没有 alpha，比 RGBA 少 25% 体积） */
  return pngChunk("IHDR", d);
}
function pngTextChunk(keyword, text){ return pngChunk("tEXt", asciiBytes(keyword + "\0" + text)); }
function concatBytes(list, total){
  var out = new Uint8Array(total), q = 0, i;
  for (i = 0; i < list.length; i++){ out.set(list[i], q); q += list[i].length; }
  return out;
}
function pngEncodeSheet(L, au, pxW, pxH, txt, onProg){
  return new Promise(function(resolve, reject){
    var sx = pxW / L.W, sy = pxH / L.H;
    var lim = canvasLimits();
    var TW = Math.max(256, Math.min(lim.side, 2048));   /* 块宽：够大以减少往返，又不超上限 */
    var TH = Math.max(64,  Math.min(lim.side, 256));    /* 条高：决定内存（pxW × TH × 3） */
    var stride = pxW * 3 + 1, raw = new Uint8Array(TH * stride), prevRow = null;
    var chunks = [], total = 0, pumpDone = false, cs, writer, reader, cv, c;
    try{
      cs = new CompressionStream("deflate");           /* PNG 要的是 zlib 格式，正好是 "deflate" */
      writer = cs.writable.getWriter();
      reader = cs.readable.getReader();
    }catch(e){ reject(e); return; }
    (function pump(){
      reader.read().then(function(r){
        if (r.done){ pumpDone = true; return; }
        chunks.push(r.value); total += r.value.length;
        return pump();
      }).catch(function(){ pumpDone = true; });
    })();
    cv = document.createElement("canvas"); c = cv.getContext("2d");
    var ty = 0;
    function renderStrip(){
      try{
        var th = Math.min(TH, pxH - ty), tx, tw, ry, px, dst, src, id;
        for (ry = 0; ry < th; ry++) raw[ry * stride] = 2;          /* v148：行过滤 Up（下面统一作差） */
        for (tx = 0; tx < pxW; tx += TW){
          tw = Math.min(TW, pxW - tx);
          cv.width = tw; cv.height = th;
          c.setTransform(sx, 0, 0, sy, -tx, -ty);
          drawSheet(c, L, au, { x0: tx / sx, y0: ty / sy, x1: (tx + tw) / sx, y1: (ty + th) / sy });
          id = c.getImageData(0, 0, tw, th).data;
          for (ry = 0; ry < th; ry++){
            dst = ry * stride + 1 + tx * 3; src = ry * tw * 4;
            for (px = 0; px < tw; px++){
              raw[dst + px*3]     = id[src + px*4];
              raw[dst + px*3 + 1] = id[src + px*4 + 1];
              raw[dst + px*3 + 2] = id[src + px*4 + 2];
            }
          }
        }
        /* v148：Up 过滤 —— 与上一行逐字节作差。图纸绝大多数行是纯色块或信息带的重复行，
           作差后大量字节归零，deflate 效率明显提升。
           实测 104×154（6872×10994）：None 4.00MB → Up 3.08MB，像素与画质零损失。
           注意 prev 必须是**未过滤**的上一行原值（跨条保存在 prevRow），
           否则第二条起会拿已作差的数据再作差，整张图解码后就废了。 */
        var rowlen = pxW * 3;
        var prev = prevRow || new Uint8Array(rowlen);
        for (ry = 0; ry < th; ry++){
          var rbase = ry * stride + 1;
          var cur = raw.subarray(rbase, rbase + rowlen);
          var orig = cur.slice();                       /* 原值副本：同时作为下一行的 prev */
          for (var ui = 0; ui < rowlen; ui++) cur[ui] = (orig[ui] - prev[ui]) & 255;
          prev = orig;
        }
        prevRow = prev;
        writer.write(raw.subarray(0, th * stride));
        ty += th;
        if (onProg) onProg(ty / pxH);
        if (ty < pxH){ setTimeout(renderStrip, 0); return; }
        writer.close();
        waitPump(function(){
          var idat = concatBytes(chunks, total), parts = [], q = 0, n;
          parts.push(new Uint8Array([137, 80, 78, 71, 13, 10, 26, 10]));
          parts.push(pngIHDR(pxW, pxH));
          if (txt) parts.push(pngTextChunk(PNG_KEY, txt));
          while (q < idat.length){                                  /* 分段 IDAT，单段不超过 64KB */
            n = Math.min(65536, idat.length - q);
            parts.push(pngChunk("IDAT", idat.subarray(q, q + n)));
            q += n;
          }
          parts.push(pngChunk("IEND", new Uint8Array(0)));
          cv.width = 1; cv.height = 1;
          resolve(new Blob(parts, { type: "image/png" }));
        });
      }catch(e){ try{ writer.abort(); }catch(e2){} cv.width = 1; cv.height = 1; reject(e); }
    }
    function waitPump(cb){
      if (pumpDone){ setTimeout(cb, 0); return; }
      setTimeout(function(){ waitPump(cb); }, 30);
    }
    setTimeout(renderStrip, 0);
  });
}

/* 预览缩略图：按同一套排版重画一张小的。
   为什么不把原图塞进 Image 缩小——解码一张上亿像素的 PNG 要先占几百 MB，
   在 iPad 上页面可能直接白掉，而重画一张小图只要几十毫秒。 */
function renderThumb(L, au, maxSide){
  return new Promise(function(res, rej){
    var cv = document.createElement("canvas");
    cv.width = Math.max(1, Math.round(L.W * Math.min(1, maxSide / L.W)));
    cv.height = Math.max(1, Math.round(L.H * (cv.width / L.W)));
    var c = cv.getContext("2d");
    c.setTransform(cv.width / L.W, 0, 0, cv.height / L.H, 0, 0);
    drawSheet(c, L, au, null);
    cv.toBlob(function(b){ b ? res(b) : rej(new Error("thumb")); }, "image/png");
  });
}

/* 出图后的收尾：写文件名、内嵌图纸数据（flat 路径才需要后置嵌入）、交给交付层 */
function finishPNG(blob, au, pxW, pxH, hasText, done, L){
  var fn = (projName ? safeFileName(projName) : "bead-pattern-" + state.cols + "x" + state.rows) + ".png";
  var lb = "图纸 PNG（" + pxW + "×" + pxH + "）";
  function deliver(finalBlob){
    /* v125：大图只给缩略图做预览，分享出去的仍然是原图 */
    if (L && isMobileDevice() && pxW * pxH > 20e6){
      renderThumb(L, au, 1400).then(function(tb){ deliverBlob(finalBlob, fn, lb, done, tb); })
        .catch(function(){ deliverBlob(finalBlob, fn, lb, done, null); });
      return;
    }
    deliverBlob(finalBlob, fn, lb, done, null);
  }
  if (hasText){ deliver(blob); return; }
  /* v86：把图纸数据写进 PNG 的 tEXt —— 之后这张图本身就能被认回来。
     内嵌失败不能连累出图，所以任何异常都退回原图交付。 */
  var txt = null;
  try{ txt = pngDataText(); }catch(e){ txt = null; }
  if (!txt){ deliver(blob); return; }
  pngEmbedText(blob, PNG_KEY, txt).then(function(b2){
    if (!b2){ deliver(blob); return; }
    /* v92 自检：把数据写进去之后**读回来确认一次**。
       以前写失败会静默退回一张没数据的图，用户拿去导入就"认不出来"，谁也不知道为什么。
       现在读得到才用它，读不到就说清楚。 */
    readArrayBuffer(b2).then(function(ab){
      var ok = !!pngReadText(ab, PNG_KEY);
      deliver(ok ? b2 : blob);
      if (!ok) toast("这张图没能带上图纸数据，导入时会重新识别");
    }).catch(function(){ deliver(b2); });
  }).catch(function(){ deliver(blob); });
}

/* 普通（单张 canvas）出图 */
function exportPNGRender(L, author, pxW, pxH, scale, done){
  var au = (author || "").trim() || DEF_AUTHOR;
  var cv = document.createElement("canvas");
  cv.width = pxW; cv.height = pxH;
  var c = cv.getContext("2d");
  c.setTransform(pxW / L.W, 0, 0, pxH / L.H, 0, 0);
  drawSheet(c, L, au, null);
  cv.toBlob(function(blob){
    /* v81：iPad 上 toBlob 给 null = 编码这张图内存不够。与其直接报失败，
       先自动降一档像素重来一次（内容不变，只是小一点），还不行才提示。 */
    if (!blob && !scale){ exportPNG(author, 0.6, done); return; }
    /* 出图失败也要把批量链走下去，否则后面的封面、工程文件再也不会生成 */
    if (!blob){ toast("导出失败：图纸太大，试试减少格数或关掉标尺"); if (done) done(); return; }
    finishPNG(blob, au, pxW, pxH, false, done, L);
  }, "image/png");
}

/* v125：分片生成要跑几秒到十几秒，不给人看进度就会以为卡死了 */
var tiledBusy = false;
function showTiledProg(pxW, pxH){
  var m = $("tiledProg");
  if (!m){
    m = document.createElement("div");
    m.className = "modal-mask"; m.id = "tiledProg";
    m.innerHTML = '<div class="save-box">' +
      '<div class="m-t" id="tiledProgT">正在生成高清图纸</div>' +
      '<div class="prog-bar"><i id="tiledProgBar"></i></div>' +
      '</div>';
    document.body.appendChild(m);
  }
  $("tiledProgT").textContent = "正在生成高清图纸 " + pxW + " × " + pxH;
  $("tiledProgBar").style.width = "0%";
  m.hidden = false;
}
function setTiledProg(p){
  var b = $("tiledProgBar");
  if (b) b.style.width = Math.max(1, Math.round(p * 100)) + "%";
}
function hideTiledProg(){
  var m = $("tiledProg");
  if (m) m.hidden = true;
}
function exportPNG(author, scale, done){
  var st = computeStats();
  var L = sheetLayout(st);
  var W = L.W, H = L.H;
  var au = (author || "").trim() || DEF_AUTHOR;
  var pxW, pxH, kSafe = 1;
  /* v76：iOS Safari 的 canvas 有硬上限（面积约 16.7M 像素、单边 4096），
     超限后 toBlob 在 iPad 上只会吐出空白或降级图 —— 用户看到的就是「保存的图片不高清」。
     v125：单张 canvas 到顶之后不再硬缩，改走分片渲染（见 pngEncodeSheet），
     按像素预算出图；桌面维持原行为不变。 */
  if (isMobileDevice()){
    var lim = canvasLimits(), want = (sheetStep(L) * (scale || 1));
    var pw = W * want, ph = H * want;
    kSafe = Math.min(1, lim.side / Math.max(pw, ph), Math.sqrt(lim.area / (pw * ph)));
    /* v126：像素预算只按「格子区域」算，不再按整张图纸。
       信息带/图例按比例变高（v126 改版）后若还按整张算，带子越高 → k 越小 →
       大图每格像素被带子挤掉，正是用户说的「不能动我大图的分辨率」。
       格子区域的像素数只由格数和 EX 决定，与上下两条带子无关。 */
    var gPx = (state.cols * L.EX * want) * (state.rows * L.EX * want);
    var kBudget = Math.min(1, Math.sqrt(PX_BUDGET / gPx));
    if (kBudget > kSafe + 0.02 && canTiledPNG() && !scale){
      if (tiledBusy){ toast("上一张高清图纸还在生成，请稍候"); return; }
      tiledBusy = true;
      pxW = Math.max(1, Math.round(pw * kBudget)); pxH = Math.max(1, Math.round(ph * kBudget));
      var txt = null;
      try{ txt = pngDataText(); }catch(e){ txt = null; }
      showTiledProg(pxW, pxH);
      pngEncodeSheet(L, au, pxW, pxH, txt, setTiledProg).then(function(blob){
        hideTiledProg();
        tiledBusy = false;
        finishPNG(blob, au, pxW, pxH, !!txt, done, L);
      }).catch(function(){
        /* 分片失败（内存不够 / 编码不支持）：退回单张 canvas，按安全上限再出一次 */
        hideTiledProg();
        tiledBusy = false;
        exportPNGRender(L, author, Math.max(1, Math.round(pw * kSafe)),
                        Math.max(1, Math.round(ph * kSafe)), scale, done);
      });
      return;
    }
    pxW = Math.max(1, Math.round(pw * kSafe)); pxH = Math.max(1, Math.round(ph * kSafe));
  } else {
    /* v126：同样改用格子区域判定 —— 否则信息带一变高就把 2x 打回 1x，
       分辨率直接腰斩。格子区域才是决定「图纸清不清晰」的那部分。
       v134：这里曾改成「超 55M 像素就走分片渲染」——那是我自己加的、你没要求过，
       而且会改变大图纸的出图路径（多一个进度浮层）。已撤回原样。 */
    var d = sheetStep(L);                     /* v148：整数倍，1x 或 2x */
    pxW = W * d; pxH = H * d;
  }
  exportPNGRender(L, author, pxW, pxH, scale, done);
}

/* 小红书封面：3:4 竖版；背景 = 图纸高斯模糊；中间放无网格/无色号的缩小图纸；底部 @作者 */
function exportCover(author, done){
  var st = computeStats();
  if (!st.list.length){ toast("画布还是空的哦"); if (done) done(); return; }
  var CW = 1080, CH = 1440;                     /* 3:4 竖版 */
  var EX = 24;

  /* 1. 先裁到实际内容范围：周围的透明格子不参与封面，图纸不会被空白撑大 */
  var bx0 = state.cols, by0 = state.rows, bx1 = -1, by1 = -1, yy2, xx2;
  for (yy2 = 0; yy2 < state.rows; yy2++){
    for (xx2 = 0; xx2 < state.cols; xx2++){
      if (!state.grid[yy2 * state.cols + xx2]) continue;
      if (xx2 < bx0) bx0 = xx2;
      if (xx2 > bx1) bx1 = xx2;
      if (yy2 < by0) by0 = yy2;
      if (yy2 > by1) by1 = yy2;
    }
  }
  if (bx1 < 0){ toast("画布还是空的哦"); return; }
  var gw = (bx1 - bx0 + 1) * EX, gh = (by1 - by0 + 1) * EX;

  /* 2. 干净图纸：不画网格线、不画格内色号 */
  var sc = state.showCodes;
  state.showCodes = false;
  var g = document.createElement("canvas");
  g.width = gw; g.height = gh;
  var gc = g.getContext("2d");
  for (var y = by0; y <= by1; y++){
    for (var x = bx0; x <= bx1; x++){
      var v = state.grid[y * state.cols + x];
      if (!v) continue;
      drawCell(gc, (x - bx0) * EX, (y - by0) * EX, EX, v - 1, false);
    }
  }
  state.showCodes = sc;

  /* 3. 毛玻璃背景：主色打底 + 多级下采样模糊。
     不用 ctx.filter —— Safari/手机 WebView 的 canvas filter 赋值能过
     但渲染不生效（背景变锐利格子）；drawImage 缩放在全平台行为一致 */
  var cv = document.createElement("canvas");
  cv.width = CW; cv.height = CH;
  var c = cv.getContext("2d");
  c.fillStyle = PALETTE[st.list[0].idx].h; c.fillRect(0, 0, CW, CH);
  var bs = Math.max(CW / gw, CH / gh) * 1.8;
  var bw = gw * bs, bh = gh * bs;
  var bx = (CW - bw) / 2, by = (CH - bh) / 2;
  /* 三级金字塔：图纸 → 1/6 → 1/24 → 12px，逐级把格子融成柔和色块 */
  var prev = g, tws = [Math.max(24, Math.round(bw / 6)), Math.max(12, Math.round(bw / 24)), 12];
  for (var ti = 0; ti < tws.length; ti++){
    var tb = document.createElement("canvas");
    tb.width = tws[ti];
    tb.height = Math.max(2, Math.round(tws[ti] * bh / bw));
    var tbc = tb.getContext("2d");
    tbc.imageSmoothingEnabled = true; tbc.imageSmoothingQuality = "high";
    tbc.drawImage(prev, 0, 0, tb.width, tb.height);
    prev = tb;
  }
  /* 小图上做像素级提饱和（等价原 saturate(1.45)，几十个像素零开销） */
  (function(){
    var pctx = prev.getContext("2d");
    var dd = pctx.getImageData(0, 0, prev.width, prev.height);
    var a = dd.data, p;
    for (p = 0; p < a.length; p += 4){
      var r = a[p], g2 = a[p + 1], b2 = a[p + 2], L = 0.299 * r + 0.587 * g2 + 0.114 * b2;
      a[p] = L + (r - L) * 1.45; a[p + 1] = L + (g2 - L) * 1.45; a[p + 2] = L + (b2 - L) * 1.45;
    }
    pctx.putImageData(dd, 0, 0);
  })();
  c.imageSmoothingEnabled = true; c.imageSmoothingQuality = "high";
  c.drawImage(prev, bx, by, bw, bh);
  c.fillStyle = "rgba(255,255,255,.32)"; c.fillRect(0, 0, CW, CH);   /* 磨砂白雾 */

  /* 4. 中间图纸：宽 = 封面宽的一半，圆角裁切，无描边无阴影 */
  var s = Math.min(CW * 0.5 / gw, CH * 0.62 / gh);
  var dw = Math.round(gw * s), dh = Math.round(gh * s);
  var dx = Math.round((CW - dw) / 2), dy = Math.round((CH - dh) / 2) - 60;
  c.save();
  roundRectPath(c, dx, dy, dw, dh, Math.round(Math.min(dw, dh) * 0.035) + 6);
  c.clip();
  c.drawImage(g, dx, dy, dw, dh);
  c.restore();

  /* 5. 作者名 @xxx：按背景亮度自动配字色 */
  var au = (author || "").trim() || DEF_AUTHOR;
  var txt = "@" + au;
  var fs = Math.round(CW * 0.042);
  c.font = "500 " + fs + "px -apple-system,'PingFang SC',sans-serif";
  c.textAlign = "center"; c.textBaseline = "alphabetic";
  var ty = dy + dh + Math.round(fs * 1.35);
  var lum = 0.5;
  try {
    var sw = Math.min(CW - 40, Math.round(c.measureText(txt).width) + 100);
    var sh = Math.round(fs * 1.1);
    var sx = Math.max(0, Math.round((CW - sw) / 2));
    var sy = Math.max(0, Math.round(ty - fs * 0.95));
    var dd = c.getImageData(sx, sy, sw, sh).data;
    var sum = 0, cn = 0;
    for (var i = 0; i < dd.length; i += 16){
      sum += (dd[i] * 0.299 + dd[i + 1] * 0.587 + dd[i + 2] * 0.114) / 255; cn++;
    }
    if (cn) lum = sum / cn;
  } catch(err){}
  if (lum >= 0.55){
    c.fillStyle = "rgba(29,29,31,.9)";
  } else {
    c.fillStyle = "rgba(255,255,255,.97)";
    c.shadowColor = "rgba(0,0,0,.4)"; c.shadowBlur = 20;
  }
  c.fillText(txt, CW / 2, ty);
  c.shadowBlur = 0; c.shadowColor = "transparent";

  cv.toBlob(function(blob){
    if (!blob){ toast("导出失败：封面生成失败，再试一次"); if (done) done(); return; }
    /* v99：封面跟着图纸名走 —— 0924-01-cover.png */
    deliverBlob(blob, (projName ? safeFileName(projName) : "bead-cover-" + state.cols + "x" + state.rows) + "-cover.png", "小红书封面", done);
  }, "image/png");
}

/* =========================================================
   v137：电脑端导出 = 封面 + 图纸 + 镜像图纸 + 工程文件，打成一个 zip
   逐个下载要点四次「保存」，下载文件夹里还容易和上一张混。
   PNG / JSON 本身已经是压缩格式，zip 里再 deflate 一遍几乎不省体积，
   所以这里用 store（只打包、不压缩）模式，自己写几十行就够了，不引第三方库。
   ========================================================= */
var ZCRC_TAB = null;
function zipCRC(u8){
  if (!ZCRC_TAB){
    ZCRC_TAB = new Int32Array(256);
    for (var n = 0; n < 256; n++){
      var c = n;
      for (var k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
      ZCRC_TAB[n] = c;
    }
  }
  var r = -1;
  for (var i = 0; i < u8.length; i++) r = (r >>> 8) ^ ZCRC_TAB[(r ^ u8[i]) & 0xFF];
  return (r ^ -1) >>> 0;
}
function zipU16(v){ return [v & 255, (v >> 8) & 255]; }
function zipU32(v){ return [v & 255, (v >> 8) & 255, (v >> 16) & 255, (v >>> 24) & 255]; }
/* entries: [{name, blob}] → Promise<Blob>。0x0800 = 文件名按 UTF-8 解，中文名不乱码 */
function zipBuild(entries){
  return Promise.all(entries.map(function(e){
    return readArrayBuffer(e.blob).then(function(ab){ return new Uint8Array(ab); });
  })).then(function(datas){
    var d = new Date(), i;
    var tm = ((d.getHours() << 11) | (d.getMinutes() << 5) | (d.getSeconds() >> 1)) & 0xFFFF;
    var dt = (((d.getFullYear() - 1980) << 9) | ((d.getMonth() + 1) << 5) | d.getDate()) & 0xFFFF;
    var chunks = [], total = 0, central = [], cdSize = 0, off = 0;
    function w(a){
      var u = (a instanceof Uint8Array) ? a : new Uint8Array(a);
      chunks.push(u); total += u.length;
    }
    for (i = 0; i < entries.length; i++){
      var nm = new TextEncoder().encode(entries[i].name);
      var u8 = datas[i], cr = zipCRC(u8), at = off;
      w([].concat([0x50,0x4b,0x03,0x04], zipU16(20), zipU16(0x0800), zipU16(0),
                  zipU16(tm), zipU16(dt), zipU32(cr), zipU32(u8.length), zipU32(u8.length),
                  zipU16(nm.length), zipU16(0)));
      w(nm); w(u8);
      off = total;
      var cde = [].concat([0x50,0x4b,0x01,0x02], zipU16(20), zipU16(20), zipU16(0x0800), zipU16(0),
                          zipU16(tm), zipU16(dt), zipU32(cr), zipU32(u8.length), zipU32(u8.length),
                          zipU16(nm.length), zipU16(0), zipU16(0), zipU16(0), zipU16(0),
                          zipU32(0), zipU32(at));
      central.push([cde, nm]); cdSize += cde.length + nm.length;
    }
    for (i = 0; i < central.length; i++){ w(central[i][0]); w(central[i][1]); }
    w([].concat([0x50,0x4b,0x05,0x06], zipU16(0), zipU16(0),
                zipU16(entries.length), zipU16(entries.length),
                zipU32(cdSize), zipU32(off), zipU16(0)));
    var out = new Uint8Array(total), p = 0;
    for (i = 0; i < chunks.length; i++){ out.set(chunks[i], p); p += chunks[i].length; }
    return new Blob([out], { type: "application/zip" });
  });
}

/* 镜像图纸：和工具栏「镜像」完全同一个语义 —— 只把当前图层的格子左右翻，
   信息带 / 标尺 / 图例一律不翻（翻了就没法照着数格子了）。
   这里不真的执行 mirrorGrid（那会动你的画布、还进撤销栈），
   只在渲染时临时换一份翻好的格子，画完**同步**立刻换回去，再去慢慢编码 PNG。
   所以你原来的图纸从头到尾没被动过，中途点画布也不会写进临时数组。 */
function mirroredGridArray(){
  var g = state.grid, cols = state.cols, rows = state.rows, ng = new Array(g.length), x, y;
  for (y = 0; y < rows; y++)
    for (x = 0; x < cols; x++) ng[y * cols + x] = g[y * cols + (cols - 1 - x)];
  return ng;
}
function exportMirrorPNG(au, cb){
  var st = computeStats();
  if (!st.list.length){ if (cb) cb(); return; }
  var L = sheetLayout(st);
  /* 分辨率算法与 exportPNG 的桌面分支保持一致（v126 起的格子区域判定） */
  var gw = state.cols * L.EX, gh = state.rows * L.EX;
  var d = (gw * gh > 25e6 || gw > 8400 || gh > 8400) ? 1 : 2;
  var pxW = L.W * d, pxH = L.H * d;
  var saved = state.grid;
  state.grid = mirroredGridArray();
  var cv = document.createElement("canvas");
  cv.width = pxW; cv.height = pxH;
  var c = cv.getContext("2d");
  c.setTransform(pxW / L.W, 0, 0, pxH / L.H, 0, 0);
  drawSheet(c, L, au, null);
  state.grid = saved;                    /* 同步换回，你的图纸没动过 */
  cv.toBlob(function(blob){
    if (!blob){
      toast("镜像图纸没生成（图太大），压缩包里是另外三份");
      if (cb) cb(); return;
    }
    /* 镜像图只用来照着拼，不内嵌图纸数据 —— 免得导回来又跟图对不上 */
    var nm = safeFileName(projName) || ("拼豆图纸-" + state.cols + "x" + state.rows);
    zipSinkPut(nm + "-镜像.png", blob);
    if (cb) cb();
  }, "image/png");
}

/* 四件收齐 → 一个 zip。任何一份生成失败都不拖累其余的，缺哪份就少哪份 */
function exportZipBundle(au){
  var nm = safeFileName(projName) || ("拼豆图纸-" + state.cols + "x" + state.rows);
  zipSink = { list: [], tag: "" };
  function finish(){
    var items = zipSink ? zipSink.list : [];
    zipSink = null;                       /* 关掉收集器，下面那次 deliver 才会真的下载 */
    exportQuiet = false;
    if (!items.length){ toast("导出失败：四个文件都没生成，再试一次"); return; }
    zipBuild(items).then(function(zb){
      deliverBlob(zb, nm + ".zip", "压缩包（" + items.length + " 个文件）");
    }).catch(function(){
      toast("打包失败，已改成单独下载");
      exportPNG(au); exportCover(au); exportProject();
    });
  }
  exportPNG(au, 0, function(){            /* 1 图纸（带图纸数据，导回来认得出） */
    exportMirrorPNG(au, function(){       /* 2 镜像图纸 */
      exportCover(au, function(){         /* 3 封面 */
        exportProject(finish);            /* 4 工程文件 图纸名.json（v150） */
      });
    });
  });
}

function exportBoth(){
  var au = readAuthor();
  /* 多层内容时只有当前图层会导出 —— 沿用弹窗时代的提醒，不阻塞下载 */
  var L = activeLayer(), others = 0, i, j;
  for (i = 0; i < state.layers.length; i++){
    if (state.layers[i] === L || !state.layers[i] || !state.layers[i].visible) continue;
    for (j = 0; j < state.layers[i].grid.length; j++)
      if (state.layers[i].grid[j]){ others++; break; }
  }
  exportQuiet = true;       /* v108：三份连发，成功 toast 全部静默（失败仍会提示） */
  /* v119：移动端（含发布页的 iframe 壳）改成一份一份来。
     三份同时发起会互相抢系统面板、抢保存浮层 —— 工程文件的分享面板先弹，
     图纸和封面的浮层再依次盖上去并撤掉上一张的 blob URL，
     iPad 上就表现为「面板一闪而过，封面没保存上」；
     同时编码两张大图还容易触发 toBlob 内存不足而降级。
     现在：图纸 →（保存或关闭后）封面 → 工程文件。 */
  if (isMobileDevice() || inIframe()){
    exportPNG(au, 0, function(){
      exportCover(au, function(){
        exportProject(function(){ exportQuiet = false; });
      });
    });
  } else {
    /* v137：桌面改成打包成一个 zip —— 封面 / 图纸 / 镜像图纸 / 工程文件，
       只弹一次保存。手机 / iPad 保持一份一份分享（iOS 上解压不方便）。 */
    exportZipBundle(au);
  }
  /* 提醒放到最后说：下载提示在前，这条后发才不会被盖掉（也不在刚点按钮时就冒出来） */
  if (others) setTimeout(function(){
    toast("注意：另有 " + others + " 个图层有内容没导出，要一起导请先合并图层");
  }, 700);
}

function exportList(){

  if (!st.list.length){ toast("画布还是空的哦"); return; }
  var lines = [];
  lines.push("拼豆图纸用料清单");

  lines.push("已用豆子：" + st.total + " 颗　　使用颜色：" + st.list.length + " 种");
  lines.push("--------------------------------");
  for (var i = 0; i < st.list.length; i++){
    var it = st.list[i], p = PALETTE[it.idx];
    lines.push(p.id + "\t" + p.n + "\t" + p.h.toUpperCase() + "\t×" + it.n);

}
function saveProject(){

function loadProject(file){
  var reader = new FileReader();
  reader.onload = function(ev){
    try{
      var d = JSON.parse(ev.target.result);
      var cols = clamp(d.cols | 0, 4, 100), rows = clamp(d.rows | 0, 4, 100);
      if (!cols || !rows) throw new Error("bad size");
      var ids = d.palette || PALETTE.map(function(p){ return p.id; });
      beginChange();
      state.cols = cols; state.rows = rows;
      var ng = new Array(cols * rows);
      for (var i = 0; i < ng.length; i++){
        var id = (d.cells && d.cells[i]) ? d.cells[i] : "";
        var idx = PINDEX[id];
        ng[i] = (idx === undefined) ? 0 : (idx + 1);
      }
      initLayers(ng);                  /* 导入的工程只有一层内容，作为图纸层 */
      endChange();
      $("inCols").value = cols; $("inRows").value = rows;
      renderAll(); renderLayerPanel(); fitZoom(); saveDraft();
      toast("工程已读取");
    } catch(err){
      toast("文件解析失败");
    }
  };
  reader.readAsText(file);
}

/* =========================================================
   变换
   ========================================================= */
/* =========================================================
   图纸优化：缩放 / 局部细化 / 精简用色
   ========================================================= */
/* 图纸缩放：按新尺寸重排现有图案。
   取值用「目标格覆盖源区域内的众数」—— 放大时覆盖 1 格等价最近邻（保持硬边），
   缩小时取最多的色号避免细节丢失。绝不插值混色，否则会生成色板里没有的颜色。 */
function resampleGrid(nc, nr, srcGrid){
  var g = srcGrid || state.grid, oc = state.cols, or_ = state.rows;
  var ng = new Array(nc * nr);
  for (var i = 0; i < ng.length; i++) ng[i] = 0;
  for (var y = 0; y < nr; y++){
    var sy0 = Math.floor(y * or_ / nr);
    var sy1 = Math.max(sy0 + 1, Math.floor((y + 1) * or_ / nr));
    for (var x = 0; x < nc; x++){
      var sx0 = Math.floor(x * oc / nc);
      var sx1 = Math.max(sx0 + 1, Math.floor((x + 1) * oc / nc));
      var best = 0, bestV = 0, counts = [];
      for (var yy = sy0; yy < sy1 && yy < or_; yy++){
        for (var xx = sx0; xx < sx1 && xx < oc; xx++){
          var v = g[yy * oc + xx];
          if (!v) continue;
          counts[v] = (counts[v] || 0) + 1;
          if (counts[v] > best){ best = counts[v]; bestV = v; }
        }
      }
      ng[y * nc + x] = bestV;
    }
  }
  return ng;
}
function applyResample(){
  var nc = clamp(parseInt($("inRW").value, 10) || state.cols, 4, MAX_SIDE);
  var nr = clamp(parseInt($("inRH").value, 10) || state.rows, 4, MAX_SIDE);
  $("inRW").value = nc; $("inRH").value = nr;
  if (nc === state.cols && nr === state.rows){ toast("尺寸没有变化"); return; }
  var oc = state.cols, or_ = state.rows;
  beginChange();
  /* 所有图层一起按比例重采样 —— 手绘内容跟着缩放，不丢 */
  for (var li = 0; li < state.layers.length; li++)
    state.layers[li].grid = resampleGrid(nc, nr, state.layers[li].grid);
  state.cols = nc; state.rows = nr;
  syncActiveGrid();
  markAllLayersDirty();
  state.refOff.x = state.refOff.x * nc / oc;      /* 参考图位置按比例跟随 */
  state.refOff.y = state.refOff.y * nr / or_;
  $("inCols").value = nc; $("inRows").value = nr;
  if (state.lockRatio) state.lockVal = clamp(nr / nc, 0.04, 25);
  endChange();
  renderAll(); renderLayerPanel(); fitZoom(); saveDraft();
  toast("图纸已缩放为 " + nc + " × " + nr + "（所有图层一起缩放）");
  warnRefMismatch();
}
/* 画布尺寸改了 → 底图会按新尺寸重新适配，而图纸还是旧尺寸下的结果，
   照着底图画就会落到隔壁格。这里提示重转（不自动转，免得冲掉手绘内容） */
function warnRefMismatch(){
  if (!state.refImage) return;
  toast("尺寸变了：底图已按新尺寸重新适配，与当前图纸可能错位，照着画前请点「一键转图纸」");
}
/* 通用确认弹窗 */
function askConfirm(title, body, okText, onOk){
  var m = $("confirmModal");
  $("cfTitle").textContent = title;
  $("cfBody").textContent = body;
  $("cfOk").textContent = okText || "确定";
  m.hidden = false;
  function close(){ m.hidden = true; $("cfOk").onclick = null; $("cfCancel").onclick = null; }
  $("cfOk").onclick = function(){ close(); onOk(); };
  $("cfCancel").onclick = close;
}
/* 一键转图纸的入口：判断要不要先提醒会丢进度 */
function requestConvert(){
  if (!state.refImage){ toast("请先上传图片"); return; }
  var userLayers = 0, drawn = 0, i, j;
  for (i = 0; i < state.layers.length; i++){
    var L = state.layers[i];
    if (L.kind === "pattern") continue;
    userLayers++;
    for (j = 0; j < L.grid.length; j++) if (L.grid[j]){ drawn++; break; }
  }
  var sizeChanged = (state.layers[0] && state.layers[0].grid.length !== state.cols * state.rows);
  if (sizeChanged && userLayers > 0){
    askConfirm("重新生成会丢失进度",
      "画布尺寸已经变了，之前画的 " + userLayers + " 个图层没法对齐新尺寸。\n" +
      "继续的话，这些手绘图层会被清空，只保留重新生成的图纸层。",
      "继续并清空", function(){
        initLayers(makeGrid(state.cols, state.rows, false));
        imageToPattern();
      });
    return;
  }
  imageToPattern();
}
/* 缩放输入框跟随比例锁 */
function syncResample(who){
  if (!state.lockRatio) return;
  var c = parseInt($("inRW").value, 10), r = parseInt($("inRH").value, 10);
  if (!c || !r) return;
  if (who === "cols") $("inRH").value = clamp(Math.round(c * state.lockVal), 4, MAX_SIDE);
  else               $("inRW").value = clamp(Math.round(r / state.lockVal), 4, MAX_SIDE);
}

/* 局部细化：对选区「单独重新配色 + 更强锐化」—— 选区不再跟全图抢 40 色的
   预算，而是按自己的面积另配一套色板，细节和层次明显多于周围。
   选区外的格子（含手工修改）完全不动 */
function redoRegion(x0, y0, x1, y1){
  if (!state.refImage){ toast("请先上传图片"); return; }
  var cols = state.cols, rows = state.rows;
  x0 = clamp(x0, 0, cols - 1); x1 = clamp(x1, 0, cols - 1);
  y0 = clamp(y0, 0, rows - 1); y1 = clamp(y1, 0, rows - 1);
  var w = x1 - x0 + 1, h = y1 - y0 + 1;
  if (w < 2 || h < 2){ toast("选区太小，至少框 2×2 格"); return; }
  if (state.sourceMode !== "photo"){ toast("像素画已是逐格直映，无需细化"); return; }
  var cc = computeCells(cols, rows);
  if (!cc) return;
  var n = cc.n, r = cc.rect, cw = cc.cw, chh = cc.chh;
  /* 选区锐化 1.0（全局 0.3~0.7）：比全局强但不过冲，细节主要靠下面放开的色数 */
  var lab = cellsToLab(cellUnsharp(cc.cells, cols, rows, 1.0), n);
  /* 选区正好是个矩形 → 直接当成 w×h 的小图纸来配色和分配 */
  var m = w * h, sub = new Float64Array(m * 3), idx = new Int32Array(m), i;
  for (var y = y0; y <= y1; y++){
    for (var x = x0; x <= x1; x++){
      var k = (y - y0) * w + (x - x0), gi = y * cols + x;
      idx[k] = gi;
      sub[k * 3] = lab[gi * 3]; sub[k * 3 + 1] = lab[gi * 3 + 1]; sub[k * 3 + 2] = lab[gi * 3 + 2];
    }
  }
  /* 色数按选区面积给（每 4 格一个色，24~128），近色合并更放宽（1.5，全局 2）
     —— 选区小，近似色交替的色斑风险低，despeckle + fragClean 兜底 */
  var S = selectPalette(sub, clamp(Math.round(m / 4), 24, 128), 1.5);
  var D = buildD(sub, S);
  var a = icmSmooth(D, w, h, 2, 2);              /* 极弱平滑，保住细出来的细节 */
  var codes = despeckle((function(){
    var out = new Int32Array(m);
    for (var t = 0; t < m; t++) out[t] = S[a[t]];
    return out;
  })(), w, h, 8, 2, sub);

  var st0 = computeStats();
  beginChange();
  var changed = 0, before = {}, after = {};
  for (i = 0; i < m; i++){ before[state.grid[idx[i]]] = 1; }
  for (i = 0; i < m; i++){
    var gi2 = idx[i];
    /* 底图没盖到的格子保持空，不填豆 */
    var sy = Math.floor(gi2 / cols), sx = gi2 % cols;
    var syc = r[1] + (sy + 0.5) * (r[3] - r[1]) / rows;
    var sxc = r[0] + (sx + 0.5) * (r[2] - r[0]) / cols;
    if (syc < 0 || syc >= chh || sxc < 0 || sxc >= cw){ state.grid[gi2] = 0; continue; }
    var v = codes[i] + 1;
    if (state.grid[gi2] !== v){ state.grid[gi2] = v; changed++; }
    after[v] = 1;
  }
  endChange();
  renderAll(); saveDraft();
  var st1 = computeStats();
  toast("选区 " + w + "×" + h + " 已细化：" + changed + " 格变化，" +
        "用色 " + st0.list.length + "→" + st1.list.length);
}

/* 精简用色：按用量从少到多，把色号并入「视觉最接近且仍保留」的色号（CIEDE2000）。
   目的是少买几包豆 —— 用量最少的色号往往只占几颗，单独买不划算。
   与旧的「合并相近色」不同：只牺牲用量最少的，主色和大面积色不会被改动。 */
/* v130：点缀色识别 —— 「眼睛、唇色、高光」这类面积小但必须留的色。
   判据（三条同时满足前两条之一+反差）：
     ① 占比 ≤ 4%（确实是零星色）
     ② 成簇：同色邻居占邻居总数 ≥ 35%（区分「真点缀」与「孤立杂豆」）
        或 邻域反差极大（ΔE ≥ 25）——单格高光/瞳孔也救回来
     ③ 与邻域平均 ΔE ≥ 10（跟周围明显不一样，是细节不是噪点）
   噪点（v129 抖动颗粒）ΔE 通常很小 → 不会误保，正好和去杂色不冲突。 */
function accentSet(st){
  var g = state.grid, cols = state.cols, rows = state.rows, lab = palLab();
  var k, cnt = {}, neigh = {}, de = {}, same = {};
  for (k = 0; k < st.list.length; k++){
    cnt[st.list[k].idx] = st.list[k].n; neigh[st.list[k].idx] = 0;
    de[st.list[k].idx] = 0; same[st.list[k].idx] = 0;
  }
  var DX = [1, -1, 0, 0], DY = [0, 0, 1, -1];
  for (var y = 0; y < rows; y++){
    for (var x = 0; x < cols; x++){
      var v = g[y * cols + x];
      if (!v) continue;
      var a = v - 1;
      for (var d = 0; d < 4; d++){
        var nx = x + DX[d], ny = y + DY[d];
        if (nx < 0 || ny < 0 || nx >= cols || ny >= rows) continue;
        var b2 = g[ny * cols + nx];
        if (!b2) continue;
        neigh[a]++;
        if (b2 - 1 === a){ same[a]++; continue; }
        de[a] += de2000(lab[a][0], lab[a][1], lab[a][2],
                        lab[b2-1][0], lab[b2-1][1], lab[b2-1][2]);
      }
    }
  }
  var out = {};
  for (k = 0; k < st.list.length; k++){
    var idx = st.list[k].idx;
    if (cnt[idx] / st.total > 0.04) continue;
    var clus = neigh[idx] ? same[idx] / neigh[idx] : 0;
    var nd = neigh[idx] ? de[idx] / neigh[idx] : 0;
    if (nd >= 10 && (clus >= 0.35 || nd >= 25)) out[idx] = 1;
  }
  return out;
}

function simplifyColors(target){
  var st = computeStats();
  if (!st.list.length){ toast("画布还是空的哦"); return; }
  target = Math.max(1, target | 0);
  /* v152：「不要」的色 —— 用户手动标记，无视点缀色保护，无条件并入最接近的存活色。
     一两颗的孤立杂豆很容易被 v130 的点缀色识别（孤立 + 高反差）误当成
     「眼睛/高光」这类关键特征色保下来；但是不是关键色该由用户说了算，
     所以这个标记优先级最高：压过自动点缀识别，也压过「已少于目标」的提前返回。 */
  var ban = state.banned || {}, hasBan = false, qi;
  for (qi = 0; qi < st.list.length; qi++){ if (ban[st.list[qi].idx]){ hasBan = true; break; } }
  if (st.list.length <= target && !hasBan){
    toast("当前 " + st.list.length + " 色，已少于目标 " + target + " 色");
    return;
  }
  var lab = palLab();
  /* v130：保护色 = 手动锁定 ∪ 自动识别的点缀色 —— 不参与精简（v152：被「不要」标记的除外） */
  var pin = state.pinned || {};
  var acc = accentSet(st);
  var kept = [], forced = [];
  function isKept(idx){ return !ban[idx] && !!(pin[idx] || acc[idx]); }
  /* v130 重写合并顺序：不再「按用量升序砍最少的色」（眼睛、唇色这类小面积关键色必然先没），
     改成每轮挑「合并代价最小」的一对色合并（经典 pairwise merge）：
       cost = ΔE2000 + 0.6 × 该色占比%
     → 色差主导：相近的灰阶先合并；独特色（豹子眼睛紫 ΔE 22.8）排到最后，天然保住；
       同色差量级下面积小的先合（大块色不被拆）。 */
  var alive = [], nOf = {}, i;
  for (i = 0; i < st.list.length; i++){ alive.push(st.list[i].idx); nOf[st.list[i].idx] = st.list[i].n; }
  for (i = 0; i < alive.length; i++) if (isKept(alive[i])) kept.push(PALETTE[alive[i]].id);
  var total = st.total, map = {}, affected = 0, moved = [];
  function resolve(x){
    var guard = 0;
    while (map[x] !== undefined && map[x] !== x && guard++ < 999) x = map[x];
    return x;
  }
  /* v152：强制移除轮 —— 「不要」的色先并，且不看目标色数（哪怕已经达标也照并）。
     量少的先定：两个「不要」色挨在一起时，小的先挂到大的上，大的再整体并进正常色。 */
  var banList = [];
  for (i = 0; i < alive.length; i++) if (ban[alive[i]]) banList.push(alive[i]);
  banList.sort(function(a, b){ return nOf[a] - nOf[b]; });
  for (var bi = 0; bi < banList.length; bi++){
    var fa = banList[bi];
    if (alive.indexOf(fa) < 0) continue;          /* 已并进另一个「不要」色，稍后随它一起走 */
    var fBest = 1e18, fb = -1;
    for (i = 0; i < alive.length; i++){
      var fc = alive[i];
      if (fc === fa) continue;
      var fd = de2000(lab[fa][0], lab[fa][1], lab[fa][2],
                      lab[fc][0], lab[fc][1], lab[fc][2]);
      if (fd < fBest){ fBest = fd; fb = fc; }
    }
    if (fb < 0) break;                            /* 全场只剩它一个（不可能，画布非空） */
    map[fa] = fb;
    moved.push(PALETTE[fa].id + "\u2192" + PALETTE[fb].id);
    forced.push(PALETTE[fa].id + "\u2192" + PALETTE[fb].id);
    affected += nOf[fa];
    nOf[fb] += nOf[fa];
    alive.splice(alive.indexOf(fa), 1);
  }
  while (alive.length > target){
    var bestCost = 1e18, ba = -1, bb = -1;
    for (i = 0; i < alive.length; i++){
      var a = alive[i];
      if (isKept(a)) continue;                     /* 保护色：一个都不删 */
      var sharePct = nOf[a] / total * 100;
      for (var j = 0; j < alive.length; j++){
        if (j === i) continue;
        var b = alive[j];
        var d = de2000(lab[a][0], lab[a][1], lab[a][2],
                       lab[b][0], lab[b][1], lab[b][2]);
        var cost = d + 0.6 * sharePct;
        if (cost < bestCost){ bestCost = cost; ba = a; bb = b; }
      }
    }
    if (ba < 0) break;                             /* 剩下的全是保护色 */
    if (nOf[bb] < nOf[ba]){ var tmp = ba; ba = bb; bb = tmp; }   /* 少的并入多的 */
    map[ba] = bb;
    moved.push(PALETTE[ba].id + "\u2192" + PALETTE[bb].id);
    affected += nOf[ba];
    nOf[bb] += nOf[ba];
    alive.splice(alive.indexOf(ba), 1);
  }
  if (!moved.length){ toast("没有可精简的色号"); return; }
  beginChange();
  for (var t = 0; t < state.grid.length; t++){
    var v = state.grid[t];
    if (v > 0){
      var r = resolve(v - 1);
      if (r !== v - 1) state.grid[t] = r + 1;
    }
  }
  endChange();
  renderAll(); saveDraft();
  var cur = alive.length;
  var msg = "已精简 " + moved.length + " 个色号（" + st.list.length + " \u2192 " + cur +
        " 色），改动 " + affected + " 格";
  if (forced.length) msg += "\n强制移除（标记不要）：" + forced.slice(0, 6).join("、") + (forced.length > 6 ? " 等" : "");
  if (moved.length) msg += "\n" + moved.slice(0, 6).join("、") + (moved.length > 6 ? " 等" : "");
  if (kept.length) msg += "\n保留保护色 " + kept.length + " 个：" + kept.slice(0, 5).join("、") + (kept.length > 5 ? " 等" : "");
  if (cur > target) msg += "\n剩余都是保护色，无法再减到 " + target + " 色";
  toast(msg);
}

/* 从种子格 flood fill（8 邻域）得到非空连通区域掩码 */
function floodMask(seed){
  var g = state.grid, cols = state.cols, rows = state.rows;
  if (!g[seed]) return null;
  var mask = new Uint8Array(g.length), stack = [seed];
  mask[seed] = 1;
  while (stack.length){
    var j = stack.pop();
    var jx = j % cols, jy = (j - jx) / cols;
    for (var dy = -1; dy <= 1; dy++){
      for (var dx = -1; dx <= 1; dx++){
        if (!dx && !dy) continue;
        var nx = jx + dx, ny = jy + dy;
        if (nx < 0 || ny < 0 || nx >= cols || ny >= rows) continue;
        var ni = ny*cols + nx;
        if (mask[ni] || !g[ni]) continue;
        mask[ni] = 1; stack.push(ni);
      }
    }
  }
  return mask;
}
function dilateMask(m, k){
  var cols = state.cols, rows = state.rows, cur = m;
  for (var t = 0; t < k; t++){
    var nx = new Uint8Array(cur.length);
    for (var y = 0; y < rows; y++){
      for (var x = 0; x < cols; x++){
        var i = y*cols + x;
        if (cur[i]){ nx[i] = 1; continue; }
        var hit = 0;
        for (var dy = -1; dy <= 1 && !hit; dy++){
          for (var dx = -1; dx <= 1; dx++){
            if (!dx && !dy) continue;
            var ax = x + dx, ay = y + dy;
            if (ax < 0 || ay < 0 || ax >= cols || ay >= rows) continue;
            if (cur[ay*cols + ax]){ hit = 1; break; }
          }
        }
        if (hit) nx[i] = 1;
      }
    }
    cur = nx;
  }
  return cur;
}
function erodeMask(m, k){
  var inv = new Uint8Array(m.length);
  for (var i = 0; i < m.length; i++) inv[i] = m[i] ? 0 : 1;
  var d = dilateMask(inv, k);
  for (i = 0; i < m.length; i++) d[i] = d[i] ? 0 : 1;
  return d;
}
function applyOutline(mask, mode, thickness, colorVal){
  var g = state.grid, n = g.length, cnt = 0, i;
  if (mode === "outer"){
    var d = dilateMask(mask, thickness);
    for (i = 0; i < n; i++) if (d[i] && !mask[i]){ g[i] = colorVal; cnt++; }
  } else {
    var e = erodeMask(mask, thickness);
    for (i = 0; i < n; i++) if (mask[i] && !e[i]){ g[i] = colorVal; cnt++; }
  }
  return cnt;
}
/* 工具：点击图案 → 给该连通图案外描边 1 格 */
function outlineAt(i){
  var mask = floodMask(i);
  if (!mask){ toast("这里是空格子，点图案本体试试"); return false; }
  var cnt = applyOutline(mask, "outer", 1, state.colorIdx + 1);
  if (!cnt) toast("图案已贴边，没有可描边的位置");
  else toast("已描边 " + cnt + " 格：" + PALETTE[state.colorIdx].id + " " + PALETTE[state.colorIdx].n);
  return cnt > 0;
}
/* 去除背景色：清除与画布边缘连通的同色区域（不影响图案内部同色孤岛） */
/* v100：清空当前图层（原「去背景」——与橡皮·同色连片重复，见评估）。只清格子，图层结构与参考图保留，可撤销 */
function clearActiveLayer(){
  var L = activeLayer();
  if (!L) return;
  var has = false;
  for (var i = 0; i < L.grid.length; i++) if (L.grid[i]){ has = true; break; }
  if (!has){ toast("「" + L.name + "」已经是空的"); return; }
  beginChange();
  for (var k = 0; k < L.grid.length; k++) L.grid[k] = 0;
  endChange();
  renderGrid(); updateStats(); updatePaletteMarks(); renderLayerPanel(); saveDraft();
  toast("已清空「" + L.name + "」（可撤销）");
}

  beginChange();
  var g = state.grid, cols = state.cols, rows = state.rows, ng = new Array(g.length);

}

/* =========================================================
   草稿持久化
   ========================================================= */
var draftTimer = null;
/* 游程编码：10 层 × 200×200 的裸数组会把 localStorage 挤爆，
   图纸里大片同色很多，RLE 一般能压到 1/20 以下 */
function rleEncode(g){
  var out = [], i = 0, n = g.length;
  while (i < n){
    var v = g[i] | 0, j = i + 1;
    while (j < n && (g[j] | 0) === v) j++;
    out.push(v, j - i);
    i = j;
  }
  return out;
}
function rleDecode(a, n){
  var g = new Array(n), p = 0, i;
  for (i = 0; i < n; i++) g[i] = 0;
  for (i = 0; i + 1 < a.length; i += 2){
    var v = a[i] | 0, c = a[i + 1] | 0;
    while (c-- > 0 && p < n) g[p++] = v;
  }
  return g;
}
/* v84：参考图也要进草稿，但不能直接塞原图 —— 那是几 MB 的 base64，
   会把 localStorage（5MB 上限）撑爆，结果连图纸本身都存不进去。
   存的是一份「够描图用」的压缩副本（最长边 ≤1024 的 JPEG），并按引用缓存，
   避免每次自动保存都重编码一遍。 */
var refDraftCache = { img: null, data: "" };
function refDraftData(){
  /* v117：始终存原图 —— 暖肤版是算出来的，恢复时按 warmOn 重算 */
  var img = state.refOriginal || state.refImage;
  if (!img) return "";
  if (refDraftCache.img === img) return refDraftCache.data;
  var sizes = [1024, 768, 512], out = "";
  for (var s = 0; s < sizes.length && !out; s++){
    try{
      var iw = img.naturalWidth || img.width, ih = img.naturalHeight || img.height;
      if (!iw || !ih) break;
      var k = Math.min(1, sizes[s] / Math.max(iw, ih));
      var cv = document.createElement("canvas");
      cv.width = Math.max(1, Math.round(iw * k));
      cv.height = Math.max(1, Math.round(ih * k));
      var c = cv.getContext("2d");
      c.imageSmoothingEnabled = true; c.imageSmoothingQuality = "high";
      c.drawImage(img, 0, 0, cv.width, cv.height);
      var d = cv.toDataURL("image/jpeg", 0.82);
      if (d.length <= 900000) out = d;            /* 还是太大就换更小的尺寸再来 */
    }catch(e){ break; }
  }
  refDraftCache.img = img; refDraftCache.data = out;
  return out;
}
/* 恢复参考图：先让缩略图立刻显示，原图加载完再重画画布（与上传流程一致） */
function applyRefData(data){
  if (!data) return;
  state.refDataUrl = data;
  var im = new Image();
  im.onload = function(){
    state.refOriginal = im;
    refDraftCache.img = im; refDraftCache.data = data;   /* 复用，别再编码一次 */
    if (state.warmOn){
      warmSkinImage(im, function(w){
        state.refImage = w; state.refDataUrl = w.src;
        renderRef(); updateRefUI(); renderLayerPanel();
      });
    } else {
      state.refImage = im;
      renderRef();
      updateRefUI();
      renderLayerPanel();
    }
    state.skinOk = skinRatioThumb(im) >= SKIN_MIN;
    updateWarmUI();
  };
  im.src = data;
}
/* v80：把「当前画布 → 可存储对象」抽出来，草稿箱、工程文件与本地应急副本共用同一份格式 */
function draftSnapshot(){
  var ls = [], i;
  for (i = 0; i < state.layers.length; i++){
    var L = state.layers[i];
    ls.push({ n: L.name, k: L.kind, o: Math.round(L.opacity * 100),
              v: L.visible ? 1 : 0, l: L.locked ? 1 : 0, r: rleEncode(L.grid) });
  }
  return {
    cols: state.cols, rows: state.rows,
    ver: 2, layers: ls, active: state.active,
    curId: curDraftId,                    /* v83：刷新后仍在「编辑某份草稿」的状态也要记住 */
    name: projName,                       /* v97：图纸名跟着快照走（草稿箱/工程文件/导出都用它） */
    refVisible: state.refVisible ? 1 : 0,
    refOpacity: Math.round(state.refOpacity * 100),
    refOffX: Math.round(state.refOff.x), refOffY: Math.round(state.refOff.y),
    refData: refDraftData(),               /* v84：参考图（压缩副本）跟着草稿走 */
    refFitSave: state.refFit,
    zoom: state.zoom, colorIdx: state.colorIdx,
    showGrid: state.showGrid, showRulers: state.showRulers,
    gridAlign: state.gridAlign,      /* v87：主线分布跟着草稿走 */
    showCodes: state.showCodes,
    K: state.K,
    smooth: state.smooth,
    refFit: state.refFit,
    colorTarget: state.colorTarget,
    eraseMode: state.eraseMode,
    lockRatio: state.lockRatio,
    sourceMode: state.sourceMode || "auto",
    /* v117：只存开关，底图存的是原图 —— 恢复时按需重算暖肤，避免二次暖肤 */
    warmOn: state.warmOn ? 1 : 0,
    dither: state.dither !== false,
    ditherAmt: typeof state.ditherAmt === "number" ? state.ditherAmt : 30,
    palCollapsed: state.palCollapsed,
    pinned: state.pinned || {},                /* v130：锁定的色号（精简用色时保留） */
    banned: state.banned || {}                 /* v152：不要的色号（精简用色时强制并入） */
  };
}
/* v80：把草稿对象应用到当前画布（草稿箱打开 / 导入工程文件 / 识别落地 共用） */
function applyDraftData(d){
  var n, i;
  state.cols = clamp(d.cols | 0, 4, MAX_SIDE);
  state.rows = clamp(d.rows | 0, 4, MAX_SIDE);
  n = state.cols * state.rows;
  if (d.layers && d.layers.length){
    layerSeq = 0;
    state.layers = [];
    for (i = 0; i < d.layers.length && i < MAX_LAYERS; i++){
      var x = d.layers[i];
      var L = makeLayer(x.n || ("图层 " + (i + 1)), x.k === "pattern" ? "pattern" : "user",
                        rleDecode(x.r || [], n));
      L.opacity = clamp((typeof x.o === "number" ? x.o : 100) / 100, 0.15, 1);
      L.visible = x.v !== 0;
      L.locked = x.l === 1;
      state.layers.push(L);
    }
    if (!state.layers.length) initLayers(null);
    state.active = clamp(d.active | 0, 0, state.layers.length - 1);
    syncActiveGrid();
    if (typeof d.refVisible === "number") state.refVisible = d.refVisible !== 0;
    if (typeof d.refOpacity === "number") state.refOpacity = clamp(d.refOpacity / 100, 0.1, 1);
    if (typeof d.refOffX === "number") state.refOff.x = d.refOffX;
    if (typeof d.refOffY === "number") state.refOff.y = d.refOffY;
  } else {
    var g0 = new Array(n);
    for (i = 0; i < n; i++) g0[i] = (d.grid && d.grid[i]) || 0;
    initLayers(g0);
  }
  state.sourceMode = (d.sourceMode === "photo") ? "photo" : "pixel";
  if (typeof d.dither === "boolean") state.dither = d.dither;
  if (typeof d.ditherAmt === "number" && d.ditherAmt >= 10) state.ditherAmt = d.ditherAmt;
  /* v130：锁定的色号（精简用色时保留）；旧草稿没有这个字段 → 空集合 */
  state.pinned = (d.pinned && typeof d.pinned === "object") ? d.pinned : {};
  /* v152：不要的色号（精简用色时强制并入）；旧草稿没有 → 空集合 */
  state.banned = (d.banned && typeof d.banned === "object") ? d.banned : {};
  if (typeof d.zoom === "number") state.zoom = clamp(d.zoom, MIN_ZOOM, MAX_ZOOM);
  if (typeof d.colorIdx === "number") state.colorIdx = clamp(d.colorIdx, 0, PALETTE.length - 1);
  if (typeof d.showGrid === "boolean") state.showGrid = d.showGrid;
  if (typeof d.showRulers === "boolean") state.showRulers = d.showRulers;
  if (typeof d.showCodes === "boolean") state.showCodes = d.showCodes;
  /* v87：主线分布；旧草稿没有这个字段 → 保持默认居中 */
  state.gridAlign = (d.gridAlign === "start") ? "start" : "center";
  if (typeof d.K === "number") state.K = clamp(d.K, 8, 64);
  if (typeof d.colorTarget === "number") state.colorTarget = clamp(d.colorTarget, 6, 48);
  if (typeof d.smooth === "number") state.smooth = clamp(d.smooth, 0, 40);
  if (d.refFit === "cover" || d.refFit === "contain") state.refFit = d.refFit;
  state.warmOn = !!d.warmOn;                 /* v117：底图暖肤开关（原图由 applyRefData 恢复） */
  if (d.eraseMode === "cell" || d.eraseMode === "rect" || d.eraseMode === "region") state.eraseMode = d.eraseMode;
  if (typeof d.lockRatio === "boolean") state.lockRatio = d.lockRatio;
  if (d.palCollapsed && typeof d.palCollapsed === "object") state.palCollapsed = d.palCollapsed;
  /* v83：恢复「正在编辑哪份草稿」，否则切走时归档会另存出一份新的「上次的进度」 */
  curDraftId = (typeof d.curId === "number") ? d.curId : 0;
  /* v97：图纸名 —— 打开的草稿/工程文件带名字就用它的 */
  if (typeof d.name === "string" && d.name) setProjName(d.name);
  /* v84：参考图一起恢复（放在最后：依赖上面的尺寸与参考图设置都已就位） */
  applyRefData(d.refData);
}
/* 防抖写本地应急副本。⚠ 序列化永远走 draftSnapshot() —— v93 之前这里手抄过一份字段表
   （layers: ls 引用不存在的变量，抛错被 catch 吞掉），导致自动草稿从未写成功过。别再手抄。 */
function saveDraft(){
  clearTimeout(draftTimer);
  draftTimer = setTimeout(saveDraftNow, 400);
}
/* v93：本地这份只当「应急副本」，不再自动载入画布 —— 打开永远是新的，
   上次的进度去草稿箱点开。应急副本的唯一用途：草稿箱那份没存上时（闪退/强退）
   下次启动悄悄补进草稿箱。 */
function saveDraftNow(){
  clearTimeout(draftTimer);
  var snap = draftSnapshot();
  snap.savedAt = Date.now();
  try{
    localStorage.setItem(STORE_KEY, JSON.stringify(snap));
  }catch(e){
    /* 参考图副本可能把 5MB 撑爆：丢掉参考图再存一次，图纸本身一定要留住 */
    try{
      var slim = draftSnapshot();
      slim.refData = ""; slim.refDropped = 1; slim.savedAt = snap.savedAt;
      localStorage.setItem(STORE_KEY, JSON.stringify(slim));
    }catch(e2){}
  }
}
function readSession(){
  try{
    var raw = localStorage.getItem(STORE_KEY);
    if (!raw) return null;
    var d = JSON.parse(raw);
    if (!d || !d.cols || (!d.grid && !d.layers)) return null;
    return d;
  }catch(e){ return null; }
}

/* =========================================================
   草稿箱（v80）：IndexedDB 存多份 + 缩略图网格
   v93 起它是唯一的存取层：打开不自动恢复，用户点卡片才载入；
   切后台/关页面自动归档（见 bindSessionSave）。
   localStorage 那份只是应急副本（同步写、启动时若比草稿箱新就悄悄补进去，绝不载入画布）。
   ⚠ 全本地，不上传；iOS 可能清理浏览器存储，所以第二期补了工程文件导出。
   ========================================================= */
var DB_NAME = "bead-studio-db", DB_STORE = "drafts", MAX_DRAFTS = 20;
var db = null, dbBroken = false, curDraftId = 0;
function dbOpen(){
  return new Promise(function(res, rej){
    if (db){ res(db); return; }
    if (dbBroken || !window.indexedDB){ rej(new Error("no-idb")); return; }
    var rq, done = false;
    try{ rq = indexedDB.open(DB_NAME, 1); }catch(e){ dbBroken = true; rej(e); return; }
    /* 兜底：开库卡住（某些 WebView / 被其他标签占用）时不能让按钮「点了没反应」——
       超时就当作不可用，入口置灰 */
    var timer = setTimeout(function(){
      if (done) return; done = true; dbBroken = true; rej(new Error("idb-timeout"));
    }, 4000);
    function fail(err){ if (done) return; done = true; clearTimeout(timer); dbBroken = true; rej(err || new Error("idb")); }
    rq.onupgradeneeded = function(){
      var d = rq.result;
      if (!d.objectStoreNames.contains(DB_STORE)) d.createObjectStore(DB_STORE, { keyPath: "id", autoIncrement: true });
    };
    rq.onsuccess = function(){
      if (done) return; done = true; clearTimeout(timer); db = rq.result; res(db);
    };
    rq.onerror = function(){ fail(rq.error); };
    rq.onblocked = function(){ fail(new Error("idb-blocked")); };
  });
}
function dbTx(mode, fn){
  return dbOpen().then(function(d){
    return new Promise(function(res, rej){
      var tx = d.transaction(DB_STORE, mode), st = tx.objectStore(DB_STORE), out = fn(st);
      tx.oncomplete = function(){ res(out && out.result !== undefined ? out.result : out); };
      tx.onerror = function(){ rej(tx.error); };
    });
  });
}
function draftThumb(){
  var w = 240;
  var cv = document.createElement("canvas");
  var k = Math.max(state.cols, state.rows), s = w / k;
  cv.width = Math.max(1, Math.round(state.cols * s));
  cv.height = Math.max(1, Math.round(state.rows * s));
  var c = cv.getContext("2d");
  c.fillStyle = "#FFFFFF"; c.fillRect(0, 0, cv.width, cv.height);
  var cw = cv.width / state.cols, ch = cv.height / state.rows, li, x, y, v;
  for (li = 0; li < state.layers.length; li++){          /* 从底到顶，顶层最后画 */
    var L = state.layers[li];
    if (!L.visible) continue;
    c.globalAlpha = clamp(L.opacity, 0, 1);
    for (y = 0; y < state.rows; y++){
      for (x = 0; x < state.cols; x++){
        v = L.grid[y * state.cols + x];
        if (!v) continue;
        c.fillStyle = PALETTE[v - 1].h;
        c.fillRect(Math.floor(x * cw), Math.floor(y * ch), Math.ceil(cw), Math.ceil(ch));
      }
    }
  }
  c.globalAlpha = 1;
  try { return cv.toDataURL("image/jpeg", 0.72); } catch(e){ return ""; }
}
function draftCount(){ return dbTx("readonly", function(st){ return st.count(); }); }
function draftAll(){ return dbTx("readonly", function(st){ return st.getAll(); }); }
function draftSave(name){
  return draftCount().then(function(n){
    if (n >= MAX_DRAFTS) return Promise.reject(new Error("full"));
    var rec = draftSnapshot();
    rec.name = name || projName || ("图纸 " + (new Date().getMonth() + 1) + "-" + new Date().getDate());
    rec.thumb = draftThumb();
    rec.updatedAt = Date.now();
    delete rec.id;                        /* 「存为新草稿」永远新建，绝不悄悄覆盖 */
    return dbTx("readwrite", function(st){ return st.put(rec); }).then(function(id){
      curDraftId = id;
      return id;
    });
  }).then(function(id){
    saveDraftNow();               /* 顺手同步一份本地应急副本 */
    return id;
  });
}
function draftDel(id){
  return dbTx("readwrite", function(st){ return st.delete(id); }).then(function(){
    if (curDraftId === id) curDraftId = 0;
  });
}
/* 画布上到底有没有东西（有才值得保存 / 才需要问） */
function hasContent(){
  var i, j;
  for (i = 0; i < state.layers.length; i++){
    for (j = 0; j < state.layers[i].grid.length; j++) if (state.layers[i].grid[j]) return true;
  }
