/* =========================================================
   v164 骨架（用户点名要这一版）：三层结构、大圆角、无描边
     底层 = 淡灰页面；中层 = 面板层；顶层 = 白色内容（画布台）。
   分割线只出现在小节标题后面（sec-t 的延伸发丝线），控件之间全靠留白。
   顶栏（标题条）拎到窗口最上面横跨三栏，standalone 红绿灯只让出左侧一段。
   ========================================================= */
/* v203：画布顶条 —— 画布台内部顶端，左=看的比例 右=改的历史；
   左右内边距 20px 与面板内边距一致（沿用 v189 的对齐规则），高度由内容撑起 */
.stage-topbar{flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:6px 0;min-height:0}
.stage-topbar .ct-left{display:flex;align-items:center;gap:8px;min-width:0}
.stage-topbar .ct-right{display:flex;align-items:center;gap:6px;margin-left:auto}
.stage-topbar .dock-view{margin-left:0}
/* v188：四个大模块（顶部条 / 左 / 中 / 右）之间的间距统一 8px —— 外框 8、模块间 8，不再各有一套 */
html.skin-studio .app{padding:8px;gap:8px}
html.skin-studio .layout{background:transparent;border:none;box-shadow:none;gap:8px}
/* ② 中层：面板层 */
/* ② 中层：面板层 —— v190 半透明白 + 毛玻璃；v194 更透（.46）+ 模糊/饱和加强，
   并加一道顶部 1px 内高光（玻璃边缘的反光，不是描边）；画布台仍纯白不透明 */
html.skin-studio .panel{
  background:rgba(255,255,255,.10);border:none;border-radius:var(--r-lg);overflow:hidden;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.90),inset 0 0 0 1px rgba(255,255,255,.30);
  -webkit-backdrop-filter:blur(48px) saturate(170%);
  backdrop-filter:blur(48px) saturate(170%);
}
html.skin-studio .panel.right{border-radius:var(--r-lg)}
/* ③ 顶层：画布台（v198 起与面板同一套玻璃材质） */
html.skin-studio .stage-area{gap:0;padding:20px;background:rgba(18,24,38,.34);border-radius:var(--r-lg);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.90),inset 0 0 0 1px rgba(255,255,255,.30),
             0 8px 28px rgba(70,90,140,.10);
  -webkit-backdrop-filter:blur(32px) saturate(160%);
  backdrop-filter:blur(32px) saturate(160%);
}
html.skin-studio .stage-toolbar{
  flex:0 0 auto;background:transparent;border:none;box-shadow:none;border-radius:0;
  padding:0 20px;min-height:0;   /* v189：左右内边距 20px = 面板内边距（panel-body 实际生效的是后面的 padding:20px 规则），
     导出图纸右沿与色板最右对齐；高度由内容撑起，不设死 */
}
/* v186：标题块 —— 大名字在上，灰色小字副标在下，靠最左；动作组自然靠右 */
/* v189：标题行 —— 名字 + 作者/尺寸/色/豆同一行；信息之间用竖线分隔；行高 = 按钮高 30px */
.hd-block{display:flex;align-items:center;min-width:0;margin-right:auto}
.hd-block .proj-name{font-size:18px;font-weight:800;letter-spacing:.2px;padding:0;margin-left:2px;line-height:30px;height:30px}
.hd-block .proj-name:hover{background:transparent}
.hd-block .proj-name:focus{background:#fff}
.hd-sub{display:flex;align-items:center;font-size:12px;color:var(--ink3);white-space:nowrap;overflow:hidden;margin-left:12px}
.hd-sub .hd-item{border-left:1px solid var(--line2);margin-left:10px;padding-left:10px}
.hd-sub .hd-item:first-child{border-left:none;margin-left:0;padding-left:0}
.hd-sub .tb-author{font-size:12px;padding:0 2px}
/* v182：PWA 顶部拖拽条保险（标题行现在已在系统条下方，此规则保留作双保险） */
html.standalone .stage-toolbar,html.standalone .hd-block,html.standalone .proj-name{-webkit-app-region:no-drag;app-region:no-drag}
html.standalone.skin-studio .stage-toolbar{padding-left:20px}
html.tablet.standalone.skin-studio .stage-toolbar{padding-left:78px}   /* 平板顶栏仍在画布台里，红绿灯让位照旧 */
/* v188：standalone 不再让出 28px —— PWA 窗口自带那条标题栏（红绿灯在里面）独立占位，内容从它下面开始；
   v192：恢复 8px 上内边距（与全局 8px 间距系统一致）—— 全屏没有系统按钮时标题那一条不能贴着窗口上沿 */
html.standalone.skin-studio .app{padding-top:8px}
/* 画布主标题：v189 加大加粗，行高与右侧按钮一致（30px），整个顶栏由最高的内容撑起；
   margin-left 2px 对齐小节标题（sec-t 自带 2px 缩进），与「画布尺寸」同一竖线 */
html.skin-studio .proj-name{font-size:20px;font-weight:800;letter-spacing:.2px;padding:0;margin-left:2px;line-height:30px;height:30px}
html.skin-studio .panel-body{padding:18px 16px 28px}
html.skin-studio .card{background:transparent;border:none;padding:0}
html.skin-studio .tips{background:transparent;border:none;padding:0 2px}
/* 分割线的唯一形态：跟在小节标题后面的延伸发丝线（见下方间距块） */
html.skin-studio .sec-t{color:var(--ink3)}
/* 画布工作台（v168）：去掉灰色底框与圆角，画布直接铺在白台面上 */
html.skin-studio .canvas-wrap{
  gap:0;padding:0;margin:0;
  border:none;border-radius:0;
  background:transparent;overflow:visible;
}
html.skin-studio .layer-panel{
  flex:0 0 148px;width:148px;
  background:transparent;border:none;border-right:1px solid rgba(16,16,20,.06);
  border-radius:0;box-shadow:none;padding:12px 10px;
}
/* v205：图层在右栏里改成竖排「行式」—— 一行 = 缩略图 · 名称 · 眼睛 · 锁 · 不透明度 · 上移/下移，
   选中行下方再展开一行（复制 · 向下合并 · 删除）。不要独立详情条。
   只在右栏里生效：没搬（平板）时仍用上面的竖条样式。 */
html.skin-studio .panel.right .layer-panel{
  flex:0 0 auto;width:auto;height:auto;min-height:0;
  background:transparent;border:none;box-shadow:none;border-radius:0;
  padding:0 0 12px;margin:0 0 20px;border-bottom:none;
}
html.skin-studio .panel.right .lp-list{
  flex:0 0 auto;flex-direction:column;gap:6px;overflow-y:auto;overflow-x:hidden;max-height:230px;
}
html.skin-studio .panel.right .lp-item{
  flex:0 0 auto;width:100%;display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:6px 8px;
}
html.skin-studio .panel.right .lp-thumb{flex:0 0 36px;width:36px;height:36px}
/* v209：左中右 —— 左缩略图 · 中名称（flex 收放，最长「图层 10」也不会挤到右侧）· 右功能区竖列 */
html.skin-studio .panel.right .lp-name{flex:1 1 0;min-width:0;max-width:none;margin-top:0}
html.skin-studio .panel.right .lp-fcol{flex:0 0 96px;display:flex;flex-direction:column;gap:6px}
html.skin-studio .panel.right .lp-fbtns{display:flex;gap:4px;justify-content:flex-end;align-self:stretch}
html.skin-studio .panel.right .lp-fbtns:empty{display:none}
html.skin-studio .panel.right .lp-mini{flex:0 0 20px;width:20px;height:20px;padding:0;color:var(--ink2)}
html.skin-studio .panel.right .lp-mini:hover{background:rgba(17,17,20,.07);color:var(--ink)}
html.skin-studio .panel.right .lp-mini[disabled]{color:var(--ink3)}
html.skin-studio .panel.right .lp-fcol .lp-op-range{width:100%;height:3px;min-width:0}
html.skin-studio .panel.right .lp-fcol .lp-op-range::-webkit-slider-runnable-track{height:3px;background:rgba(17,17,20,.06);border-radius:2px}
html.skin-studio .panel.right .lp-fcol .lp-op-range::-webkit-slider-thumb{margin-top:-5px}
html.skin-studio .panel.right .lp-fcol .lp-op-range::-moz-range-track{height:3px;background:rgba(17,17,20,.06);border-radius:2px}
html.skin-studio .panel.right .lp-badge,
html.skin-studio .panel.right .lp-sel,
html.skin-studio .panel.right .lp-merge-sel{display:none}
html.skin-studio .panel.right .lp-acts{flex:0 0 100%;border-top:none;margin-top:2px;padding-top:4px}
html.skin-studio .panel.right .lp-mv{color:var(--ink2)}
html.skin-studio .panel.right .lp-mv[disabled]{cursor:not-allowed}
html.skin-studio .lp-head{padding:0 2px 10px;font-size:var(--fs-xs);font-weight:600;letter-spacing:.5px;color:var(--ink3)}
html.skin-studio .canvas-stack{border-radius:0;box-shadow:0 1px 2px rgba(16,16,20,.08),0 6px 18px rgba(16,16,20,.08)}
/* 底部悬浮工具条：收成一枚胶囊 */
html.skin-studio .dock{
  margin:0 auto 12px;border-radius:var(--r-pill);padding:5px 8px;
  background:rgba(255,255,255,.94);border:1px solid rgba(16,16,20,.08);
  box-shadow:0 2px 6px rgba(16,16,20,.06),0 10px 24px rgba(16,16,20,.10);
}
html.skin-studio .dock-tools{gap:2px}
/* ③ 数据模块（v178）：三个字段同属一个模块 —— 合进一张白卡，白底黑字、
   上灰标签下墨色数值、无任何分割线（参考用户提供的卡片式数据样式） */
html.skin-studio .stat-sum{
  gap:0 16px;margin-bottom:16px;
  background:#fff;border-radius:var(--r-lg);padding:14px 16px;
}
html.skin-studio .stat-pill{
  background:transparent;border:none;border-radius:0;padding:0;text-align:left;
}
html.skin-studio .stat-pill b{color:var(--ink);font-size:17px;margin-top:4px;letter-spacing:.2px}
html.skin-studio .stat-pill span{font-size:var(--fs-xs)}
/* 平板态旧规则（html.tablet .panel.right[data-mode] .stat-pill）特异性更高，这里对齐回去 */
html.tablet.skin-studio .panel.right .stat-pill{padding:0}
/* v178：图例 chip 一行两个 —— 一行三个时四、五位数会把锁/不要图标挤出框；
   去掉描边胶囊，数量列右对齐并可截断，图标永不被动 */
html.skin-studio .stat-list{grid-template-columns:repeat(3,1fr);gap:5px}
html.skin-studio .stat-chip{
  border:none;border-radius:var(--r-pill);padding:6px 10px;background:#fff;
}
/* v183：数量紧跟色号（不再右飘），锁/不要固定靠右；图标加深不再若有若无 */
html.skin-studio .stat-chip .ct{
  flex:0 0 auto;margin-left:auto;
  white-space:nowrap;
}
@media (hover: hover){
  html.skin-studio .stat-chip:hover .pin,html.skin-studio .stat-chip:hover .ban{opacity:1}
}
/* ④ 近黑主按钮 */
html.skin-studio .btn.primary,
html.skin-studio .btn.grad{
  background:#111114;color:#fff;border-color:#111114;
  box-shadow:0 1px 2px rgba(16,16,20,.16);
}
@media (hover: hover){
  html.skin-studio .btn.primary:hover,
  html.skin-studio .btn.grad:hover{background:#000;border-color:#000;box-shadow:0 2px 8px rgba(16,16,20,.20)}
}
@media (hover: hover){
  html.skin-studio .btn.act:hover{background:var(--fill-strong);border-color:transparent}
}
html.skin-studio .segbar,html.skin-studio .seg,html.skin-studio .zoom-box,html.skin-studio .dim-field{background:var(--fill-recess)}
html.skin-studio .tool:hover{background:var(--fill-raised)}
html.skin-studio .seg-b.active{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(16,16,20,.10)}
html.skin-studio .modal{border-radius:var(--r-lg);box-shadow:0 20px 50px rgba(16,16,20,.16)}
/* v185：上传框文字改灰色小字，去掉白底填充感 */
html.skin-studio .dropzone span{font-size:12px;font-weight:500;color:var(--ink3)}
@media (hover: hover){
  html.skin-studio .dropzone:hover{background:transparent;border-color:var(--line);transform:none}
}

/* =========================================================
   v164：间距与控件 —— 参考图的语言：大量留白 + 只跟标题的分割线
   ========================================================= */
html.skin-studio .panel.left .sec{margin-bottom:32px}
html.skin-studio .sec-t{margin:0 0 14px 2px;font-size:var(--fs-xs);font-weight:600;letter-spacing:.8px}
/* 控件之间的旧分割线全部退场，改用留白 */
html.skin-studio .card + .card{border-top:none;margin-top:16px;padding-top:0}
/* 面板上的控件以白色为底（参考图：灰侧栏上的白色胶囊/输入） */
html.skin-studio .dim-field{height:32px;background:#fff}
html.skin-studio .dim-field span{width:22px}
html.skin-studio .segbar,html.skin-studio .seg{background:#E4E4E9}
html.skin-studio .dropzone{background:transparent; border:1px dashed var(--line); border-radius:var(--r-md); padding:12px 10px;}
html.skin-studio .dropzone:hover span{color:var(--ink)}
html.skin-studio .ref-thumb{background-color:#fff;}
html.skin-studio .stage-area{position:relative}
html:not(.tablet).skin-studio .dock{
  position:absolute;left:50%;transform:translateX(-50%);bottom:14px;z-index:8;margin:0;
  border-radius:var(--r-pill);padding:5px 8px;
  background:rgba(16,22,36,.55);border:1px solid rgba(242,244,248,.10);
  box-shadow:0 12px 32px rgba(0,0,0,.35);
  backdrop-filter:blur(28px) saturate(150%);-webkit-backdrop-filter:blur(28px) saturate(150%);
}
/* v184：窄窗口工具坞不再折成两行挤在胶囊里 —— 单行横向滑动（隐藏滚动条） */
@media (max-width:1280px){
  html.skin-studio .dock{border-radius:var(--r-pill);padding:5px 10px}
  html.skin-studio .dock-tools{
    flex-wrap:nowrap;overflow-x:auto;justify-content:flex-start;
    -webkit-overflow-scrolling:touch;scrollbar-width:none;
  }
  html.skin-studio .dock-tools::-webkit-scrollbar{display:none}
  html.skin-studio .dock-tools .tool,html.skin-studio .dock-tools .btn{white-space:nowrap;flex:0 0 auto}
}
/* 黑色 CTA 上下各让出一口气 */
html.skin-studio .panel.left .btn.block{margin-top:6px}

/* =========================================================
   v171：间距即规范（用户反馈：呼吸感靠间距规则，不靠字号）
     · 字号回调到基准档；只有区块标题加大（14px 墨色），标题后的分割线去掉
     · 面板内纵向间距统一 16px 一档，不再忽大忽小
     · 按钮分级定高：普通 36 / 顶栏 sm 30 / 面板块级副按钮 40、主 CTA 44；全站胶囊
   ========================================================= */
/* 区块标题：墨色、加重、再大一号；后面什么都不加 */
html.skin-studio .sec-t{margin:0 0 12px 2px;font-size:14px;font-weight:650;color:var(--ink);letter-spacing:.2px}
html.skin-studio .sec-t::after{content:none; flex:1; height:1px; background:var(--line2); margin-left:10px; opacity:.9;}
html.skin-studio .sec-t .sub{margin-left:0; letter-spacing:0; display:none;}
/* 字段小标题：灰、小一号 */
html.skin-studio label.f{font-size:var(--fs-sm);font-weight:500;color:var(--ink3);margin-bottom:10px}
/* 间距：面板内所有纵向相邻元素统一 16px；区块之间 28（v181 由 36 收窄） */
html.skin-studio .panel-body{padding:20px}
html.skin-studio .panel.left{border-radius:var(--r-lg); width:292px; flex:0 0 292px;}
html.skin-studio .panel.left .sec{margin-bottom:28px}
html.skin-studio .panel.right .sec{margin-bottom:28px}
html.skin-studio .grp > * + *{margin-top:16px;}
html.skin-studio .fld + .fld{margin-top:16px}
html.skin-studio .grp + .grp{border-top:none; margin-top:16px; padding-top:0;}
html.skin-studio .card + .card{margin-top:16px}
/* 按钮规范：主黑副白，全站胶囊，同级同高 */
html.skin-studio .btn{border-radius:var(--r-pill);font-size:var(--fs-base);height:36px;padding:0 18px}
html.skin-studio .btn.xs{height:26px;padding:0 10px;font-size:var(--fs-sm)}
html.skin-studio .btn.primary,
html.skin-studio .btn.grad{background:#111114;color:#fff;border-color:transparent;box-shadow:none}
@media (hover: hover){
  html.skin-studio .btn.primary:hover,
  html.skin-studio .btn.grad:hover{background:#000;border-color:transparent;box-shadow:none}
}
@media (hover: hover){
  html.skin-studio .btn.act:hover{background:#FAFAFB;border-color:transparent}
}
/* v193：顶栏二级按钮改纯白 + 轻投影 —— 顶栏现在是玻璃底，F4F4F6 和底色几乎融为一体看不见了 */
html.skin-studio .stage-toolbar .btn.act{background:#fff;border-color:transparent;box-shadow:0 1px 3px rgba(16,16,20,.08)}
@media (hover: hover){
  html.skin-studio .stage-toolbar .btn.act:hover{background:#fff;border-color:transparent;box-shadow:0 2px 6px rgba(16,16,20,.12)}
}
html.skin-studio .stage-toolbar .tb-right .btn{border-radius:var(--r-pill)}
/* 面板块级：v185 副按钮改小档 30，主次只靠颜色区分（主 CTA 仍 44 黑） */
html.skin-studio .panel.left .btn.block{height:32px;padding:0 14px;font-size:var(--fs-base)}
html.skin-studio .panel.left .btn.grad.block{height:44px;font-size:var(--fs-md)}
/* 控件与按钮同档 */
html.skin-studio .dim-field{height:32px}
html.skin-studio .zoom-box button{width:26px;height:26px}
/* 预设 chips 统一胶囊 */
html.skin-studio .preset{border-radius:var(--r-pill);padding:7px 0;font-size:var(--fs-md)}
/* 滑块：裸 input 没有纵向 margin，补齐与整体一致的节奏（v174） */
html.skin-studio .fld input[type=range]{margin:12px 0 16px}
/* 选中态去蓝（v175）：studio 皮肤激活色 = 黑，与主按钮同一语言。
   开关/预设 chip/锁比例/工具激活沿用老皮肤的蓝（--accent/--blue-l），在灰黑体系里全是突兀的高亮 */
html.skin-studio .sw input:checked + .track{background:#111114}
html.skin-studio .lock-btn.active{background:#ECECEF;color:#111114}
html.skin-studio .drawer-btn.active{background:#ECECEF;color:#111114}
html.skin-studio .pen-toggle.active{background:#ECECEF;color:#111114}
@media (hover: hover){
  html.skin-studio .preset.active:hover{background:#E2E2E7;border-color:#E2E2E7;color:#000}
  html.skin-studio .lock-btn.active:hover{background:#E2E2E7;color:#000}
}
/* =========================================================
   v208 · UI 规范落地（规则见 TOKENS.md / ui-kit.html）
   颜色去蓝 · 图标笔触视觉 1.5px · 组件统一 · 材质分级 · 字号档位
   全部集中在本块，便于回溯与整体回退
   ========================================================= */
/* —— 字号与间距档位 —— */
html.skin-studio{
  --fs-sm:12px; --fs-md:13px; --fs-base:13px; --fs-lg:15px; --fs-xl:17px; --fs-2xl:22px;
  --s2:10px; --s3:16px; --s4:20px; --s5:32px;
  --r-lg:18px; --r-md:16px; --r-ctl:10px; --r-sm:10px; --r-xs:10px;
}
html.skin-studio body{font-size:var(--fs-base)}
/* 区块/小节标题升到 17 */
/* v215：二级标题统一 15px / 500 / 主文字色 —— 旧规则里它还是灰色且字号各不同 */
html.skin-studio .sec-t,
html.skin-studio .sec-t span{font-size:15px;font-weight:500;color:var(--ink);letter-spacing:.2px}
/* 图纸名 22，行高与按钮（32）等高 */
html.skin-studio .hd-block .proj-name,
html.skin-studio .proj-name{font-size:22px;line-height:32px;height:32px}
/* 按钮统一 32 高 / 13 字号 */
html.skin-studio .btn.sm{height:32px;padding:0 14px;font-size:var(--fs-base)}
/* 区块间距 32 */
html.skin-studio .panel.left .sec,
html.skin-studio .panel.right .sec{margin-bottom:32px}

/* —— 颜色去蓝：选中态一律中性 —— */
html.skin-studio .panel.right .lp-item{background:transparent;border:1px solid rgba(17,17,20,.14);border-radius:var(--r-md)}
html.skin-studio .panel.right .lp-item.active{
  background:#fff;color:var(--ink);border-color:transparent;
}
html.skin-studio .rec-btn.active b{color:var(--ink)}
html.skin-studio .lp-mini.on{color:var(--ink)}
html.skin-studio .lp-add:hover{background:#111114;border-color:#111114;color:#fff}
html.skin-studio .lp-item.drop-before{box-shadow:0 -2px 0 0 #111114}
html.skin-studio .lp-item.drop-after{box-shadow:0 2px 0 0 #111114}
html.skin-studio .segbar button:focus-visible{outline:2px solid #111114;outline-offset:1px}
html.skin-studio .tb-author:focus,
html.skin-studio .proj-name:focus{box-shadow:0 0 0 1.5px #111114}
html.skin-studio .lp-sel{accent-color:#111114}
html.skin-studio .lp-merge-sel{background:#111114}
html.skin-studio .lp-merge-sel:hover{background:#000}
html.skin-studio .stat-chip.hl .code,
html.skin-studio .stat-chip.hl .ct{color:var(--ink)}

/* —— 图标：视觉笔触 ≈1.1px（24 网格 → CSS = 1.1 × 24 ÷ 渲染尺寸） —— */
html.skin-studio .ic{stroke-width:1.7}          /* 视觉 ≈1.1px（2.25 粗、1.9 略粗、1.7 细） */
html.skin-studio .ic.sm{stroke-width:1.9}
html.skin-studio .dock-tools .ic{width:16px;height:16px;stroke-width:1.7}
html.skin-studio .lp-mini .ic,
html.skin-studio .lp-act .ic,
html.skin-studio .lp-add .ic{width:14px;height:14px;stroke-width:1.9}
html.skin-studio .ref-del .ic{width:14px;height:14px;stroke-width:1.9}

/* —— 填充改半透明：玻璃面板上不再放实心灰块 ——
   凹陷（分段底、滑块槽）= 半透明暗调；凸起/选中（行、工具、预设、输入）= 半透明白 */
html.skin-studio{
  --fill-recess:rgba(17,17,20,.055);
  --fill-raised:rgba(242,244,248,.10);
}
html.skin-studio .btn.quiet:hover{background:var(--fill-raised)}
html.skin-studio .lp-item.active{background:var(--fill-raised)}
html.skin-studio .tool.active,
html.skin-studio .tool.active:hover{background:var(--fill-raised); color:var(--ink); box-shadow:none;}
html.skin-studio .rec-btn.active{background:var(--fill-raised); border-color:transparent; color:var(--ink);}
html.skin-studio .lock-btn.active,
html.skin-studio .drawer-btn.active,
html.skin-studio .pen-toggle.active{background:var(--fill-raised)}
/* 选中：白底 + 轻浮起（面板本身是白玻璃，白底单靠底色不够，阴影让它"浮"出来） */
html.skin-studio .stat-chip.hl{background:#fff;border-color:transparent;box-shadow:none}
html.skin-studio .stat-chip.hl .ct{color:var(--ink)}
/* 锁定：暖棕加粗实线框（虚线太弱）；不要：色号划掉 + 整体变淡 */
/* hover 时「⋮」在 chip 内部右侧显现、数量让位（不外挂 → 不被 chip 的 overflow:hidden 裁掉） */
html.skin-studio .ref-move button:active{background:var(--fill-raised); color:var(--ink); border-color:transparent;}
html.skin-studio .lock-btn{background:transparent; width:32px; height:32px; color:var(--ink2);}
/* 图层卡操作条：虚线分隔改发丝实线 */
html.skin-studio .lp-acts{border-top:1px solid rgba(17,17,20,.14)}
/* 滑块槽用暗调半透明，不再压一块灰 */

/* —— 组件 —— */
/* 次按钮去投影 */
html.skin-studio .stage-toolbar .btn.act{box-shadow:none}
/* 分段控件：单层浅底 + 选中白胶囊 */
html.skin-studio .segbar{border-radius:var(--r-sm);padding:3px;gap:2px}
html.skin-studio .segbar button.active{background:#fff; box-shadow:0 1px 3px rgba(16,16,20,.10);}
/* 滑块：轨道 4px、拇指 14 */
/* 图例 chip：白底轻投影、圆角 16、色号与数量同 15px 只分灰黑 */
html.skin-studio .stat-chip{
  position:relative;background:transparent;border:1px solid rgba(17,17,20,.14);border-radius:var(--r-sm);
  box-shadow:none;padding:5px 6px;gap:4px;min-width:0;transition:background .14s,box-shadow .14s;
}
@media (hover: hover){
  html.skin-studio .stat-chip:hover{background:rgba(255,255,255,.55);border-color:transparent}
  html.skin-studio .stat-chip.hl:hover{background:#fff;border-color:transparent}
}
html.skin-studio .stat-chip .code{flex:0 0 auto; font-size:12px; font-weight:600;}
html.skin-studio .stat-chip .ct{font-size:var(--fs-xs);color:var(--ink3);margin-left:auto}
html.skin-studio .stat-chip .chip{border-radius:var(--r-xs); width:9px; height:9px; border:.5px solid rgba(0,0,0,.14);}
/* 色板色块选中：白隔层 + 1.5px 黑环 */
html.skin-studio .pal .sw2.active{border:none;box-shadow:0 0 0 2px #fff}
/* 材质分级：画布台实白（玻璃只留给面板） */
html.skin-studio .stage-area,html.skin-studio .canvas-scroll,
html.skin-studio .canvas-stack,html.skin-studio .canvas-stack canvas{
  user-select:none;-webkit-user-select:none;-webkit-user-drag:none;
}
html.skin-studio .stage-area{
  background:rgba(18,24,38,.34);
  -webkit-backdrop-filter:blur(32px) saturate(160%);
  backdrop-filter:blur(32px) saturate(160%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.75),0 8px 28px rgba(70,90,140,.10);
}
/* =========================================================
   v216 · 控件规格统一（用户逐条反馈）
   1) 顶栏上边距 8 → 16px（全屏时露出系统按钮的位置）
   2) 小节标题（画布尺寸 ↔ 图层）到内容的间距统一 12px
   3) 二级按钮 = 纯白实底：缩放图案/局部细化/精简用色/草稿箱不再透底
   4) 预设（52²/78²/104²/自适应）：去描边去胶囊，高 32 / 圆角 10 / 字号 13，
      与其它二级按钮同高——同等级按钮只差宽度
   5) 非按钮控件圆角统一 10：分段容器/橡皮菜单/缩放步进器/宽高输入
   6) 分段按钮高 26（容器 3+26+3 = 32），与按钮同高
   ========================================================= */
html.standalone.skin-studio .app{padding-top:40px}   /* 系统按钮（红黄绿灯）高约 30px，40 起步不重叠 */
html.skin-studio .sec-t{margin:0 0 12px 2px}
html.skin-studio .panel-body,
html.skin-studio .panel.right .lp-list{scrollbar-width:none}
html.skin-studio .panel-body::-webkit-scrollbar,
html.skin-studio .panel.right .lp-list::-webkit-scrollbar,
html.skin-studio .canvas-scroll::-webkit-scrollbar{display:none}
html.skin-studio .canvas-scroll{background-color:transparent; border:none; border-radius:0; box-shadow:none; background-image:none; scrollbar-width:none;}
html.skin-studio .panel.right .lp-head{padding:0 0 12px; font-size:var(--fs-lg); font-weight:500; color:var(--ink);}
html.skin-studio .btn.act{background:#fff; border-color:transparent; color:var(--ink);}
html.skin-studio .btn.act:hover{background:#F7F7F9}
html.skin-studio .presets{
  display:flex;gap:4px;background:var(--fill-recess);
  border-radius:var(--r-sm);padding:3px;
}
html.skin-studio .preset{border:none; background:transparent; border-radius:8px; height:26px; padding:0; flex:1 1 0; font-size:var(--fs-base); font-weight:500; display:flex; align-items:center; justify-content:center; color:var(--ink2);}
html.skin-studio .preset:hover{background:transparent;color:var(--ink);border-color:transparent}
html.skin-studio .preset.active,
html.skin-studio .preset.active:hover{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(16,16,20,.10);font-weight:600}
html.skin-studio .preset.active{background:#fff; border-color:transparent; color:var(--ink); box-shadow:0 1px 3px rgba(16,16,20,.10); font-weight:600;}
html.skin-studio .seg{border-radius:var(--r-sm)}
html.skin-studio .zoom-box{background:var(--fill-raised); border-radius:var(--r-sm);}
html.skin-studio .dim-field{background:var(--fill-raised); border-radius:var(--r-sm);}
html.skin-studio .segbar{background:var(--fill-recess); border-radius:var(--r-sm);}
html.skin-studio .segbar button{border-radius:8px; font-size:var(--fs-base); height:26px; padding:0 4px;}
html.skin-studio .seg-b{height:26px;padding:0 12px}
/* =========================================================
   v220 · 色板滚动抖动修复
   原 .sw2 用 aspect-ratio:1 + 1fr 网格 → 算出 28.75 这类小数行高，
   滚动重绘时行边界跳子像素（"间距上缩一下"）。改成固定整数行高。
   ========================================================= */
html.skin-studio .pal{grid-auto-rows:28px}
html.skin-studio .pal .sw2{aspect-ratio:auto;height:100%;width:100%}

/* =========================================================
   v241 · 背景皮肤选择器（左栏底部）
   ========================================================= */

/* 平板图层行圆角同步 PC（16）：放在末尾，避免被前面的 .lp-item 基础规则盖掉 */
html.tablet .layer-panel .lp-item{border-radius:var(--r-md)}

/* v256 · 图例二级气泡（锁定/不要）：右键 chip 弹出 */
.chip-pop{position:fixed;z-index:80;background:#fff;border:1px solid rgba(17,17,20,.10);
  border-radius:var(--r-md);box-shadow:0 10px 28px rgba(0,0,0,.16),0 2px 6px rgba(0,0,0,.08);
  padding:6px;display:flex;flex-direction:column;gap:3px;min-width:104px}
.chip-pop button{border:none;background:transparent;border-radius:var(--r-sm);
  padding:8px 10px;font-size:var(--fs-base);color:var(--ink);cursor:pointer;text-align:left;
  transition:background .14s}
.chip-pop button:hover{background:rgba(17,17,20,.06)}
.chip-pop button.on{background:rgba(17,17,20,.14);font-weight:600}
/* v327：草稿箱弹窗暗色适配（暗底白字，草稿卡/删除/关闭全套） */
html.skin-studio .modal-mask:has(.draft-box){background:rgba(4,8,16,.55)}
html.skin-studio .draft-box{background:rgba(22,28,44,.94);color:#F2F4F8;

/* =========================================================
   v290 · 暗色主题覆盖块（背景图换深蓝绸缎后整体反转）
   原则：大面积=暗玻璃；文字=白色系按透明度分层；小面积强调=实色反转（白底深字）；
   画布本体保持白色（拼豆图纸白底）。所有规则集中在块尾，级联优先级最高。
   ========================================================= */
html.skin-studio{
  --ink:#F2F4F8;                       /* 主文字：近白 */
  --ink2:rgba(242,244,248,.78);        /* 次要：白 78% */
  --ink3:rgba(242,244,248,.68);        /* 三级/说明：白 68% */
  --ink4:rgba(242,244,248,.38);
  --line:rgba(242,244,248,.14);
  --line2:rgba(242,244,248,.20);
  --hover:rgba(255,255,255,.10);
  --fill-recess:rgba(242,244,248,.06);    /* seg 容器凹底（v292：透明感） */
  --warn:#F0A860;
}
/* 面板/画布台/工具条：暗玻璃 */
html.skin-studio .panel{
  background:rgba(18,24,38,.46);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.14),inset 0 0 0 1px rgba(255,255,255,.08),
             0 10px 32px rgba(0,0,0,.35);
  backdrop-filter:blur(32px) saturate(150%);
  -webkit-backdrop-filter:blur(32px) saturate(150%);
}
html.skin-studio .stage-area{
  background:rgba(18,24,38,.34);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.12),inset 0 0 0 1px rgba(255,255,255,.07),
             0 10px 32px rgba(0,0,0,.30);
}
/* 画布本体保持白色（图纸白底不动），画布外的台面是暗玻璃 */
html.skin-studio .canvas-stack{background:rgba(253,253,253,.40);border-radius:12px;overflow:hidden;box-shadow:none;border:0;outline:1px solid rgba(242,244,248,.10);outline-offset:0}   /* v362：border 会吃内容区→canvas 右/下被裁，改 outline */
/* 信息组：竖线分隔改白色系 */
html.skin-studio .hd-sub .hd-item{border-left:1px solid rgba(242,244,248,.18)}
html.skin-studio .tb-info .hd-item.tb-label{font-weight:400;color:rgba(242,244,248,.55)}
/* seg / 开关 / 锁定按钮 / 工具激活：反转 */
html.skin-studio .segbar,html.skin-studio .seg{background:rgba(242,244,248,.06)}
html.skin-studio .segbar button{color:rgba(242,244,248,.78)}
html.skin-studio .segbar button.active{background:rgba(242,244,248,.92);color:#141A26;box-shadow:0 1px 3px rgba(0,0,0,.4)}
html.skin-studio .seg-b.active{color:#141A26}   /* v292：橡皮二级等 seg-b 选中=白底深字（ink 已反转，白底白字看不清） */

html.skin-studio .sw .track::after{background:#141A26}   /* v331：关闭态球=深色（明暗对比，只靠位置区分不够） */

html.skin-studio .lock-btn.active,
html.skin-studio .drawer-btn.active,
html.skin-studio .pen-toggle.active{background:rgba(242,244,248,.16);color:#F2F4F8}
html.skin-studio .fld input[type=range]{background:rgba(242,244,248,.16)}
html.skin-studio .panel.right .lp-fcol .lp-op-range::-webkit-slider-runnable-track{background:rgba(242,244,248,.16)}
html.skin-studio .panel.right .lp-fcol .lp-op-range::-moz-range-track{background:rgba(242,244,248,.16)}
/* 图例 chip：未选中=白 8% 底白字；选中=白底深字（反转后依然清晰） */

/* 色板：分组标题 hover、色块描边 */

/* =========================================================
   v291 · 暗色主题补充：dock 工具条 / 尺寸输入 / 预设 chip / 图层操作条 / 顶栏按钮
   （v290 遗漏的亮色写死控件，按「大面积暗玻璃、文字白系、强调=白实底」原则补齐）
   ========================================================= */

/* 画布尺寸输入框：凹底 + 白字 */

/* v355：原生数字微调按钮无法单独改色（要么整块白底、要么整块消失）——

  width:18px;height:12px;padding:0;border:none;background:transparent;

  color:rgba(242,244,248,.7);-webkit-tap-highlight-color:transparent}
html.skin-studio .num-step button:hover,html.skin-studio .num-step button:active{color:#F2F4F8}
html.skin-studio .num-step button svg{width:10px;height:10px;display:block}
html.skin-studio input[type=number]{padding-right:22px}
   /* v354：invert 移除（color-scheme:dark 已接管） */

/* 图层操作条按钮：白玻璃描边 + 白图标（hover 提亮） */

/* v297 · 暗色补充：dock 图标 hover / 新建图层圆钮 */

/* =========================================================
   v336 · iPad 细节修复 + 边距规范统一
   1 点击闪动 2 图层箭头截断 3 去快捷键提示 4 左栏选中态截断

html.tablet button,html.tablet .lp-act,html.tablet .lp-add,html.tablet .tool,
html.tablet .pad-t,html.tablet .dock-ico{-webkit-tap-highlight-color:transparent;outline:none}
/* 图层操作按钮（新建/复制/合并/删除）暗色 + 触摸态 */
html.tablet.skin-studio .lp-act{background:rgba(242,244,248,.08);color:rgba(242,244,248,.8);border-color:rgba(242,244,248,.16)}
html.tablet.skin-studio .lp-act:active,html.tablet.skin-studio .lp-act.on{background:rgba(242,244,248,.22);color:#F2F4F8}
html.tablet.skin-studio .lp-act.danger{color:#F07060}
html.tablet.skin-studio .lp-act.danger:active{background:rgba(240,112,96,.18);color:#F07060;border-color:transparent}

/* 2. 图层上下移动箭头完整展示（取消裁切/压缩） */
html.tablet .lp-item,html.tablet .lp-fcol,html.tablet .lp-acts,
html.tablet .lp-list,html.tablet .layer-panel{overflow:visible}
html.tablet .lp-item .ic,html.tablet .lp-mv .ic{flex:none;overflow:visible}
html.tablet .lp-act .ic,html.tablet .lp-add .ic{flex:none}

/* 3. iPad 去掉所有快捷键提示 */
html.tablet .kbd,html.tablet .shortcut,html.tablet .tool .kbd,
html.tablet .dock-ico .kbd,html.tablet .tl .kbd,html.tablet .lp-item .kbd{display:none !important}

/* 4. 左栏工具选中态不截断（与右栏一致：内缩圆角） */
html.tablet .tool,html.tablet .pad-t,html.tablet .dock-ico{border-radius:var(--r-sm)}
html.tablet.skin-studio .tool.active,html.tablet.skin-studio .pad-t.active,
html.tablet.skin-studio .tool.on,html.tablet.skin-studio .pad-t.on{
  background:rgba(242,244,248,.20);color:#F2F4F8;
  box-shadow:inset 0 0 0 1px rgba(242,244,248,.22)}

/* 5. 拖杆（精简用色等）去掉背景框 */
html.tablet.skin-studio input[type=range]{background:transparent;border:none;box-shadow:none}
html.tablet.skin-studio input[type=range]::-webkit-slider-runnable-track{background:rgba(242,244,248,.16);border:none}
html.tablet.skin-studio input[type=range]::-moz-range-track{background:rgba(242,244,248,.16);border:none}
html.tablet.skin-studio .fld input[type=range]{background:transparent;border:none}

/* 6. 画布左下/右下圆角三角阴影：相框改内描边，去掉外扩 spread */
html.tablet.skin-studio .canvas-stack{box-shadow:none;border:0;outline:1px solid rgba(242,244,248,.10);outline-offset:0}

/* 7. 边距统一：左右工具栏距边 = 顶栏距边 = 10px（与 .app padding 一致） */
html.tablet .dock{left:10px;right:auto}
html.tablet .pad-dock-r{right:10px;left:auto}
html.tablet .stage-toolbar{padding-left:10px;padding-right:10px}

/* =========================================================
   v339 · iPad 间距规范（全部 10px，变量+显式双保险，放末尾确保生效）
   外框(app) → 台面(stage-area) → 内部三框（顶栏/左右工具坞）一律 10px
   ========================================================= */
html.tablet{--s2:10px;--s-frame:10px;--s-canvas:10px}
html.tablet .app{
  padding:10px;
  padding-top:calc(10px + env(safe-area-inset-top));
  padding-right:calc(10px + env(safe-area-inset-right));
  padding-bottom:calc(10px + env(safe-area-inset-bottom));
  padding-left:calc(10px + env(safe-area-inset-left));
}
html.tablet .stage-area{padding:10px;gap:10px}
html.tablet .stage-toolbar{padding-left:10px;padding-right:10px}
html.tablet .dock,html.tablet .pad-dock-r{top:calc(var(--tb-h) + 10px)}
html.tablet .dock{left:calc(10px + env(safe-area-inset-left));right:auto}
html.tablet .pad-dock-r{right:calc(10px + env(safe-area-inset-right));left:auto}
/* 台面内画布自身的留白也统一 10（避免内部再套一层不同值） */
html.tablet .canvas-scroll{padding:10px}

/* =========================================================
   v340 · 白底控件文字锁定（桌面：白底一律深字 / iPad：白底改暗玻璃+白字）
   程序枚举出 65 条写死亮色背景规则，逐类补齐，避免"变量反转后变白底白字"
   ========================================================= */


/* iPad：白底控件改暗玻璃 + 白系字（与桌面暗色语言一致；CTA 保持白实底深字） */
html.tablet.skin-studio .btn:not(.primary):not(.grad),
html.tablet.skin-studio .btn.act,html.tablet.skin-studio .btn.sm.act{
  background:rgba(242,244,248,.12);color:rgba(242,244,248,.9);border-color:rgba(242,244,248,.18)}
html.tablet.skin-studio .preset:not(.active),html.tablet.skin-studio .seg-b:not(.active),
html.tablet.skin-studio .segbar button:not(.active),
html.tablet.skin-studio .seg,html.tablet.skin-studio .segbar{
  background:rgba(242,244,248,.06);color:rgba(242,244,248,.78)}
html.tablet.skin-studio .preset.active,html.tablet.skin-studio .seg-b.active,
html.tablet.skin-studio .segbar button.active{
  background:rgba(242,244,248,.92);color:#141A26;border-color:transparent}
html.tablet.skin-studio .tool,html.tablet.skin-studio .pad-t,html.tablet.skin-studio .dock-ico,
html.tablet.skin-studio .rec-btn:not(.active),html.tablet.skin-studio .lp-act,
html.tablet.skin-studio .lp-add,html.tablet.skin-studio .stat-pill,
html.tablet.skin-studio .lp-item:not(.active),html.tablet.skin-studio .stat-chip:not(.hl){
  background:rgba(242,244,248,.10);color:rgba(242,244,248,.85)}
html.tablet.skin-studio .stat-chip.hl,html.tablet.skin-studio .panel.right .lp-item.active,
html.tablet.skin-studio .lp-item.active{background:rgba(242,244,248,.92);color:#141A26;border-color:transparent}
html.tablet.skin-studio .card,html.tablet.skin-studio .tips,html.tablet.skin-studio .zoom-box,
html.tablet.skin-studio .dim-field,html.tablet.skin-studio .dropzone,
html.tablet.skin-studio .layer-panel,html.tablet.skin-studio .modal,
html.tablet.skin-studio .save-box,html.tablet.skin-studio .draft-box,html.tablet.skin-studio .draft-card img,
html.tablet.skin-studio .canvas-scroll,html.tablet.skin-studio .ruler{background:rgba(242,244,248,.06);color:rgba(242,244,248,.8)}
html.tablet.skin-studio input[type=text],html.tablet.skin-studio input[type=number],
html.tablet.skin-studio select,html.tablet.skin-studio textarea,
html.tablet.skin-studio .draft-del{background:rgba(242,244,248,.12);color:#F2F4F8;border-color:rgba(242,244,248,.18)}
html.tablet.skin-studio .btn.primary,html.tablet.skin-studio .btn.grad{background:#F2F4F8;color:#141A26;border-color:transparent}

/* v343 · iPad 工具按钮强制透明（无底无框）—— 触摸设备 hover 粘滞 + 各类底色规则全部覆盖 */
html.tablet.skin-studio .dock .tool,html.tablet.skin-studio .dock .dock-ico,
html.tablet.skin-studio .pad-dock-r .tool,html.tablet.skin-studio .pad-dock-r .dock-ico,
html.tablet.skin-studio .dock .tool:hover,html.tablet.skin-studio .dock .dock-ico:hover,
html.tablet.skin-studio .pad-dock-r .tool:hover,html.tablet.skin-studio .pad-dock-r .dock-ico:hover,
html.tablet.skin-studio .dock .tool:active,html.tablet.skin-studio .dock .dock-ico:active,
html.tablet.skin-studio .pad-dock-r .tool:active,html.tablet.skin-studio .pad-dock-r .dock-ico:active,
html.tablet.skin-studio .dock .tool.active,html.tablet.skin-studio .dock .tool.on,
html.tablet.skin-studio .pad-dock-r .tool.active,html.tablet.skin-studio .pad-dock-r .tool.on{
  background:transparent;border-color:transparent;box-shadow:none}
html.tablet.skin-studio .dock .tool.active,html.tablet.skin-studio .dock .tool.on,
html.tablet.skin-studio .pad-dock-r .tool.active,html.tablet.skin-studio .pad-dock-r .tool.on{
  color:#F2F4F8}

/* v350 · 顶栏标题行：间距不允许被 flex 压缩（窄屏下 margin 被挤会导致竖线贴字）；
   次要信息（列·行）在 iPad 窄屏隐藏，保证「名字 | 作者 | 尺寸」的间距始终整齐 */
html.tablet .hd-sub .hd-item{flex-shrink:0}
html.tablet .hd-sub #hdZoom{display:none}

/* =========================================================
   v351 · iPad 竖屏抽屉三处修复
   ① 滑杆被 iOS 原生样式接管（巨大圆球）→ 强制自绘
   ② 新建图层按钮平板加大尺寸回退 + 图层面板整体滚动（列表不单独滚）
   ③ 色板列数自适应（放不下就少放几个，不再挤成长条）
   ========================================================= */
/* ① 滑杆：去掉 iOS 原生外观，统一用自定义 thumb/track */
html.tablet input[type=range]{
  -webkit-appearance:none;appearance:none;
  background:transparent;border:none;box-shadow:none;
}
html.tablet input[type=range]::-webkit-slider-runnable-track{
  -webkit-appearance:none;appearance:none;
  height:4px;background:rgba(242,244,248,.16);border-radius:2px}
html.tablet input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;appearance:none;
  width:16px;height:16px;margin-top:-6px;border-radius:50%;
  background:#F2F4F8;border:none;box-shadow:0 1px 4px rgba(0,0,0,.3)}
html.tablet input[type=range]::-moz-range-track{height:4px;background:rgba(242,244,248,.16);border-radius:2px}
html.tablet input[type=range]::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:#F2F4F8;border:none}
/* ② 新建图层按钮回正常尺寸；面板整体滚动（列表不单独滚） */
html.tablet .layer-panel .lp-list .lp-add{width:32px;height:28px;border-radius:var(--r-sm)}
html.tablet .layer-panel{overflow:auto}
html.tablet .layer-panel .lp-list{overflow:visible}
/* ③ 色板列数自适应（窄面板自动减列，胶囊不再被挤扁） */
html.tablet .pal{grid-template-columns:repeat(auto-fill,minmax(56px,1fr))}

/* v356：尺寸输入框内的 input 透明——容器(.dim-field)已提供凹底，
   input 自身再叠一层白 6% 会形成"数字背后的亮块"（双层叠加） */
html.skin-studio .dim-field input[type=number],
html.skin-studio .dim-field input[type=text]{background:transparent;box-shadow:none}
</style>

/* v157：自定义 tooltip —— 原生 title 黑块大、样式不可控、贴窗口边还会截断。
   委托 mouseover：首次遇到带 title 的元素就把文案搬进 data-tip 并移除 title
   （原生提示随之消失），之后统一画进 #tip；动态重建的元素下次悬停自动迁移。 */
(function(){
  var tip = null, cur = null;
  function place(el){
    if (!tip){ tip = document.createElement("div"); tip.id = "tip"; document.body.appendChild(tip); }
    var txt = el.getAttribute("data-tip");
    if (txt === null){
      txt = el.getAttribute("title");
      if (txt){ el.setAttribute("data-tip", txt); el.removeAttribute("title"); }
    }
    if (!txt){ hide(); return; }
    tip.textContent = txt; tip.style.opacity = 1; cur = el;
    var r = el.getBoundingClientRect(), w = tip.offsetWidth, h = tip.offsetHeight;
    var x = Math.min(Math.max(8, r.left), window.innerWidth - w - 8);
    var y = r.bottom + 6;
    if (y + h > window.innerHeight - 8) y = Math.max(8, r.top - h - 6);
    tip.style.left = x + "px"; tip.style.top = y + "px";
  }
  function hide(){ if (tip){ tip.style.opacity = 0; } cur = null; }
  document.addEventListener("mouseover", function(e){
    var el = e.target && e.target.closest ? e.target.closest("[title],[data-tip]") : null;
    /* v208：色板色块不弹信息条（hover 有描边反馈就够了） */
    if (el && el.closest(".pal")){ hide(); return; }
    if (el && el !== cur) place(el); else if (!el) hide();
  });
  document.addEventListener("mouseout", function(e){
    var el = e.target && e.target.closest ? e.target.closest("[data-tip],[title]") : null;
    if (el && e.relatedTarget && el.contains(e.relatedTarget)) return;
    if (el) hide();
  });
  window.addEventListener("scroll", hide, true);
})();

   文件交付（桌面下载 / 移动端存相册）
   ========================================================= */
/* 为什么移动端不能用 a.download：
   iOS 会把下载的文件丢进「文件 App → 下载」，根本不会进相册；
   微信 / QQ 内置浏览器更是直接静默失败 —— 而 toast 是无条件弹的，
   所以用户会看到「已导出」却在相册里永远找不到。
   移动端唯一可靠的存图方式是：把图片显示出来让用户长按 → 存储到照片。 */
function isMobileDevice(){
  var ua = navigator.userAgent || "";
  if (/Android|iPhone|iPad|iPod|IEMobile|Opera Mini/i.test(ua)) return true;
  /* iPadOS 13+ 伪装成 Mac，靠 maxTouchPoints 区分。
     v132a：单看 maxTouchPoints 太粗 —— macOS 版 Safari（尤其接了触控设备/某些版本）
     也会报 >1，结果整台 Mac 被判成 iPad，点「导出图纸」弹出的是「保存到相册」的
     分享浮层，而 macOS 的分享面板根本不收图片 —— 用户看到的就是「下载不了」。
     现在要求「MacIntel + 多点触控 + 粗指针」三条同时成立：
     iPadOS 一定是 coarse，macOS Safari 一定是 fine。 */
  if (navigator.platform === "MacIntel" && (navigator.maxTouchPoints || 0) > 1){
    try{
      return !!(window.matchMedia && window.matchMedia("(pointer: coarse)").matches);
    }catch(e){ return false; }
  }
  return /Mobile/i.test(ua);
}
/* ---------- 设备形态：触摸 / 平板 ----------
   iPad 的视口（744~1366）原来直接落进桌面三栏布局，左右面板吃掉 524px，
   12.9 竖屏画布只剩 294px（适应屏幕 27%）—— 屏幕越大反而越难用。
   这里把形态判定打成 <html> 上的 class，由 CSS 的 .tablet / .touch 段接管。
   为什么不用 pointer:coarse 媒体查询：headless 里无法模拟，布局改动就没法回归测试。 */
function isTouchDevice(){
  return (navigator.maxTouchPoints || 0) > 0 || "ontouchstart" in window;
}
function isTabletLayout(){
  /* 短边 > 600 才算平板。阈值定在 600 是量出来的：
     iPad mini 横屏的可用视口只有 1133×657（减掉 Safari 工具栏），
     一开始取 700 会把它挡在平板之外、掉回桌面三栏（画布只剩 403px）；
     而手机横屏最大也就 932×430，600 能干净地把两类分开。
     iPad 半屏分屏（507×738）落到手机堆叠布局，也是合理的。 */
  var w = window.innerWidth, h = window.innerHeight;
  if (!isTouchDevice() || Math.min(w, h) <= 600) return false;
  return (w < h) || Math.max(w, h) < 900;   /* v348：横屏走桌面三栏，只有竖屏/窄屏才抽屉 */
}
/* 当前是否处于平板形态（读 html 上的 .tablet 类）。
   与 isTabletLayout() 区分：后者按视口/触摸「判定」该走哪个形态，这个是读当前实际形态。 */
function isTablet(){ return document.documentElement.classList.contains("tablet"); }
function updateDeviceClass(){
  var d = document.documentElement, was = d.classList.contains("tablet");
  d.classList.toggle("touch", isTouchDevice());
  d.classList.toggle("tablet", isTabletLayout());
  var now = d.classList.contains("tablet");
  /* iPad 专属常驻元素：右缘色板条 + 竖栏里的图层按钮 */
  var pr = $("padDockR");
  if (pr) pr.hidden = !now;
  var lp = $("btnLayerPad"), ld = $("layerDiv");
  if (lp) lp.hidden = !now;
  if (ld) ld.hidden = !now;
  if (was && !now){
    setDrawer(null);                        /* 退出平板形态时别留着开着的抽屉 */
    var lpp = document.querySelector(".layer-panel");
    if (lpp) lpp.classList.remove("open");

  var pcu = $("padCur"), plg = $("padLegend");

  /* 色板浮层按「二级菜单」处理：不带蒙层（蒙层只给左侧设置抽屉） */
  if (side) closeEraseMenu();

    if (drawerMode === "palette" && typeof palAllCollapsed === "function" && palAllCollapsed()) togglePalAll();

    if (drawerMode === "legend") updateStats();

}

      入口按钮【不做选中态】——面板可见即是状态，屏幕上永远只有一个高亮（当前工具）。

   - 点任意【工具】按钮 → 关掉所有浮层（画图需要画布空间，浮层不该赖着）
   - 点【另一个面板入口】 → 切换过去（不是关闭）
   - 点【已展开的那个入口】 → 收起

/* v137 打包收集器：只有 zipSink 非 null 时才生效。
   平时是 null，deliverBlob / deliverFile 走原来那条路（桌面下载 / 手机分享），
   一行代码都不多跑；打包时它把四份文件先收住，收齐了一次性压成 zip。 */
var zipSink = null;
function zipSinkPut(filename, blob){
  var n = filename;
  if (zipSink && zipSink.tag){
    var dot = n.lastIndexOf(".");
    n = dot > 0 ? (n.slice(0, dot) + zipSink.tag + n.slice(dot)) : (n + zipSink.tag);
  }
  zipSink.list.push({ name: n, blob: blob });
}
function deliverBlob(blob, filename, label, done, thumb){
  if (zipSink){ zipSinkPut(filename, blob); if (done) done(); return; }
  if (!isMobileDevice()){
    /* v134：桌面一律直接下载，不再分叉。
       之前 v132 给「iframe 里（资料库发布页）」单独走了预览浮层 —— 那是想解决
       「Chrome 拦 iframe 下载」，但用户实测桌面一直都能直接下，是我把能用的路
       换成了弹窗，属于改错方向。现在回到原行为：桌面 = 一键下载，浮层只给手机/iPad。 */
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = filename;
    /* v132：两处都是「点了导出却下不下来」的真凶 ——
       1. 以前 2 秒就 revokeObjectURL。v126 之后图纸动辄几十 MB，浏览器还没
          开始写盘 URL 就失效了；用户若开了「下载前询问保存位置」，等他点完
          保存拿到的一定是「下载失败 · 网络错误」。现在延到 60 秒回收。
       2. 以前 <a> 不挂进 DOM。Firefox / Safari 只认文档内的元素，脱离文档的
          a.click() 会被静默忽略 —— 表现同样是「点了没反应」。
       3. 回收时连元素一起摘掉，不留悬挂节点。 */
    a.style.display = "none";
    document.body.appendChild(a);
    a.click();
    var keepUrl = a.href;
    setTimeout(function(){
      if (a.parentNode) a.parentNode.removeChild(a);
      URL.revokeObjectURL(keepUrl);
    }, 60000);
    if (!exportQuiet) toast(label + "已保存到「下载」文件夹");
    if (done) done();
    return;
  }
  openSavePreview(blob, filename, label, done, thumb);
}
var saveUrl = null, fullUrl = null, saveFile = null;
function openSavePreview(blob, filename, label, done, thumb){
  if (saveUrl){ URL.revokeObjectURL(saveUrl); saveUrl = null; }
  if (fullUrl){ URL.revokeObjectURL(fullUrl); fullUrl = null; }
  saveUrl = URL.createObjectURL(thumb || blob);
  fullUrl = thumb ? URL.createObjectURL(blob) : saveUrl;
  try { saveFile = new File([blob], filename, { type: "image/png" }); }
  catch(e){ saveFile = null; }        /* 老浏览器没有 File 构造器，退化成长按保存 */

  var mask = $("saveModal");
  if (!mask){
    mask = document.createElement("div");
    mask.className = "modal-mask"; mask.id = "saveModal";
    mask.innerHTML =
      '<div class="save-box">' +
        '<div class="m-t" id="saveTitle">保存图片</div>' +
        '<img class="save-img" id="saveImg" alt="导出结果">' +
        /* v79：不再写说明文字。好的交互是按钮自己说清结果——
           一个主按钮「保存图片」调起系统面板，面板里就有「存储到图像 / 存储到文件」，
           那是 iOS 原生 UI，用户比我们写的说明更熟悉。 */
        '<div class="save-tip" id="saveTip" hidden></div>' +
        '<div class="save-acts">' +
          '<button class="btn" id="saveClose">关闭</button>' +
          '<button class="btn primary" id="saveShare">保存图片</button>' +
        '</div>' +
      '</div>';
    document.body.appendChild(mask);
    mask.addEventListener("click", function(e){ if (e.target === this) closeSavePreview(); });
    $("saveClose").addEventListener("click", closeSavePreview);
    $("saveShare").addEventListener("click", shareToAlbum);
  }
  /* 批量导出时说清还有后续，免得用户以为这就完了、把后面几份当成弹错的窗口 */
  $("saveTitle").textContent = label + (done ? " · 处理完还有下一份" : "");
  $("saveImg").src = saveUrl;
  var sh = $("saveShare");
  /* 按钮文案 = 实际会发生的动作：
     · 正常页面：系统分享面板（存储到图像 / 存储到文件）
     · iframe 壳里：新标签打开原图，再长按存储（iOS 对 iframe 里的 share/下载有限制） */
  /* v134：这个浮层只服务手机/iPad，桌面走 deliverBlob 的直接下载，不会再走到这里 */
  var canShare = !!(saveFile && navigator.canShare && navigator.canShare({ files: [saveFile] }));
  sh.hidden = !canShare && !inIframe();
  sh.textContent = (canShare && !inIframe()) ? "保存图片" : "打开图片";
  /* 只有在没有可靠出路时才给一句最短的引导（长按），平时不写任何说明 */
  var tip = $("saveTip");
  if (tip){ tip.hidden = canShare; tip.textContent = canShare ? "" : "长按图片可存储"; }
  mask.hidden = false;
  saveNextCb = done || null;
}
function closeSavePreview(){
  var mask = $("saveModal");
  if (mask) mask.hidden = true;
  if (saveUrl){ URL.revokeObjectURL(saveUrl); saveUrl = null; }
  if (fullUrl && fullUrl !== saveUrl){ URL.revokeObjectURL(fullUrl); }
  fullUrl = null;
  saveFile = null;
  /* v119：这一份处理完了，接着生成批量导出的下一份（留一点间隔让系统面板收起） */
  var cb = saveNextCb; saveNextCb = null;
  if (cb) setTimeout(cb, 350);
}
/* 是否跑在别的页面壳里（workbuddy.link 发布页用 iframe 装我们）——
   iOS 对 iframe 里的 share 和下载都有限制，得换路：新标签打开原图再长按存储 */
function inIframe(){ try{ return window.self !== window.top; }catch(e){ return true; } }
/* 新标签打开原图：顶层页面里长按一定有「存储图像」，分享面板里也有「存储到文件」 */
function saveViaNewTab(){
  try{
    var a = document.createElement("a");
    a.href = fullUrl || saveUrl; a.target = "_blank"; a.rel = "noopener";
    document.body.appendChild(a);
    a.click();
    setTimeout(function(){ if (a.parentNode) a.parentNode.removeChild(a); }, 1500);
    toast("已在新标签打开原图，长按它即可存储");
    return true;
  }catch(e){ return false; }
}
/* 浏览器下载兜底：iOS 上 share 可能不弹，这条至少能把原文件交给 Safari */
function downloadFallback(){
  try{
    /* v132a：别直接用 fullUrl —— 关掉浮层时 closeSavePreview 会把它 revoke 掉，
       正在下载的几十 MB 图纸会半途断掉（又是「下不下来」）。这里另开一个 URL，
       60 秒后再回收，和主下载路径一个待遇。 */
    var url2 = saveFile ? URL.createObjectURL(saveFile) : (fullUrl || saveUrl);
    var a = document.createElement("a");
    a.href = url2;
    a.download = (saveFile && saveFile.name) || "bead-pattern.png";
    a.rel = "noopener";
    document.body.appendChild(a);
    a.click();
    setTimeout(function(){ if (a.parentNode) a.parentNode.removeChild(a); }, 1500);
    if (url2 !== fullUrl && url2 !== saveUrl){
      setTimeout(function(){ URL.revokeObjectURL(url2); }, 60000);
    }
    toast("已交给浏览器下载");
    return true;
  }catch(e){ return false; }
}
function shareToAlbum(){
  /* iframe 里 share/下载都可能被 iOS 拦——最可靠的是新标签打开原图（顶层页面） */
  if (inIframe()){
    if (!saveViaNewTab()) toast("请长按图片存储");
    return;
  }
  if (saveFile && navigator.canShare && navigator.canShare({ files: [saveFile] })){
    navigator.share({ files: [saveFile] }).then(function(){
      closeSavePreview();                       /* 成功就收起浮层 */
    }).catch(function(err){
      /* 用户自己取消不算失败；真正的失败要换一条路，不能静默 */
      if (err && err.name === "AbortError") return;
      if (!downloadFallback()) toast("保存失败，可长按图片存储");
    });
    return;
  }
  if (!downloadFallback()) toast("请长按图片存储");
}
function dpr(){ return window.devicePixelRatio || 1; }
/* v319：canvas 物理分辨率上限 —— 大画布高 zoom 时尺寸爆炸（400% 时 9600² ≈ 9200 万像素/层），
   超限自动降有效 dpr，保证不卡死；清晰度在超限时轻微柔化，属可接受降级 */
function dprEff(w, h){
  var MAX = 6200, d = dpr();
  var need = Math.max(w, h) * d;
  return need > MAX ? Math.max(1, MAX / Math.max(w, h)) : d;
}
function cellPx(){ return CELL * state.zoom; }
function sizePx(){ return { w: state.cols * CELL * state.zoom, h: state.rows * CELL * state.zoom }; }

/* v357：宿主尺寸同步 —— canvas 都是 absolute，若不显式撑开 .canvas-stack，
   右/下边缘（最后一列/行）会被 overflow:hidden 裁掉 */
function syncStackSize(){
  try{
    var w = 0, h = 0;
    var l = [gridCanvas, refCanvas];
    for (var i = 0; i < l.length; i++){
      var cv = l[i]; if (!cv) continue;
      var cw = parseFloat(cv.style.width) || 0, ch = parseFloat(cv.style.height) || 0;
      if (cw > w) w = cw;
      if (ch > h) h = ch;
    }
    /* v361：精确等于画布尺寸（+4 是单边补丁，已去除 → 四周对称） */
    if (w > 0) canvasStack.style.width = w + "px";
    if (h > 0) canvasStack.style.height = h + "px";
  }catch(e){}
}
function setupCanvas(cv, w, h){
  var d = dprEff(w, h);
  cv.style.width = w + "px";
  cv.style.height = h + "px";

  /* v357：canvas 是 absolute 不撑开宿主 → 显式同步 .canvas-stack 尺寸（取两个画布的最大值） */
  syncStackSize();
  /* v326：尺寸没变就不重设 width/height —— 高频重绘（拖滑块/悬停）时反复重分配
     会触发浏览器滚动锚定漂移，导致网格与图纸错位；跳过还能省一次大画布内存重分配 */
  var pw = Math.max(1, Math.ceil(w * d)), ph = Math.max(1, Math.ceil(h * d));   /* v361：ceil 防舍入裁切 */
  if (cv.width === pw && cv.height === ph){
    var c0 = cv.getContext("2d");
    c0.setTransform(d, 0, 0, d, 0, 0);
    c0.clearRect(0, 0, w, h);
    return c0;
  }
  cv.width = pw;
  cv.height = ph;
  var c = cv.getContext("2d");
  c.setTransform(d, 0, 0, d, 0, 0);
  return c;
}
function hexToRgb(h){
  return [parseInt(h.substr(1,2),16), parseInt(h.substr(3,2),16), parseInt(h.substr(5,2),16)];
}

/* =========================================================
   网格数据
   ========================================================= */
function makeGrid(cols, rows, keepOld){
  var g = new Array(cols * rows);
  for (var i = 0; i < g.length; i++) g[i] = 0;
  if (keepOld && state.grid){
    var oc = state.cols, or_ = state.rows, og = state.grid;
    var mc = Math.min(oc, cols), mr = Math.min(or_, rows);
    for (var y = 0; y < mr; y++){
      for (var x = 0; x < mc; x++) g[y*cols + x] = og[y*oc + x];
    }
  }
  return g;
}

/* =========================================================
   图层
   —— 数组顺序 = 从下到上，layers[0] 是图纸层（转图纸的结果），
      其上是用户手绘层。参考图不占图层数组，它是独立的底图画布。
      state.grid 始终是活动层 grid 的「同一个数组引用」（不复制），
      所以既有的绘制/填充/形状代码天然只作用于活动层。
   ========================================================= */
/* 图纸层：转图纸的结果永远写这里（默认 layers[0]，用户挪动过顺序也能找到） */
function patternLayer(){
  for (var i = 0; i < state.layers.length; i++)
    if (state.layers[i].kind === "pattern") return state.layers[i];
  var L = makeLayer("图纸层", "pattern", makeGrid(state.cols, state.rows, false));
  state.layers.unshift(L);
  state.active = clamp(state.active + 1, 0, state.layers.length - 1);
  syncActiveGrid();
  return L;
}
function makeLayer(name, kind, grid){
  return { id: ++layerSeq, name: name, kind: kind || "user",
           grid: grid || makeGrid(state.cols, state.rows, false),
           opacity: 1, visible: true, locked: false };
}
function syncActiveGrid(){
  var L = state.layers[state.active];
  if (L) state.grid = L.grid;
}
/* 整块换掉活动层内容（翻转/移动/导入等），必须同时写回图层，否则引用会断 */
function setActiveGrid(ng){
  var L = activeLayer();
  if (L) L.grid = ng;
  state.grid = ng;
}
function activeLayer(){ return state.layers[state.active] || null; }
/* 活动层被锁定 / 当前选中的是参考图层 → 不接受绘制 */
function canDraw(){
  if (state.refActive){ toast("当前选中的是参考图层，选一个图层再画"); return false; }
  var L = activeLayer();
  if (!L){ return false; }
  if (L.locked){ toast("「" + L.name + "」已锁定，点图层上的锁图标解锁"); return false; }
  return true;
}
/* v380：离屏图层缓存已删，这里保留为空操作（历史上 10 处调用点用于清缓存脏标记） */
function markAllLayersDirty(){}
function initLayers(patternGrid){
  layerSeq = 0;
  state.layers = [makeLayer("图纸层", "pattern", patternGrid || makeGrid(state.cols, state.rows, false))];
  /* v236：不再默认锁定任何图层（用户明确要求彻底去掉）；需要时手动点锁 */
  state.layers[0].locked = false;
  state.active = 0;
  state.refActive = false;
  state.selLayers = {};
  syncActiveGrid();
}
function updateCanvasCursor(){
  if (!gridCanvas) return;
  if (panning) return;                       /* 平移中不要被别处改回 grab */
  resetCanvasCursor();
}
function setActiveLayer(i, isRef){
  if (isRef){ state.refActive = true; renderLayerPanel(); updateCanvasCursor(); return; }
  if (i < 0 || i >= state.layers.length) return;
  state.refActive = false;
  state.active = i;
  syncActiveGrid();
  updateCanvasCursor();
  renderGrid(); updateStats(); updatePaletteMarks(); renderLayerPanel(); saveDraft();
}
function addLayer(){
  if (state.layers.length >= MAX_LAYERS){ toast("最多 " + MAX_LAYERS + " 个图层"); return; }
  beginChange();
  var n = 1, used = {}, i;
  for (i = 0; i < state.layers.length; i++) used[state.layers[i].name] = 1;
  while (used["图层 " + n]) n++;
  state.layers.push(makeLayer("图层 " + n, "user"));
  state.active = state.layers.length - 1;
  state.refActive = false;
  syncActiveGrid();
  endChange();
  renderGrid(); updateStats(); renderLayerPanel();
  toast("已新建「" + activeLayer().name + "」（空白层，画上去不会动到下层）");
}
function dupLayer(i){
  if (state.layers.length >= MAX_LAYERS){ toast("最多 " + MAX_LAYERS + " 个图层"); return; }
  var L = state.layers[i];
  if (!L) return;
  beginChange();
  var c = makeLayer(L.name + " 副本", "user", L.grid.slice());
  c.opacity = L.opacity; c.visible = L.visible;
  state.layers.splice(i + 1, 0, c);
  state.active = i + 1;
  state.refActive = false;
  syncActiveGrid();
  endChange();
  renderGrid(); updateStats(); renderLayerPanel();
  toast("已复制为「" + c.name + "」");
}
function delLayer(i){
  var L = state.layers[i];
  if (!L) return;
  /* v93：图纸层也是普通图层，能删（以前写死不让删，刷新又从化石草稿里冒出来，像删不掉） */
  if (state.layers.length <= 1){ toast("至少要保留一个图层"); return; }
  beginChange();
  delete state.selLayers[L.id];
  state.layers.splice(i, 1);
  state.active = clamp(state.active >= i ? state.active - 1 : state.active, 0, state.layers.length - 1);
  state.refActive = false;
  syncActiveGrid();
  markAllLayersDirty();
  endChange();
  renderGrid(); updateStats(); updatePaletteMarks(); renderLayerPanel();
  toast("已删除「" + L.name + "」");
}
function moveLayer(i, dir){
  var j = i + dir;
  if (i < 0 || i >= state.layers.length || j < 0 || j >= state.layers.length) return;
  beginChange();
  var t = state.layers[i]; state.layers[i] = state.layers[j]; state.layers[j] = t;
  if (state.active === i) state.active = j;
  else if (state.active === j) state.active = i;
  syncActiveGrid();
  markAllLayersDirty();
  endChange();
  renderGrid(); renderLayerPanel();
}
/* 拖拽排序：insertAt 是「数组坐标下的插入位置」(0..len)，0 = 最底。
   与 moveLayer(相邻交换) 不同，这里可以一次跨多层 */
function reorderLayer(from, insertAt){
  var n = state.layers.length;
  if (from < 0 || from >= n) return false;
  insertAt = clamp(insertAt, 0, n);
  if (insertAt === from || insertAt === from + 1) return false;   // 落回原位
  beginChange();
  var keep = state.layers[state.active];                          // 用对象引用找回选中层
  var L = state.layers.splice(from, 1)[0];
  state.layers.splice(insertAt > from ? insertAt - 1 : insertAt, 0, L);
  var ai = state.layers.indexOf(keep);
  state.active = ai < 0 ? clamp(state.active, 0, state.layers.length - 1) : ai;
  syncActiveGrid();
  markAllLayersDirty();
  endChange();
  renderGrid(); renderLayerPanel(); saveDraft();
  return true;
}
/* 合并：把 src 的非空格盖到 dst 上（上层压下层），dst 保留 */
function blitInto(dst, src){
  for (var i = 0; i < src.length && i < dst.length; i++) if (src[i]) dst[i] = src[i];
}
function mergeDown(i){
  if (i <= 0){ toast("最下面的图层没有可合并的对象"); return; }
  var up = state.layers[i], lo = state.layers[i - 1];
  if (lo.locked){ toast("下层「" + lo.name + "」已锁定，先解锁再合并"); return; }
  beginChange();
  blitInto(lo.grid, up.grid);
  lo.name = lo.kind === "pattern" ? lo.name : (lo.name + "+" + up.name);
  delete state.selLayers[up.id];
  state.layers.splice(i, 1);
  state.active = clamp(i - 1, 0, state.layers.length - 1);
  state.refActive = false;
  syncActiveGrid();
  markAllLayersDirty();
  endChange();
  renderGrid(); updateStats(); updatePaletteMarks(); renderLayerPanel();
  toast("已向下合并到「" + lo.name + "」");
}
/* 合并勾选的多个图层 → 合到其中最下面那层（保持上压下的叠放顺序） */
function mergeSelected(){
  var idxs = [], i;
  for (i = 0; i < state.layers.length; i++) if (state.selLayers[state.layers[i].id]) idxs.push(i);
  if (idxs.length < 2){ toast("先勾选 2 个以上图层再合并"); return; }
  var base = idxs[0], baseL = state.layers[base];
  if (baseL.locked){ toast("最下层的「" + baseL.name + "」已锁定，先解锁再合并"); return; }
  beginChange();
  for (i = 1; i < idxs.length; i++) blitInto(baseL.grid, state.layers[idxs[i]].grid);
  var names = [];
  for (i = idxs.length - 1; i >= 1; i--){
    names.push(state.layers[idxs[i]].name);
    delete state.selLayers[state.layers[idxs[i]].id];
    state.layers.splice(idxs[i], 1);
  }
  if (baseL.kind !== "pattern") baseL.name = "合并层";
  state.selLayers = {};
  state.active = clamp(base, 0, state.layers.length - 1);
  state.refActive = false;
  syncActiveGrid();
  markAllLayersDirty();
  endChange();
  renderGrid(); updateStats(); updatePaletteMarks(); renderLayerPanel();
  toast("已合并 " + (names.length + 1) + " 个图层到「" + baseL.name + "」");
}

/* v205：名称紧跟缩略图 —— 行式布局里名称在左起第二位，不再被甩到行尾 */
function placeLpNameAfterThumb(it, nm){
  var ths = it.querySelector(".lp-thumb");
  if (ths && ths.nextSibling) it.insertBefore(nm, ths.nextSibling);
  else it.appendChild(nm);
}
/* =========================================================
   图层面板（画布左侧，PPT 缩略图样式：上 = 顶层）
   ========================================================= */
var thumbTimer = null;
/* v70：卡片复用后，原来「整块 innerHTML 重写」的状态更新改到这里做 ——
   只改属性不换节点，滑块的值 / 眼睛锁的图标 / 按钮的禁用态都不会被重置。 */
function syncLayerRow(it, L, i){
  /* v209：眼睛/锁上移到第一行（卡片直属），滑块/上下移在第二行 —— 都从卡片上找 */
  var vis = it.querySelector("[data-vis]"), lk = it.querySelector("[data-lock]"), op = it.querySelector("[data-op]");
  if (vis){
    vis.className = "lp-mini" + (L.visible ? " on" : "");
        var uv = vis.querySelector("use");
    if (uv) uv.setAttribute("href", "#i-eye" + (L.visible ? "" : "-off"));
  }
  if (lk){
    lk.className = "lp-mini" + (L.locked ? " on" : "");
        var ul = lk.querySelector("use");
    if (ul) ul.setAttribute("href", "#i-" + (L.locked ? "lock" : "unlock"));
  }

/* 绘制过程中只刷新当前层缩略图，节流避免每笔都重画 10 张 */

/* =========================================================
   图层拖拽排序
   鼠标：移动 5px 即进入拖拽。触摸：长按 320ms 才进入，

function lpClearMarks(){

function lpEndDrag(commit){

  clearTimeout(d.timer);
  d.el.classList.remove("dragging");
  lpClearMarks();
  if (!d.on) return;

  if (commit && d.slot !== undefined){

function bindLayerDrag(){
  var list = $("lpList");
  list.addEventListener("pointerdown", function(e){
    if (e.button === 2) return;
    var it = e.target.closest ? e.target.closest(".lp-item[data-i]") : null;
    if (!it) return;
    /* 眼睛 / 锁 / 透明度滑杆 / 勾选框 / 操作按钮 / 改名中 —— 都不该触发拖拽 */
    if (e.target.closest("button, input, [contenteditable='true']")) return;

               id: e.pointerId, touch: e.pointerType !== "mouse", on: false, timer: 0 };

      lpDrag.timer = setTimeout(function(){
        if (!lpDrag) return;
        lpDrag.on = true;

        lpMark(lpDrag.slot = lpDropSlot(lpDrag.x, lpDrag.y));
      }, 320);
    }

    if (!lpDrag || e.pointerId !== lpDrag.id) return;
    var m = Math.abs(e.clientX - lpDrag.x) + Math.abs(e.clientY - lpDrag.y);
    if (!lpDrag.on){

      }

/* =========================================================
   历史记录
   ========================================================= */
var undoStack = [], redoStack = [], snapshotBefore = null;
/* 快照要带上整套图层（结构 + 内容），否则撤销会把图层弄乱 */
function snapshot(){

  for (i = 0; i < state.layers.length; i++){
    var L = state.layers[i];
    ls.push({ id: L.id, name: L.name, kind: L.kind, grid: L.grid.slice(),
              opacity: L.opacity, visible: L.visible, locked: L.locked });
  }
  return { cols: state.cols, rows: state.rows, layers: ls, active: state.active,
           refOff: {x: state.refOff.x, y: state.refOff.y} };
}
/* 擦除方式「单格 / 框选 / 同色连片」：桌面在 dock 底部横排，iPad 在右栏橡皮旁竖排弹出。

   只更新其中一份就会出现「点了没反应 / 两份显示不一致」。 */

  var b = $("eraseModesPad") ? $("eraseModesPad").querySelectorAll(".seg-b") : [];
  var out = [];
  for (var i = 0; i < a.length; i++) out.push(a[i]);
  for (var j = 0; j < b.length; j++) out.push(b[j]);

function syncEraseMode(){

function beginChange(){ snapshotBefore = snapshot(); }
function sameSnapshot(a){
  if (a.cols !== state.cols || a.rows !== state.rows) return false;
  if (a.layers.length !== state.layers.length || a.active !== state.active) return false;
  if (a.refOff.x !== state.refOff.x || a.refOff.y !== state.refOff.y) return false;
  for (var i = 0; i < a.layers.length; i++){
    var x = a.layers[i], L = state.layers[i];
    if (x.id !== L.id || x.name !== L.name || x.opacity !== L.opacity ||
        x.visible !== L.visible || x.locked !== L.locked) return false;
    if (!sameGrid(x.grid, L.grid)) return false;

}
function endChange(){
  if (!snapshotBefore) return;
  var before = snapshotBefore; snapshotBefore = null;
  if (sameSnapshot(before)) return;
  undoStack.push(before);
  if (undoStack.length > 60) undoStack.shift();
  redoStack.length = 0;
  touchThumb();
  saveDraft();
}
function sameGrid(a, b){
  if (a.length !== b.length) return false;
  for (var i = 0; i < a.length; i++) if (a[i] !== b[i]) return false;
  return true;
}
function applySnapshot(s){
  state.cols = s.cols; state.rows = s.rows;
  state.layers = [];
  for (var i = 0; i < s.layers.length; i++){
    var x = s.layers[i];
    var L = makeLayer(x.name, x.kind, x.grid.slice());
    L.id = x.id; L.opacity = x.opacity; L.visible = x.visible; L.locked = x.locked;
    state.layers.push(L);
  }
  if (!state.layers.length) initLayers(null);
  state.active = clamp(s.active | 0, 0, state.layers.length - 1);
  state.refActive = false;
  syncActiveGrid();
  markAllLayersDirty();
  state.refOff.x = s.refOff.x; state.refOff.y = s.refOff.y;
  $("inCols").value = s.cols; $("inRows").value = s.rows;

function undo(){
  if (!undoStack.length) { toast("没有可撤销的操作"); return; }
  redoStack.push(snapshot());
  applySnapshot(undoStack.pop());
  saveDraft();
}
function redo(){
  if (!redoStack.length) { toast("没有可重做的操作"); return; }
  undoStack.push(snapshot());
  applySnapshot(redoStack.pop());
  saveDraft();
}

/* =========================================================
   绘制：豆子 / 网格 / 标尺
   ========================================================= */
function roundRectPath(c, x, y, w, h, r){
  r = Math.min(r, w/2, h/2);
  c.beginPath();
  c.moveTo(x + r, y);
  c.arcTo(x + w, y, x + w, y + h, r);
  c.arcTo(x + w, y + h, x, y + h, r);
  c.arcTo(x, y + h, x, y, r);
  c.arcTo(x, y, x + w, y, r);
  c.closePath();
}
/* v376：色号文字 sprite 缓存 —— key = 色号@字号@深浅，字号变化（缩放）时整体失效重建 */
var DPRC = Math.min(2, window.devicePixelRatio || 1);
var codeSpriteCache = {}, codeSpriteFs = "";
function codeSprite(id, fs, dark, isExport){
  var fsK = Math.round(fs * 2) / 2;
  if (codeSpriteFs !== fsK){ codeSpriteCache = {}; codeSpriteFs = fsK; }
  var key = id + "@" + fsK + "@" + dark + (isExport ? "x" : "");
  if (codeSpriteCache[key]) return codeSpriteCache[key];
  var pad = 3;
  var cv = document.createElement("canvas");
  var c0 = cv.getContext("2d");
  var font = (isExport ? "400 " : "500 ") + fsK.toFixed(1) + "px -apple-system,'PingFang SC',sans-serif";
  c0.font = font;
  var tw = Math.ceil(c0.measureText(id).width) + pad * 2;
  var th = Math.ceil(fsK * 1.5);
  cv.width = Math.ceil(tw * DPRC); cv.height = Math.ceil(th * DPRC);
  c0 = cv.getContext("2d");
  c0.scale(DPRC, DPRC);
  c0.font = font; c0.textAlign = "left"; c0.textBaseline = "middle";
  c0.fillStyle = dark ? "#FFFFFF" : "#1D1D1F";
  c0.fillText(id, pad, th / 2);

}
/* 单元格绘制：圆豆 / 色块 / 带色号标注（idx = 调色板下标） */
function drawCell(c, x, y, s, idx, hi, isExport){
  var p = PALETTE[idx];
  c.fillStyle = p.h;
  /* v326：四周外扩 0.5px —— 非整数缩放下 fillRect 浮点坐标会有亚像素缝隙，
     暗背景从缝里透出来像网格线（画布纸半透明后尤其明显）；同色相邻格重叠 0.5px 无视觉影响 */
  c.fillRect(x - 0.5, y - 0.5, s + 1, s + 1);
  if (state.showCodes && s >= 12){
    var rgb = hexToRgb(p.h);
    var lum = (rgb[0] * 0.299 + rgb[1] * 0.587 + rgb[2] * 0.114) / 255;
    /* v310：导出模式字号不受 13px 屏幕上限 —— 大格子等比大字 */
    var fs = isExport ? s * 0.44 : Math.max(6, Math.min(s * 0.44, 13));
    /* v376：色号文字预渲染缓存 —— 104² 缩放时 fillText 上万次是卡顿主因，
       同 (色号×字号×深浅) 只渲染一次到离屏 canvas，绘制时 drawImage 贴上（快 3~5 倍） */
    var dark = lum >= 0.6 ? 0 : 1;
    var spr = codeSprite(p.id, fs, dark, isExport);
    if (spr){
      c.drawImage(spr, x + s/2 - spr.width / (2 * DPRC), y + s/2 + 0.5 - spr.height / (2 * DPRC),
                  spr.width / DPRC, spr.height / DPRC);
    } else {
      c.font = (isExport ? "400 " : "500 ") + fs.toFixed(1) + "px -apple-system,'PingFang SC',sans-serif";
      c.textAlign = "center"; c.textBaseline = "middle";
      c.fillStyle = dark ? "#FFFFFF" : "#1D1D1F";
      c.fillText(p.id, x + s/2, y + s/2 + 0.5);
    }
  }
  if (hi){
    /* v296：高亮框按豆色亮度自适应 —— H7/H16 深豆上黑框全部融掉，改白框 */
    c.lineWidth = 1.2;
    c.strokeStyle = lum < 0.5 ? "#FFFFFF" : "#111114";
    c.strokeRect(x + 1, y + 1, s - 2, s - 2);
  }
}

/* 取模（结果恒为正） */
function relMod(v, m){ return ((v % m) + m) % m; }
/* 主网格（每 10 格）居中分布：除不尽的余量平均分到两侧
   52 → 1 + 50 + 1、78 → 4 + 70 + 4、104 → 2 + 100 + 2 */
function gridOffset(n){ return Math.floor(relMod(n, 10) / 2); }
/* v87：画布与导出共用同一套主线偏移 —— 以前画布居中、导出却从左边排，
   两边对不上。现在切到「自适应」后的尺寸就按 10 的倍数排，导出照抄画布。 */
function gridOffX(){ return state.gridAlign === "start" ? 0 : gridOffset(state.cols); }
function gridOffY(){ return state.gridAlign === "start" ? 0 : gridOffset(state.rows); }

/* 画一层的格子到给定 context。shx/shy 是移动工具的实时预览偏移 */
function drawLayerCells(c, g, cols, rows, s, shx, shy, allowHi){
  for (var y = 0; y < rows; y++){
    var py = y + shy;
    if (py < 0 || py >= rows) continue;
    for (var x = 0; x < cols; x++){
      var v = g[y*cols + x];
      if (!v) continue;
      var px = x + shx;
      if (px < 0 || px >= cols) continue;
      drawCell(c, px*s, py*s, s, v-1, allowHi && v-1 === state.highlight);
    }
  }
}
/* v380：非激活层离屏缓存（v312/v318）整体删除。
   缓存固定 12px/格，高倍缩放时上采样发虚，和激活层的直绘肉眼可见地不一样
   （用户实测：关掉上层眼睛透出的下层「不是真实的格子」）。
   逐格成本已被 v376 色号 sprite 缓存压低，所有可见图层直接走 drawLayerCells，
   激活/非激活由同一函数渲染，逐像素一致；也不再需要 _dirty/_cv 缓存标记。 */
/* v320：视口在画布坐标中的可见矩形（含离屏/目标物理换算与越界钳制） */
/* v378：无限画布虚拟偏移（canvas-pan 的 100vw/100vh padding）——
   "滚动坐标 → 画布内坐标"必须先减偏移，否则非激活层永远贴在画布错误的一侧 */
function panOffset(){
  var fr = canvasFrame.getBoundingClientRect(), srr = canvasScroll.getBoundingClientRect();
  return { x: fr.left - srr.left + canvasScroll.scrollLeft,
           y: fr.top - srr.top + canvasScroll.scrollTop };
}
/* v379：视口裁剪（v320）整体移除 —— 它有两个致命错误：
   1) dest 乘了 dpr：setupCanvas 已 setTransform(dpr)，drawImage 的 dest 是 CSS px，
      多乘一次 → 非激活层被整体放大 1 个 dpr 倍（iPad/视网膜 = 2×），
      这就是「复制图层后底图变成放大版」。
   2) 只画可见矩形，但滚动/拖拽平移根本没有重绘入口（全站只有一个 window scroll 监听，
      还是用来隐藏浮层的）→ 一滚，非激活层就只剩一条残影。
   改成整层 drawImage，由 GPU 做缩放，坐标永远对；代价是一次全画布 blit，
   但对比激活层逐格 drawCell（104² = 1 万次）本来就是小头。 */
/* v321：悬停框元素（JS 创建，canvas-stack 内随格移动） */
function ensureHoverBox(){
  if (document.getElementById("hoverBox")) return;
  var hb = document.createElement("div");
  hb.id = "hoverBox";
  canvasStack.appendChild(hb);
}
function renderGrid(){
  var sp = sizePx(), c = setupCanvas(gridCanvas, sp.w, sp.h), s = cellPx();
  c.clearRect(0, 0, sp.w, sp.h);          // 空格保持透明，露出棋盘格底

  var cols = state.cols, rows = state.rows;
  var shx = shiftPrev ? shiftPrev.dx : 0, shy = shiftPrev ? shiftPrev.dy : 0;
  /* 从下到上叠加所有可见图层：上层的豆子盖住下层 */
  for (var li = 0; li < state.layers.length; li++){
    var L = state.layers[li];
    if (!L.visible) continue;
    var isAct = (li === state.active && !state.refActive);
    c.save();
    c.globalAlpha = clamp(L.opacity, 0, 1);
    /* v380：所有可见图层一律直绘（离屏缓存已删）——激活/非激活同一函数，逐像素一致 */
    drawLayerCells(c, L.grid, cols, rows, s, isAct ? shx : 0, isAct ? shy : 0, isAct);
    c.restore();
  }

  /* v326：图例选中聚焦 —— 选中色号后其余区域压暗，该色格子保持原样并带框，
     大图里一眼找到所有位置（原 1.2px 细框在照片底图上根本找不到） */
  if (state.highlight >= 0){
    c.fillStyle = "rgba(8,12,22,.52)";
    c.fillRect(0, 0, sp.w, sp.h);
    c.lineWidth = 2;
    for (var lf2 = 0; lf2 < state.layers.length; lf2++){
      var LF = state.layers[lf2];
      if (!LF.visible) continue;
      c.globalAlpha = clamp(LF.opacity, 0, 1);
      for (var gi2 = 0; gi2 < LF.grid.length; gi2++){
        if (LF.grid[gi2] === state.highlight + 1){
          drawCell(c, (gi2 % cols) * s, ((gi2 / cols) | 0) * s, s, state.highlight, true, false);
        }
      }
    }
    c.globalAlpha = 1;
  }

  // 形状预览
  if (pending){
    if (pending.tool === "eraser"){
      var ex0 = Math.min(pending.x0, pending.x1), ex1 = Math.max(pending.x0, pending.x1);
      var ey0 = Math.min(pending.y0, pending.y1), ey1 = Math.max(pending.y0, pending.y1);
      c.save();
      c.fillStyle = "rgba(255,255,255,.72)";

      c.strokeRect(ex0*s + .8, ey0*s + .8, (ex1 - ex0 + 1)*s - 1.6, (ey1 - ey0 + 1)*s - 1.6);
      c.restore();
    } else {
      c.save();
      c.globalAlpha = 0.55;
      var pts = shapePoints(pending);
      for (var i = 0; i < pts.length; i++){
        var p = pts[i];
        drawCell(c, p.x*s, p.y*s, s, state.colorIdx, false);
      }
      c.restore();
    }
  }

  if (state.showGrid){
    var i2, px, lw = Math.max(1, Math.min(1.4, s * 0.06));
    var offX = gridOffX(), offY = gridOffY();
    // 每格细线（v222：跳过口径 5→10，虚线已删不再留大缺口；位置不取整，间距均匀）
    c.lineWidth = 1; c.strokeStyle = "rgba(17,17,20,.26)";   /* v309：纸 40% 后空格≈中灰，线加深 */
    c.beginPath();
    for (i2 = 1; i2 < cols; i2++){
      if (relMod(i2 - offX, 10) === 0) continue;
      px = i2*s;
      c.moveTo(px, 0); c.lineTo(px, sp.h);
    }
    for (i2 = 1; i2 < rows; i2++){
      if (relMod(i2 - offY, 10) === 0) continue;
      px = i2*s;
      c.moveTo(0, px); c.lineTo(sp.w, px);
    }
    c.stroke();
    /* v219：每 5 格虚线取消 —— 画布上只保留两档线（细格 + 每 10 格），更干净 */
    // 每 10 格：实线加粗
    c.lineWidth = Math.max(1.2, Math.min(1.6, s * 0.07));
    c.strokeStyle = "rgba(17,17,20,.38)";
    c.beginPath();
    for (i2 = 1; i2 < cols; i2++){
      if (relMod(i2 - offX, 10) !== 0) continue;
      px = i2*s;
      c.moveTo(px, 0); c.lineTo(px, sp.h);
    }
    for (i2 = 1; i2 < rows; i2++){
      if (relMod(i2 - offY, 10) !== 0) continue;
      px = i2*s;
      c.moveTo(0, px); c.lineTo(sp.w, px);
    }
    c.stroke();
    // 外框
    c.lineWidth = Math.max(1.2, Math.min(1.6, s * 0.07));
    c.strokeStyle = "rgba(17,17,20,.38)";
    c.strokeRect(lw, lw, sp.w - lw*2, sp.h - lw*2);   /* v354：四周内缩，右/下边缘线不被圆角裁 */
  }

  /* 悬停高亮：把「鼠标正下方的那一格」画出来 —— 所见即所画，
     避免格子小 / 底图叠加时判断不了点在哪一格 */
  if (hoverCell >= 0){

    var lw2 = Math.max(1.2, Math.min(1.8, s * 0.08));
    /* v286：按格子颜色亮度自动选主框色 —— 深色豆上黑外框融进豆里（H7/H16 实测），改白外框+黑内框 */
    var gv = (state.layers[state.active] && state.layers[state.active].grid) ? state.layers[state.active].grid[hoverCell] : 0;
    var hex = gv ? (PALETTE[gv - 1] ? PALETTE[gv - 1].h : null) : null;
    var dark = false;
    if (hex){
      var rr = parseInt(hex.substr(1, 2), 16), gg = parseInt(hex.substr(3, 2), 16), bb = parseInt(hex.substr(5, 2), 16);
      dark = (0.299 * rr + 0.587 * gg + 0.114 * bb) < 140;

    var inner = dark ? "rgba(17,17,20,.55)" : "rgba(255,255,255,.9)";
